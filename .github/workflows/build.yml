name: Build TrollMusicApp

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Directory Structure
        run: |
          mkdir -p TrollMusicApp/TrollMusicApp/Preview\ Content
          mkdir -p DummyAssets
          mkdir -p TrollMusicApp/TrollMusicApp

      - name: Clean Environment
        run: |
          find TrollMusicApp -name "Info.plist" -delete 2>/dev/null || true
          find TrollMusicApp -name "*.swift" -delete 2>/dev/null || true
          rm -rf TrollMusicApp/*.xcodeproj || true

      - name: Create Info.plist
        run: |
          cat << 'PLIST' > TrollMusicApp/TrollMusicApp/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.ahmedsoliman.trollmusicapp</string>
              <key>CFBundleName</key>
              <string>AS Music</string>
              <key>CFBundleExecutable</key>
              <string>TrollMusicApp</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          PLIST

      - name: Create project.yml
        run: |
          cat << 'PROJ' > project.yml
          name: TrollMusicApp
          options:
            bundleIdPrefix: com.ahmedsoliman
          targets:
            TrollMusicApp:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: TrollMusicApp/TrollMusicApp
                  excludes:
                    - "Preview Content"
                    - "**/*.plist"
              info:
                path: TrollMusicApp/TrollMusicApp/Info.plist
              settings:
                ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          PROJ

      - name: Write TrollMusicAppApp.swift
        run: |
          cat << 'SWIFT' > TrollMusicApp/TrollMusicApp/TrollMusicAppApp.swift
          import SwiftUI
          import AVFoundation
          
          class AppDelegate: NSObject, UIApplicationDelegate {
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey : Any]? = nil) -> Bool {
                  do {
                      try AVAudioSession.sharedInstance().setCategory(.playback, mode: .default, options: [])
                      try AVAudioSession.sharedInstance().setActive(true)
                      UIApplication.shared.beginReceivingRemoteControlEvents()
                  } catch { print("Background Audio Setup Failed") }
                  return true
              }
          }
          
          @main
          struct TrollMusicAppApp: App {
              @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate
              var body: some Scene {
                  WindowGroup {
                      MainTabView().environmentObject(MusicManager.shared)
                  }
              }
          }
          SWIFT

      - name: Write MusicManager.swift
        run: |
          cat << 'SWIFT' > TrollMusicApp/TrollMusicApp/MusicManager.swift
          import Foundation
          import AVFoundation
          import MediaPlayer
          import SwiftUI
          
          struct Song: Identifiable, Codable, Equatable {
              var id: UUID
              var title: String
              var url: URL
          }
          
          struct Playlist: Identifiable, Codable {
              var id: UUID
              var name: String
              var songIDs: [UUID]
          }
          
          class MusicManager: NSObject, ObservableObject, AVAudioPlayerDelegate {
              static let shared = MusicManager()
              @Published var songs: [Song] = []
              @Published var playlists: [Playlist] = []
              @Published var currentSong: Song?
              @Published var isPlaying: Bool = false
              @Published var isShuffle: Bool = false
              @Published var sleepTimerMinutes: Int = 0
              @Published var currentTime: TimeInterval = 0.0
              @Published var duration: TimeInterval = 1.0
              
              var audioPlayer: AVAudioPlayer?
              var avPlayer: AVPlayer?
              var useAVPlayer = false
              var sleepTimer: Timer?
              var progressTimer: Timer?
              
              let fileManager = FileManager.default
              var documentsDirectory: URL { fileManager.urls(for: .documentDirectory, in: .userDomainMask)[0] }
              
              override init() {
                  super.init()
                  loadSongs()
                  loadPlaylists()
                  setupRemoteCommandCenter()
              }
              
              func startProgressTimer() {
                  progressTimer?.invalidate()
                  progressTimer = Timer.scheduledTimer(withTimeInterval: 0.5, repeats: true) { [weak self] _ in
                      guard let self = self else { return }
                      DispatchQueue.main.async {
                          if self.useAVPlayer {
                              self.currentTime = self.avPlayer?.currentTime().seconds ?? 0.0
                              let d = self.avPlayer?.currentItem?.duration.seconds ?? 0.0
                              self.duration = (d.isNaN || d.isInfinite) ? 1.0 : d
                          } else {
                              self.currentTime = self.audioPlayer?.currentTime ?? 0.0
                              self.duration = self.audioPlayer?.duration ?? 1.0
                          }
                      }
                  }
              }
              
              func seek(to time: TimeInterval) {
                  if useAVPlayer {
                      avPlayer?.seek(to: CMTime(seconds: time, preferredTimescale: 1000))
                  } else {
                      audioPlayer?.currentTime = time
                  }
                  updateNowPlayingInfo()
              }
              
              func loadSongs() {
                  do {
                      let files = try fileManager.contentsOfDirectory(at: documentsDirectory, includingPropertiesForKeys: nil)
                      let audioFiles = files.filter { ["mp3", "m4a", "wav", "webm", "mp4"].contains($0.pathExtension.lowercased()) }
                      for file in audioFiles {
                          try? fileManager.setAttributes([.protectionKey: FileProtectionType.none], ofItemAtPath: file.path)
                      }
                      DispatchQueue.main.async {
                          self.songs = audioFiles.map { url in
                              Song(id: UUID(), title: url.deletingPathExtension().lastPathComponent, url: url)
                          }.sorted { $0.title < $1.title }
                      }
                  } catch {}
              }
              
              func deleteSong(_ song: Song) {
                  try? fileManager.removeItem(at: song.url)
                  loadSongs()
              }
              
              func renameSong(song: Song, newName: String) {
                  let ext = song.url.pathExtension
                  let newUrl = documentsDirectory.appendingPathComponent("\(newName).\(ext)")
                  do {
                      try fileManager.moveItem(at: song.url, to: newUrl)
                      loadSongs()
                      if currentSong?.id == song.id {
                          currentSong?.title = newName
                          currentSong?.url = newUrl
                          updateNowPlayingInfo()
                      }
                  } catch {}
              }
              
              func createPlaylist(name: String) {
                  playlists.append(Playlist(id: UUID(), name: name, songIDs: []))
                  savePlaylists()
              }
              
              func addSongToPlaylist(song: Song, playlist: Playlist) {
                  if let index = playlists.firstIndex(where: { $0.id == playlist.id }) {
                      if !playlists[index].songIDs.contains(song.id) {
                          playlists[index].songIDs.append(song.id)
                          savePlaylists()
                      }
                  }
              }
              
              func toggleFavorite(song: Song) {
                  if playlists.isEmpty || playlists[0].name != "Liked Songs" {
                      playlists.insert(Playlist(id: UUID(), name: "Liked Songs", songIDs: []), at: 0)
                  }
                  if playlists[0].songIDs.contains(song.id) {
                      playlists[0].songIDs.removeAll { $0 == song.id }
                  } else {
                      playlists[0].songIDs.append(song.id)
                  }
                  savePlaylists()
                  self.objectWillChange.send()
              }
              
              func isFavorite(song: Song) -> Bool {
                  guard !playlists.isEmpty, playlists[0].name == "Liked Songs" else { return false }
                  return playlists[0].songIDs.contains(song.id)
              }
              
              func savePlaylists() {
                  if let encoded = try? JSONEncoder().encode(playlists) {
                      UserDefaults.standard.set(encoded, forKey: "savedPlaylists")
                  }
              }
              
              func loadPlaylists() {
                  if let data = UserDefaults.standard.data(forKey: "savedPlaylists"),
                     let decoded = try? JSONDecoder().decode([Playlist].self, from: data) {
                      playlists = decoded
                  }
                  if playlists.isEmpty || playlists[0].name != "Liked Songs" {
                      playlists.insert(Playlist(id: UUID(), name: "Liked Songs", songIDs: []), at: 0)
                      savePlaylists()
                  }
              }
              
              func setSleepTimer(minutes: Int) {
                  sleepTimerMinutes = minutes
                  sleepTimer?.invalidate()
                  if minutes > 0 {
                      sleepTimer = Timer.scheduledTimer(withTimeInterval: TimeInterval(minutes * 60), repeats: false) { [weak self] _ in
                          DispatchQueue.main.async {
                              if self?.useAVPlayer == true {
                                  self?.avPlayer?.pause()
                              } else {
                                  self?.audioPlayer?.pause()
                              }
                              self?.isPlaying = false
                          }
                      }
                  }
              }
              
              func playSong(_ song: Song) {
                  do {
                      try AVAudioSession.sharedInstance().setCategory(.playback, mode: .default, options: [])
                      try AVAudioSession.sharedInstance().setActive(true)
                      UIApplication.shared.beginReceivingRemoteControlEvents()
                      
                      audioPlayer?.stop()
                      avPlayer?.pause()
                      NotificationCenter.default.removeObserver(self, name: .AVPlayerItemDidPlayToEndTime, object: nil)
                      
                      do {
                          audioPlayer = try AVAudioPlayer(contentsOf: song.url)
                          audioPlayer?.delegate = self
                          audioPlayer?.prepareToPlay()
                          audioPlayer?.play()
                          useAVPlayer = false
                      } catch {
                          let playerItem = AVPlayerItem(url: song.url)
                          avPlayer = AVPlayer(playerItem: playerItem)
                          avPlayer?.play()
                          useAVPlayer = true
                          NotificationCenter.default.addObserver(self, selector: #selector(songFinished), name: .AVPlayerItemDidPlayToEndTime, object: playerItem)
                      }
                      currentSong = song
                      isPlaying = true
                      updateNowPlayingInfo()
                      startProgressTimer()
                  } catch {}
              }
              
              @objc func songFinished() {
                  DispatchQueue.main.async { self.playNext() }
              }
              
              func audioPlayerDidFinishPlaying(_ player: AVAudioPlayer, successfully flag: Bool) {
                  DispatchQueue.main.async { self.playNext() }
              }
              
              func togglePlayPause() {
                  if useAVPlayer {
                      if isPlaying { avPlayer?.pause() } else { avPlayer?.play() }
                  } else {
                      if isPlaying { audioPlayer?.pause() } else { audioPlayer?.play() }
                  }
                  isPlaying.toggle()
                  updateNowPlayingInfo()
              }
              
              func playNext() {
                  guard !songs.isEmpty else { return }
                  if isShuffle {
                      if let randomSong = songs.randomElement() { playSong(randomSong) }
                  } else {
                      guard let current = currentSong, let index = songs.firstIndex(of: current) else { return }
                      playSong(songs[(index + 1) % songs.count])
                  }
              }
              
              func playPrevious() {
                  guard !songs.isEmpty else { return }
                  if isShuffle {
                      if let randomSong = songs.randomElement() { playSong(randomSong) }
                  } else {
                      guard let current = currentSong, let index = songs.firstIndex(of: current) else { return }
                      playSong(songs[(index - 1 + songs.count) % songs.count])
                  }
              }
              
              func setupRemoteCommandCenter() {
                  let commandCenter = MPRemoteCommandCenter.shared()
                  commandCenter.playCommand.addTarget { [weak self] _ in
                      guard let self = self else { return .commandFailed }
                      if self.isPlaying { return .commandFailed }
                      self.togglePlayPause()
                      return .success
                  }
                  commandCenter.pauseCommand.addTarget { [weak self] _ in
                      guard let self = self else { return .commandFailed }
                      if !self.isPlaying { return .commandFailed }
                      self.togglePlayPause()
                      return .success
                  }
                  commandCenter.nextTrackCommand.addTarget { [weak self] _ in
                      self?.playNext()
                      return .success
                  }
                  commandCenter.previousTrackCommand.addTarget { [weak self] _ in
                      self?.playPrevious()
                      return .success
                  }
              }
              
              func updateNowPlayingInfo() {
                  guard let currentSong = currentSong else { return }
                  var info = [String: Any]()
                  info[MPMediaItemPropertyTitle] = currentSong.title
                  info[MPMediaItemPropertyArtist] = "AS Music"
                  info[MPNowPlayingInfoPropertyPlaybackRate] = isPlaying ? 1.0 : 0.0
                  if useAVPlayer {
                      let duration = avPlayer?.currentItem?.duration.seconds ?? 0.0
                      if !duration.isNaN {
                          info[MPMediaItemPropertyPlaybackDuration] = duration
                          info[MPNowPlayingInfoPropertyElapsedPlaybackTime] = avPlayer?.currentTime().seconds
                      }
                  } else {
                      if let duration = audioPlayer?.duration {
                          info[MPMediaItemPropertyPlaybackDuration] = duration
                          info[MPNowPlayingInfoPropertyElapsedPlaybackTime] = audioPlayer?.currentTime
                      }
                  }
                  MPNowPlayingInfoCenter.default().nowPlayingInfo = info
              }
          }
          SWIFT

      - name: Write MainTabView.swift
        run: |
          cat << 'SWIFT' > TrollMusicApp/TrollMusicApp/MainTabView.swift
          import SwiftUI
          
          struct MainTabView: View {
              @EnvironmentObject var musicManager: MusicManager
              
              var body: some View {
                  TabView {
                      SongsView()
                          .tabItem {
                              Label("Songs", systemImage: "music.note.list")
                          }
                      
                      PlaylistsView()
                          .tabItem {
                              Label("Playlists", systemImage: "list.bullet")
                          }
                      
                      NowPlayingView()
                          .tabItem {
                              Label("Now Playing", systemImage: "play.circle.fill")
                          }
                  }
              }
          }
          
          struct SongsView: View {
              @EnvironmentObject var musicManager: MusicManager
              
              var body: some View {
                  NavigationView {
                      List(musicManager.songs) { song in
                          HStack {
                              VStack(alignment: .leading) {
                                  Text(song.title).font(.headline)
                              }
                              Spacer()
                              Button(action: { musicManager.playSong(song) }) {
                                  Image(systemName: "play.fill")
                              }
                          }
                      }
                      .navigationTitle("Songs")
                  }
              }
          }
          
          struct PlaylistsView: View {
              @EnvironmentObject var musicManager: MusicManager
              
              var body: some View {
                  NavigationView {
                      List(musicManager.playlists) { playlist in
                          NavigationLink(destination: PlaylistDetailView(playlist: playlist)) {
                              Text(playlist.name)
                          }
                      }
                      .navigationTitle("Playlists")
                  }
              }
          }
          
          struct PlaylistDetailView: View {
              @EnvironmentObject var musicManager: MusicManager
              let playlist: Playlist
              
              var playlistSongs: [Song] {
                  musicManager.songs.filter { playlist.songIDs.contains($0.id) }
              }
              
              var body: some View {
                  List(playlistSongs) { song in
                      HStack {
                          Text(song.title)
                          Spacer()
                          Button(action: { musicManager.playSong(song) }) {
                              Image(systemName: "play.fill")
                          }
                      }
                  }
                  .navigationTitle(playlist.name)
              }
          }
          
          struct NowPlayingView: View {
              @EnvironmentObject var musicManager: MusicManager
              
              var body: some View {
                  VStack(spacing: 20) {
                      Text(musicManager.currentSong?.title ?? "No Song Playing")
                          .font(.title2)
                          .padding()
                      
                      Slider(value: .constant(musicManager.currentTime), in: 0...max(musicManager.duration, 1))
                          .padding()
                      
                      HStack {
                          Button(action: { musicManager.playPrevious() }) {
                              Image(systemName: "backward.fill")
                          }
                          
                          Button(action: { musicManager.togglePlayPause() }) {
                              Image(systemName: musicManager.isPlaying ? "pause.fill" : "play.fill")
                          }
                          
                          Button(action: { musicManager.playNext() }) {
                              Image(systemName: "forward.fill")
                          }
                      }
                      
                      Spacer()
                  }
                  .padding()
              }
          }
          
          #Preview {
              MainTabView().environmentObject(MusicManager.shared)
          }
          SWIFT

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project TrollMusicApp.xcodeproj \
            -scheme TrollMusicApp \
            -archivePath build/TrollMusicApp.xcarchive \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollMusicApp-Archive
          path: build/TrollMusicApp.xcarchive
