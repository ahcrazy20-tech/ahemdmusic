          import Foundation
          import UIKit
          import SwiftUI
          import AVFoundation
          import WebKit
          import os.log
          import Combine

          // ---------------------------------------------------------------------------
          // MARK: - Logging
          // ---------------------------------------------------------------------------
          fileprivate let log = Logger(subsystem: "com.ahmedsoliman.trollmusicapp", category: "MagicDL")

          // ---------------------------------------------------------------------------
          // MARK: - Normalised search result model
          // ---------------------------------------------------------------------------
          enum SearchResultSource: String, Codable {
              case soundcloud, itunes, deezer, youtube
          }

          struct SearchResult: Identifiable, Equatable {
              let id = UUID()
              let source: SearchResultSource
              let title: String
              let artist: String
              let duration: TimeInterval?
              let artworkURL: URL?
              let previewURL: URL?
              let downloadURL: URL
              /// Strategy hint for the downloader: "cobalt" for video sites, "direct" for direct audio links.
              var downloadStrategy: DownloadStrategy {
                  let u = downloadURL.absoluteString.lowercased()
                  if u.contains("youtube.com") || u.contains("youtu.be") { return .piped }
                  if u.contains("results?search_query") { return .piped }
                  if u.contains("soundcloud.com") { return .soundcloud }
                  if u.contains("tiktok.com") || u.contains("twitter.com") || u.contains("x.com")
                      || u.contains("instagram.com") || u.contains("audiomack.com")
                      || u.contains("bandcamp.com") || u.contains("reddit.com") {
                      return .cobalt
                  }
                  if u.contains("spotify") || u.contains("music.apple.com") || u.contains("deezer.com") {
                      return .piped
                  }
                  return .direct
              }
              var durationFormatted: String {
                  guard let d = duration else { return "" }
                  let s = Int(d)
                  return "• " + String(format: "%d:%02d", s / 60, s % 60)
              }
              static func == (lhs: SearchResult, rhs: SearchResult) -> Bool { lhs.id == rhs.id }
          }

          enum DownloadStrategy { case piped, cobalt, soundcloud, direct }

          // ---------------------------------------------------------------------------
          // MARK: - Shared Download Center (observable from any tab)
          // ---------------------------------------------------------------------------
          enum DownloadTaskStatus: Equatable {
              case queued
              case contacting(Double)       // server index
              case downloading(Double)     // 0..1
              case extracting
              case done
              case failed(String)
          }

          class DownloadTask: ObservableObject, Identifiable {
              let id = UUID()
              let sourceURL: URL
              let proposedName: String
              @Published var status: DownloadTaskStatus = .queued
              @Published var fileName: String = ""
              init(sourceURL: URL, proposedName: String) {
                  self.sourceURL = sourceURL
                  self.proposedName = proposedName
              }
          }

          class DownloadCenter: NSObject, ObservableObject, URLSessionDownloadDelegate {
              static let shared = DownloadCenter()

              @Published var tasks: [DownloadTask] = []
              @Published var showBanner: Bool = false

              private var session: URLSession!
              private var activeTask: DownloadTask?
              private var activeURLTask: URLSessionDownloadTask?
              private var cobaltAttempt = 0
              private var pipedAttempt = 0

              override private init() {
                  super.init()
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest = 20
                  config.timeoutIntervalForResource = 120
                  session = URLSession(configuration: config, delegate: self, delegateQueue: nil)
              }

              // ---- public API -------------------------------------------------------
              /// Enqueue a download. `suggestedName` is pre-filled; the caller can pass
              /// the raw page title or link text so the user sees a sensible default.
              func enqueue(url: URL, suggestedName: String = "Track") {
                  var name = suggestedName
                      .replacingOccurrences(of: "/", with: "-")
                      .trimmingCharacters(in: .whitespacesAndNewlines)
                  if name.isEmpty { name = "Track" }
                  if !name.lowercased().hasSuffix(".mp3") && !name.lowercased().hasSuffix(".m4a") {
                      name += ".mp3"
                  }
                  let task = DownloadTask(sourceURL: url, proposedName: name)
                  DispatchQueue.main.async {
                      self.objectWillChange.send()
                      self.tasks.insert(task, at: 0)
                      self.showBanner = true
                      if self.activeTask == nil { self.startNext() }
                  }
              }

              func retry(_ task: DownloadTask) {
                  DispatchQueue.main.async {
                      self.objectWillChange.send()
                      task.status = .queued
                      if self.activeTask == nil { self.startNext() }
                  }
              }

              func clearCompleted() {
                  DispatchQueue.main.async {
                      self.objectWillChange.send()
                      self.tasks.removeAll { if case .done = $0.status { return true }; return false }
                      if self.tasks.isEmpty { self.showBanner = false }
                  }
              }

              func dismiss() {
                  DispatchQueue.main.async { self.showBanner = false }
              }

              // ---- queue driver -----------------------------------------------------
              private func startNext() {
                  guard let next = tasks.first(where: {
                      if case .queued = $0.status { return true }; return false
                  }) else {
                      activeTask = nil
                      return
                  }
                  activeTask = next
                  beginDownload(task: next)
              }

              private func beginDownload(task: DownloadTask) {
                  let name = task.proposedName
                  DispatchQueue.main.async { self.objectWillChange.send(); task.fileName = name }
                  let url = task.sourceURL
                  // Resolve YouTube search results pages to a watch URL first
                  if url.absoluteString.contains("youtube.com/results"),
                     let q = URLComponents(string: url.absoluteString)?.queryItems?
                      .first(where: { $0.name == "search_query" })?.value {
                      resolveYouTubeSearch(query: q) { [weak self] watchUrl in
                          guard let self = self else { return }
                          if let w = watchUrl {
                              self.pipedAttempt = 0
                              self.downloadViaPiped(task: task, watchUrl: w, name: name)
                          } else {
                              self.fail(task: task, message: "Could not resolve YouTube search.")
                          }
                      }
                      return
                  }
                  cobaltAttempt = 0
                  pipedAttempt = 0
                  let strat = self.strategy(for: url)
                  switch strat {
                  case .piped:
                      downloadViaPiped(task: task, watchUrl: url, name: name)
                  case .soundcloud:
                      tryDirectSoundCloud(task: task, permalink: url, name: name)
                  case .cobalt:
                      downloadViaCobalt(task: task, url: url, name: name)
                  case .direct:
                      downloadDirect(task: task, url: url, name: name)
                  }
              }

              private func strategy(for url: URL) -> DownloadStrategy {
                  let u = url.absoluteString.lowercased()
                  if u.contains("youtube.com") || u.contains("youtu.be") { return .piped }
                  if u.contains("results?search_query=") { return .piped }
                  if u.contains("soundcloud.com") { return .soundcloud }
                  let cobaltHosts = ["tiktok.com","twitter.com","x.com","instagram.com",
                                     "audiomack.com","bandcamp.com","reddit.com"]
                  if cobaltHosts.contains(where: { u.contains($0) }) { return .cobalt }
                  if u.contains("spotify") || u.contains("music.apple.com") || u.contains("deezer.com") {
                      return .piped
                  }
                  let ext = (u as NSString).pathExtension.lowercased()
                  if ["mp3","m4a","wav","webm","ogg","aac"].contains(ext) { return .direct }
                  return .cobalt
              }

              private func finish(task: DownloadTask) {
                  DispatchQueue.main.async {
                      task.status = .done
                      MusicManager.shared.loadSongs()
                      self.activeTask = nil
                      self.startNext()
                  }
              }
              private func fail(task: DownloadTask, message: String) {
                  DispatchQueue.main.async {
                      task.status = .failed(message)
                      log.error("Download failed: \(message, privacy: .public)")
                      self.activeTask = nil
                      self.startNext()
                  }
              }

              // ---- direct download --------------------------------------------------
              private func downloadDirect(task: DownloadTask, url: URL, name: String) {
                  DispatchQueue.main.async { self.objectWillChange.send(); task.status = .downloading(0) }
                  var req = URLRequest(url: url, timeoutInterval: 30)
                  req.setValue("Mozilla/5.0", forHTTPHeaderField: "User-Agent")
                  let t = session.downloadTask(with: req)
                  activeURLTask = t
                  t.resume()
              }

              // ---- YouTube via Piped (direct audio streams, no Cloudflare) ----------
              private func pipedInstances() -> [String] {
                  [
                      "https://pipedapi.kavin.rocks",
                      "https://pipedapi.adminforge.de",
                      "https://api.piped.private.coffee",
                      "https://pipedapi.leptons.xyz",
                      "https://pipedapi.nosebs.ru",
                      "https://piped-api.privacy.com.de",
                      "https://pipedapi.drgns.space",
                      "https://pipedapi.in.projectsegfau.lt"
                  ]
              }

              private func extractVideoId(from url: URL) -> String? {
                  let s = url.absoluteString
                  if s.contains("youtu.be/") {
                      if let c = s.components(separatedBy: "youtu.be/").last?.split(separator: "?").first {
                          return String(c)
                      }
                  }
                  if s.contains("youtube.com/watch"),
                     let items = URLComponents(string: s)?.queryItems,
                     let v = items.first(where: { $0.name == "v" })?.value {
                      return v
                  }
                  if s.contains("/shorts/"),
                     let tail = s.components(separatedBy: "/shorts/").last?.split(separator: "?").first {
                      return String(tail)
                  }
                  if s.contains("/embed/"),
                     let tail = s.components(separatedBy: "/embed/").last?.split(separator: "?").first {
                      return String(tail)
                  }
                  return nil
              }

              private func downloadViaPiped(task: DownloadTask, watchUrl: URL, name: String) {
                  let instances = pipedInstances()
                  guard pipedAttempt < instances.count else {
                      // fall back to cobalt if Piped fails
                      cobaltAttempt = 0
                      downloadViaCobalt(task: task, url: watchUrl, name: name)
                      return
                  }
                  guard let vid = extractVideoId(from: watchUrl) else {
                      fail(task: task, message: "Could not extract YouTube video ID.")
                      return
                  }
                  let server = instances[pipedAttempt]
                  DispatchQueue.main.async {
                      self.objectWillChange.send()
                      task.status = .contacting(Double(self.pipedAttempt + 1) / Double(instances.count))
                  }
                  pipedAttempt += 1
                  guard let streamsUrl = URL(string: server + "/streams/" + vid) else {
                      downloadViaPiped(task: task, watchUrl: watchUrl, name: name); return
                  }
                  var req = URLRequest(url: streamsUrl, timeoutInterval: 15)
                  req.setValue("Mozilla/5.0", forHTTPHeaderField: "User-Agent")
                  URLSession.shared.dataTask(with: req) { [weak self] data, resp, err in
                      guard let self = self else { return }
                      if let err = err {
                          log.warning("piped \(server) err: \(err.localizedDescription)")
                          DispatchQueue.global().asyncAfter(deadline: .now() + 0.2) {
                              self.downloadViaPiped(task: task, watchUrl: watchUrl, name: name)
                          }
                          return
                      }
                      guard let data = data,
                            let http = resp as? HTTPURLResponse, http.statusCode == 200 else {
                          DispatchQueue.global().asyncAfter(deadline: .now() + 0.2) {
                              self.downloadViaPiped(task: task, watchUrl: watchUrl, name: name)
                          }
                          return
                      }
                      guard let json = try? JSONSerialization.jsonObject(with: data) as? [String:Any],
                            let audioStreams = json["audioStreams"] as? [[String:Any]] else {
                          DispatchQueue.global().asyncAfter(deadline: .now() + 0.2) {
                              self.downloadViaPiped(task: task, watchUrl: watchUrl, name: name)
                          }
                          return
                      }
                      // Pick highest-bitrate audio stream; prefer m4a then webm/opus
                      let preferred = audioStreams
                          .compactMap { s -> (url: String, br: Int, mime: String)? in
                              guard let u = s["url"] as? String else { return nil }
                              let br = (s["bitrate"] as? NSNumber)?.intValue ?? 0
                              let mime = (s["mimeType"] as? String) ?? ""
                              return (u, br, mime)
                          }
                          .sorted { a, b in
                              // prefer m4a/mp4 first
                              let aMp4 = a.mime.contains("mp4") || a.mime.contains("m4a") || a.mime.contains("aac")
                              let bMp4 = b.mime.contains("mp4") || b.mime.contains("m4a") || b.mime.contains("aac")
                              if aMp4 != bMp4 { return aMp4 && !bMp4 }
                              return a.br > b.br
                          }
                      guard let best = preferred.first, let audioUrl = URL(string: best.url) else {
                          DispatchQueue.global().asyncAfter(deadline: .now() + 0.2) {
                              self.downloadViaPiped(task: task, watchUrl: watchUrl, name: name)
                          }
                          return
                      }
                      // Pick extension based on the stream's MIME type
                      let ext: String
                      if best.mime.contains("mp4") || best.mime.contains("m4a") || best.mime.contains("aac") { ext = "m4a" }
                      else if best.mime.contains("webm") { ext = "webm" }
                      else if best.mime.contains("opus") || best.mime.contains("ogg") { ext = "opus" }
                      else { ext = "m4a" }

                      // Use the title returned from Piped as the filename whenever possible.
                      var finalName: String
                      if let title = json["title"] as? String, !title.isEmpty {
                          finalName = title.replacingOccurrences(of: "/", with: "-")
                              .trimmingCharacters(in: .whitespacesAndNewlines)
                      } else {
                          finalName = name
                      }
                      if finalName.isEmpty { finalName = "Track" }
                      let lower = finalName.lowercased()
                      if !lower.hasSuffix(".mp3") && !lower.hasSuffix(".m4a") && !lower.hasSuffix(".webm")
                          && !lower.hasSuffix(".opus") && !lower.hasSuffix(".wav") && !lower.hasSuffix(".aac") {
                          finalName += "." + ext
                      }
                      DispatchQueue.main.async { self.objectWillChange.send(); task.fileName = finalName }
                      self.startMediaDownload(task: task, url: audioUrl, name: finalName)
                  }.resume()
              }

              // ---- cobalt -----------------------------------------------------------
              private func servers() -> [String] {
                  [
                      "https://api.cobalt.tools",
                      "https://cobalt.api.timeless.top",
                      "https://co.wuk.sh",
                      "https://co.eepy.today",
                      "https://dl.imput.net",
                      "https://cobalt.playpriv.net",
                      "https://api.cobalt-backup.xyz"
                  ]
              }

              private func downloadViaCobalt(task: DownloadTask, url: URL, name: String) {
                  let servers = servers()
                  guard cobaltAttempt < servers.count else {
                      if url.absoluteString.contains("soundcloud.com") {
                          tryDirectSoundCloud(task: task, permalink: url, name: name)
                          return
                      }
                      fail(task: task, message: "All download servers failed. Try a different link or Magic DL search.")
                      return
                  }
                  let server = servers[cobaltAttempt]
                  DispatchQueue.main.async {
                      self.objectWillChange.send()
                      task.status = .contacting(Double(self.cobaltAttempt + 1) / Double(servers.count))
                  }
                  cobaltAttempt += 1

                  // Try v10 POST to "/"
                  cobaltRequest(server: server, path: "/", v10: true, url: url) { [weak self] audioUrl in
                      guard let self = self else { return }
                      if let a = audioUrl {
                          self.startMediaDownload(task: task, url: a, name: name)
                      } else {
                          // Try v7
                          self.cobaltRequest(server: server, path: "/api/json", v10: false, url: url) { audioUrl2 in
                              if let a = audioUrl2 {
                                  self.startMediaDownload(task: task, url: a, name: name)
                              } else {
                                  // next server
                                  DispatchQueue.global().asyncAfter(deadline: .now() + 0.3) {
                                      self.downloadViaCobalt(task: task, url: url, name: name)
                                  }
                              }
                          }
                      }
                  }
              }

              private func cobaltRequest(server: String, path: String, v10: Bool,
                                         url: URL, completion: @escaping (URL?) -> Void) {
                  guard let comps = URLComponents(string: server + path) else { completion(nil); return }
                  guard let reqUrl = comps.url else { completion(nil); return }
                  var req = URLRequest(url: reqUrl, timeoutInterval: 12)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Accept")
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.setValue(server, forHTTPHeaderField: "Origin")
                  req.setValue(server + "/", forHTTPHeaderField: "Referer")
                  req.setValue("Mozilla/5.0", forHTTPHeaderField: "User-Agent")
                  let params: [String: Any] = v10
                      ? ["url": url.absoluteString, "downloadMode": "audio", "audioFormat": "mp3",
                         "filenameStyle": "basic"]
                      : ["url": url.absoluteString, "isAudioOnly": true, "aFormat": "mp3",
                         "isNoTTWatermark": true, "filenameStyle": "pretty"]
                  req.httpBody = try? JSONSerialization.data(withJSONObject: params)
                  URLSession.shared.dataTask(with: req) { data, resp, err in
                      if let err = err { log.warning("cobalt \(server) err: \(err.localizedDescription)"); completion(nil); return }
                      guard let data = data, let http = resp as? HTTPURLResponse, http.statusCode < 500 else {
                          completion(nil); return
                      }
                      do {
                          if let dict = try JSONSerialization.jsonObject(with: data) as? [String:Any] {
                              if let status = dict["status"] as? String, status == "error",
                                 let text = dict["text"] as? String {
                                  log.warning("cobalt error: \(text)")
                                  completion(nil); return
                              }
                              if let u = dict["url"] as? String, let a = URL(string: u) {
                                  // cobalt sometimes returns a "picker" array for multiple audio streams
                                  completion(a); return
                              }
                              if let picker = dict["picker"] as? [[String:Any]],
                                 let first = picker.first(where: { ($0["type"] as? String) == "audio" }),
                                 let u = first["url"] as? String, let a = URL(string: u) {
                                  completion(a); return
                              }
                              if let audio = dict["audio"] as? String, let a = URL(string: audio) {
                                  completion(a); return
                              }
                          }
                          completion(nil)
                      } catch {
                          completion(nil)
                      }
                  }.resume()
              }

              private func startMediaDownload(task: DownloadTask, url: URL, name: String) {
                  DispatchQueue.main.async { self.objectWillChange.send(); task.status = .downloading(0) }
                  var req = URLRequest(url: url, timeoutInterval: 60)
                  req.setValue("Mozilla/5.0", forHTTPHeaderField: "User-Agent")
                  req.setValue("bytes=0-", forHTTPHeaderField: "Range")
                  let t = session.downloadTask(with: req)
                  activeURLTask = t
                  t.resume()
              }

              // ---- URLSessionDownloadDelegate --------------------------------------
              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                              didWriteData bytesWritten: Int64, totalBytesWritten: Int64,
                              totalBytesExpectedToWrite: Int64) {
                  guard totalBytesExpectedToWrite > 0, let task = activeTask else { return }
                  let p = Double(totalBytesWritten) / Double(totalBytesExpectedToWrite)
                  DispatchQueue.main.async { self.objectWillChange.send(); task.status = .downloading(p) }
              }

              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                              didFinishDownloadingTo location: URL) {
                  guard let task = activeTask else { return }
                  let fm = FileManager.default
                  guard let attrs = try? fm.attributesOfItem(atPath: location.path),
                        let size = attrs[.size] as? Int64, size > 20_000 else {
                      fail(task: task, message: "Downloaded file was too small (corrupt).")
                      return
                  }
                  var finalName = task.fileName
                  let audioExts = ["mp3","m4a","wav","webm","mp4","aac","ogg","opus"]
                  let fl = finalName.lowercased()
                  if !audioExts.contains(where: { fl.hasSuffix("." + $0) }) { finalName += ".mp3" }
                  let destDir = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let destPath = destDir.appendingPathComponent(finalName)
                  try? fm.removeItem(at: destPath)
                  do {
                      try fm.moveItem(at: location, to: destPath)
                      try fm.setAttributes([.protectionKey: FileProtectionType.none], ofItemAtPath: destPath.path)
                  } catch {
                      fail(task: task, message: "Could not save file: \(error.localizedDescription)")
                      return
                  }
                  finish(task: task)
              }

              func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                  guard let err = error, let active = activeTask else { return }
                  if case .done = active.status { return }
                  if case .failed = active.status { return }
                  fail(task: active, message: err.localizedDescription)
              }

              // ---- YouTube search resolution via Innertube -------------------------
              private func resolveYouTubeSearch(query: String, completion: @escaping (URL?) -> Void) {
                  guard let url = URL(string: "https://www.youtube.com/youtubei/v1/search?prettyPrint=false") else {
                      completion(nil); return
                  }
                  var req = URLRequest(url: url, timeoutInterval: 10)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  let body: [String:Any] = [
                      "context": ["client": ["clientName":"WEB","clientVersion":"2.20240101.00.00","hl":"en","gl":"US"]],
                      "query": query
                  ]
                  req.httpBody = try? JSONSerialization.data(withJSONObject: body)
                  URLSession.shared.dataTask(with: req) { data, _, _ in
                      guard let data = data else { completion(nil); return }
                      func walk(_ obj: Any) -> String? {
                          if let d = obj as? [String:Any] {
                              if let vr = d["videoRenderer"] as? [String:Any],
                                 let vid = vr["videoId"] as? String, vid.count == 11 {
                                  return "https://www.youtube.com/watch?v=\(vid)"
                              }
                              for v in d.values { if let s = walk(v) { return s } }
                          } else if let a = obj as? [Any] {
                              for v in a { if let s = walk(v) { return s } }
                          }
                          return nil
                      }
                      let json = try? JSONSerialization.jsonObject(with: data)
                      if let s = walk(json as Any) { completion(URL(string: s)) } else { completion(nil) }
                  }.resume()
              }

              // ---- SoundCloud direct fallback (uses dynamic client_id) -------------
              private var scClientId: String?
              private func tryDirectSoundCloud(task: DownloadTask, permalink: URL, name: String) {
                  let resolve: (String) -> Void = { [weak self] cid in
                      guard let self = self else { return }
                      var comps = URLComponents(string: "https://api-v2.soundcloud.com/resolve")
                          ?? URLComponents()
                      comps.scheme = "https"
                      comps.host = "api-v2.soundcloud.com"
                      comps.path = "/resolve"
                      comps.queryItems = [URLQueryItem(name: "url", value: permalink.absoluteString),
                                          URLQueryItem(name: "client_id", value: cid)]
                      guard let u = comps.url else { self.fail(task: task, message: "SC resolve failed"); return }
                      DispatchQueue.main.async { task.status = .contacting(1) }
                      URLSession.shared.dataTask(with: u) { [weak self] data, _, _ in
                          guard let self = self else { return }
                          guard let data = data,
                                let d = try? JSONSerialization.jsonObject(with: data) as? [String:Any],
                                let stream = d["stream_url"] as? String,
                                let streamUrl = URL(string: stream + "?client_id=\(cid)") else {
                              self.fail(task: task, message: "SoundCloud stream extraction failed.")
                              return
                          }
                          self.startMediaDownload(task: task, url: streamUrl, name: name)
                      }.resume()
                  }
                  let bootstrapAndResolve: () -> Void = { [weak self] in
                      guard let self = self else { return }
                      guard let home = URL(string: "https://soundcloud.com/") else {
                          self.fail(task: task, message: "SC bootstrap fail"); return
                      }
                      URLSession.shared.dataTask(with: home) { [weak self] data, _, _ in
                          guard let self = self else { return }
                          guard let data = data,
                                let html = String(data: data, encoding: .utf8) else {
                              self.fail(task: task, message: "SC bootstrap fail"); return
                          }
                          let scriptPattern = #"https://a-v2\.sndcdn\.com/assets/[A-Za-z0-9_-]+\.js"#
                          guard let r = html.range(of: scriptPattern, options: .regularExpression),
                                let scriptUrl = URL(string: String(html[r])) else {
                              self.fail(task: task, message: "SC bootstrap fail"); return
                          }
                          URLSession.shared.dataTask(with: scriptUrl) { [weak self] jsData, _, _ in
                              guard let self = self else { return }
                              guard let jsData = jsData,
                                    let js = String(data: jsData, encoding: .utf8) else {
                                  self.fail(task: task, message: "SC bootstrap fail"); return
                              }
                              let cidPattern = #"client_id[:=]\s*["']([a-zA-Z0-9]{32})["']"#
                              guard let m = js.range(of: cidPattern, options: .regularExpression) else {
                                  self.fail(task: task, message: "SC client_id not found"); return
                              }
                              var cid = String(js[m])
                              cid = cid.replacingOccurrences(of: #"client_id[:=]\s*['"]"#, with: "", options: .regularExpression)
                              cid = cid.trimmingCharacters(in: CharacterSet(charactersIn: "'\""))
                              self.scClientId = cid
                              resolve(cid)
                          }.resume()
                      }.resume()
                  }
                  if let cid = scClientId { resolve(cid); return }
                  bootstrapAndResolve()
              }
          }

          // ---------------------------------------------------------------------------
          // MARK: - SoundCloud models (used only by search)
          // ---------------------------------------------------------------------------
          struct SCResponse: Codable { let collection: [SCTrack] }
          struct SCTrack: Codable {
              let id: Int
              let title: String?
              let user: SCUser?
              let duration: Int?
              let permalink_url: String?
              let artwork_url: String?
              let stream_url: String?
          }
          struct SCUser: Codable { let username: String? }

          struct ITunesResponse: Codable { let results: [ITunesTrack] }
          struct ITunesTrack: Codable {
              let trackName: String?
              let artistName: String?
              let trackTimeMillis: Int?
              let artworkUrl100: String?
              let previewUrl: String?
          }

          struct DeezerResponse: Codable { let data: [DeezerTrack] }
          struct DeezerTrack: Codable {
              let title: String?
              let artist: DeezerArtist?
              let duration: Int?
              let album: DeezerAlbum?
              let preview: String?
          }
          struct DeezerArtist: Codable { let name: String? }
          struct DeezerAlbum: Codable { let cover_medium: String? }

          // ---------------------------------------------------------------------------
          // MARK: - SmartDownloaderManager (UI state for Magic DL tab)
          // Now delegates actual downloading to DownloadCenter.shared.
          // ---------------------------------------------------------------------------
          class SmartDownloaderManager: NSObject, ObservableObject {
              @Published var isSearching = false
              @Published var statusMessage = ""
              @Published var showSuccess = false
              @Published var showError = false
              @Published var errorDetails = ""
              @Published var searchResults: [SearchResult] = []
              @Published var showSearchResults = false
              @Published var previewTrackId: UUID? = nil
              @Published var isPreviewPlaying = false

              @Published var pendingNameURL: URL?
              @Published var pendingNameSuggestion: String = ""
              @Published var showNamePrompt: Bool = false
              @Published var nameInput: String = ""

              var previewPlayer: AVPlayer?
              private var scClientId: String?
              private var scClientIdDate: Date?

              override init() {
                  super.init()
                  // Observe download center to relay statusMessage for HUD
                  NotificationCenter.default.addObserver(self, selector: #selector(downloadCenterChanged),
                                                         name: .downloadCenterChanged, object: nil)
              }
              deinit { NotificationCenter.default.removeObserver(self) }

              @objc private func downloadCenterChanged() {
                  // Update Magic DL HUD text from active task
                  DispatchQueue.main.async {
                      if let t = DownloadCenter.shared.tasks.first {
                          switch t.status {
                          case .queued: self.statusMessage = "Queued: \(t.proposedName)"
                          case .contacting(let p): self.statusMessage = String(format: "Contacting server (%.0f%%)...", p*100)
                          case .downloading(let p): self.statusMessage = String(format: "Downloading %@ ... %.0f%%", t.proposedName, p*100)
                          case .extracting: self.statusMessage = "Extracting..."
                          case .done: self.statusMessage = "Done."
                          case .failed(let m): self.statusMessage = "Error: \(m)"
                          }
                      }
                  }
              }

              // ---- preview ---------------------------------------------------------
              func togglePreview(for result: SearchResult) {
                  if previewTrackId == result.id { stopPreview(); return }
                  guard let url = result.previewURL else {
                      statusMessage = "No preview for this source"; return
                  }
                  previewPlayer?.pause()
                  previewPlayer = AVPlayer(url: url)
                  previewPlayer?.play()
                  DispatchQueue.main.async { self.previewTrackId = result.id; self.isPreviewPlaying = true }
              }
              func stopPreview() {
                  previewPlayer?.pause(); previewPlayer = nil
                  DispatchQueue.main.async { self.previewTrackId = nil; self.isPreviewPlaying = false }
              }

              // ---- name-prompt entry points ---------------------------------------
              func requestDownload(result: SearchResult) {
                  let name = "\(result.artist) - \(result.title)"
                      .replacingOccurrences(of: "/", with: "-")
                  pendingNameURL = result.downloadURL
                  pendingNameSuggestion = name
                  nameInput = name
                  showNamePrompt = true
              }
              func confirmNamedDownload() {
                  guard let url = pendingNameURL else { return }
                  showNamePrompt = false
                  DownloadCenter.shared.enqueue(url: url, suggestedName: nameInput)
                  pendingNameURL = nil
              }
              func requestLinkDownload(link: String, name: String) {
                  guard let url = URL(string: link.trimmingCharacters(in: .whitespacesAndNewlines)) else {
                      errorDetails = "Invalid URL"; showError = true; return
                  }
                  let suggested = name.isEmpty ? link : name
                  pendingNameURL = url
                  pendingNameSuggestion = suggested
                  nameInput = suggested
                  showNamePrompt = true
              }

              // ---- search ----------------------------------------------------------
              func performMagicSearch(query: String) {
                  let clean = query.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !clean.isEmpty else { return }
                  stopPreview()
                  DispatchQueue.main.async {
                      self.isSearching = true
                      self.statusMessage = "Searching across sources…"
                      self.searchResults = []
                      self.showSearchResults = false
                  }
                  let group = DispatchGroup()
                  var collected = [SearchResult]()
                  var errors = [String]()
                  let lock = NSLock()

                  func add(_ results: [SearchResult], _ err: String?) {
                      lock.lock(); defer { lock.unlock() }
                      if let e = err { errors.append(e) }
                      collected.append(contentsOf: results)
                  }

                  group.enter()
                  soundCloudSearch(query: clean) { r, e in add(r,e); group.leave() }
                  group.enter()
                  itunesSearch(query: clean) { r, e in add(r,e); group.leave() }
                  group.enter()
                  deezerSearch(query: clean) { r, e in add(r,e); group.leave() }
                  group.enter()
                  youtubeSearch(query: clean) { r, e in add(r,e); group.leave() }

                  group.notify(queue: .main) { [weak self] in
                      guard let self = self else { return }
                      self.isSearching = false
                      var seen = Set<String>()
                      let deduped = collected.filter {
                          seen.insert("\($0.title.lowercased())|\($0.artist.lowercased())").inserted
                      }
                      self.searchResults = deduped.sorted { a, b in
                          if (a.previewURL != nil) != (b.previewURL != nil) { return a.previewURL != nil }
                          return a.title.lowercased().hasPrefix(clean.lowercased())
                      }
                      if self.searchResults.isEmpty {
                          self.errorDetails = errors.isEmpty ? "No results found." : errors.joined(separator: "\n")
                          self.showError = true
                      } else {
                          self.showSearchResults = true
                      }
                  }
              }

              private func soundCloudSearch(query: String, completion: @escaping ([SearchResult], String?) -> Void) {
                  fetchSC { cid in
                      guard let cid = cid,
                            let encoded = query.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                            let url = URL(string: "https://api-v2.soundcloud.com/search/tracks?q=\(encoded)&client_id=\(cid)&limit=20") else {
                          completion([], "SoundCloud unavailable"); return
                      }
                      URLSession.shared.dataTask(with: url) { data, resp, err in
                          if let err = err { completion([], err.localizedDescription); return }
                          guard let data = data else { completion([], "empty"); return }
                          do {
                              let sc = try JSONDecoder().decode(SCResponse.self, from: data)
                              let out = sc.collection.compactMap { t -> SearchResult? in
                                  guard let title = t.title, let pl = t.permalink_url,
                                        let u = URL(string: pl) else { return nil }
                                  let art = t.artwork_url.flatMap(URL.init(string:))
                                  let dur = t.duration.map { Double($0)/1000.0 }
                                  let artist = t.user?.username ?? "Unknown"
                                  return SearchResult(source: .soundcloud, title: title, artist: artist,
                                                      duration: dur, artworkURL: art, previewURL: nil, downloadURL: u)
                              }
                              completion(out, nil)
                          } catch { completion([], "SC parse") }
                      }.resume()
                  }
              }

              private func fetchSC(completion: @escaping (String?) -> Void) {
                  if let c = scClientId, let d = scClientIdDate, Date().timeIntervalSince(d) < 86400*3 {
                      completion(c); return
                  }
                  guard let home = URL(string: "https://soundcloud.com/") else { completion(nil); return }
                  URLSession.shared.dataTask(with: home) { [weak self] data, _, _ in
                      guard let self = self, let data = data,
                            let html = String(data: data, encoding: .utf8) else { completion(nil); return }
                      let pat = #"https://a-v2\.sndcdn\.com/assets/[A-Za-z0-9_-]+\.js"#
                      guard let r = html.range(of: pat, options: .regularExpression),
                            let sUrl = URL(string: String(html[r])) else { completion(nil); return }
                      URLSession.shared.dataTask(with: sUrl) { [weak self] jsData, _, _ in
                          guard let self = self, let jsData = jsData,
                                let js = String(data: jsData, encoding: .utf8) else { completion(nil); return }
                          let pat2 = #"client_id[:=]\s*["']([a-zA-Z0-9]{32})["']"#
                          guard let m = js.range(of: pat2, options: .regularExpression) else { completion(nil); return }
                          var cid = String(js[m])
                          cid = cid.replacingOccurrences(of: #"client_id[:=]\s*['"]"#, with: "", options: .regularExpression)
                          cid = cid.trimmingCharacters(in: CharacterSet(charactersIn: "'\""))
                          self.scClientId = cid
                          self.scClientIdDate = Date()
                          completion(cid)
                      }.resume()
                  }.resume()
              }

              private func itunesSearch(query: String, completion: @escaping ([SearchResult], String?) -> Void) {
                  guard let enc = query.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                        let u = URL(string: "https://itunes.apple.com/search?term=\(enc)&media=music&limit=15") else {
                      completion([], "bad query"); return
                  }
                  URLSession.shared.dataTask(with: u) { data, _, err in
                      if let err = err { completion([], err.localizedDescription); return }
                      guard let data = data else { completion([], "empty"); return }
                      do {
                          let it = try JSONDecoder().decode(ITunesResponse.self, from: data)
                          let ytPrefix = "https://www.youtube.com/results?search_query="
                          let out = it.results.compactMap { t -> SearchResult? in
                              guard let title = t.trackName, let artist = t.artistName else { return nil }
                              let q = "\(artist) - \(title) audio"
                              guard let qe = q.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                                    let dl = URL(string: ytPrefix + qe) else { return nil }
                              let art = t.artworkUrl100.flatMap {
                                  URL(string: $0.replacingOccurrences(of: "100x100bb", with: "600x600bb"))
                              }
                              let dur = t.trackTimeMillis.map { Double($0)/1000 }
                              let prev = t.previewUrl.flatMap(URL.init(string:))
                              return SearchResult(source: .itunes, title: title, artist: artist,
                                                  duration: dur, artworkURL: art, previewURL: prev, downloadURL: dl)
                          }
                          completion(out, nil)
                      } catch { completion([], "iTunes parse") }
                  }.resume()
              }

              private func deezerSearch(query: String, completion: @escaping ([SearchResult], String?) -> Void) {
                  guard let enc = query.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                        let u = URL(string: "https://api.deezer.com/search?q=\(enc)&limit=15") else {
                      completion([], "bad query"); return
                  }
                  URLSession.shared.dataTask(with: u) { data, _, err in
                      if let err = err { completion([], err.localizedDescription); return }
                      guard let data = data else { completion([], "empty"); return }
                      do {
                          let dz = try JSONDecoder().decode(DeezerResponse.self, from: data)
                          let ytPrefix = "https://www.youtube.com/results?search_query="
                          let out = dz.data.compactMap { t -> SearchResult? in
                              guard let title = t.title, let artist = t.artist?.name else { return nil }
                              let q = "\(artist) - \(title) audio"
                              guard let qe = q.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                                    let dl = URL(string: ytPrefix + qe) else { return nil }
                              let art = t.album?.cover_medium.flatMap(URL.init(string:))
                              let dur = t.duration.map(Double.init)
                              let prev = t.preview.flatMap(URL.init(string:))
                              return SearchResult(source: .deezer, title: title, artist: artist,
                                                  duration: dur, artworkURL: art, previewURL: prev, downloadURL: dl)
                          }
                          completion(out, nil)
                      } catch { completion([], "Deezer parse") }
                  }.resume()
              }

              private func youtubeSearch(query: String, completion: @escaping ([SearchResult], String?) -> Void) {
                  guard let u = URL(string: "https://www.youtube.com/youtubei/v1/search?prettyPrint=false") else {
                      completion([], "bad url"); return
                  }
                  var req = URLRequest(url: u, timeoutInterval: 10)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  let body: [String:Any] = [
                      "context": ["client": ["clientName":"WEB","clientVersion":"2.20240101.00.00","hl":"en","gl":"US"]],
                      "query": query
                  ]
                  req.httpBody = try? JSONSerialization.data(withJSONObject: body)
                  URLSession.shared.dataTask(with: req) { data, _, err in
                      if let err = err { completion([], err.localizedDescription); return }
                      guard let data = data else { completion([], "empty"); return }
                      var out = [SearchResult]()
                      func walk(_ obj: Any) {
                          if out.count >= 15 { return }
                          if let d = obj as? [String:Any] {
                              if let vr = d["videoRenderer"] as? [String:Any],
                                 let vid = vr["videoId"] as? String,
                                 let ttl = ((vr["title"] as? [String:Any])?["runs"] as? [[String:Any]])?.first?["text"] as? String {
                                  let artist = "YouTube"
                                  var art: URL?
                                  if let thumbs = ((vr["thumbnail"] as? [String:Any])?["thumbnails"] as? [[String:Any]])?.last,
                                     let uu = thumbs["url"] as? String { art = URL(string: uu) }
                                  let dur: Double? = nil
                                  out.append(SearchResult(source: .youtube, title: ttl, artist: artist,
                                                          duration: dur, artworkURL: art, previewURL: nil,
                                                          downloadURL: URL(string: "https://www.youtube.com/watch?v=\(vid)")!))
                                  return
                              }
                              for v in d.values { walk(v) }
                          } else if let a = obj as? [Any] {
                              for v in a { walk(v); if out.count >= 15 { return } }
                          }
                      }
                      (try? JSONSerialization.jsonObject(with: data)).map(walk)
                      completion(out, out.isEmpty ? "YT parse" : nil)
                  }.resume()
              }
          }

          extension Notification.Name {
              static let downloadCenterChanged = Notification.Name("downloadCenterChanged")
          }

          SWIFT
      - name: Generate Icon
        run: |
          mkdir -p TrollMusicApp/TrollMusicApp/Assets.xcassets/AppIcon.appiconset
          echo 'import AppKit' > make_icon.swift
          echo 'let size = CGSize(width: 1024, height: 1024)' >> make_icon.swift
          echo 'let img = NSImage(size: size)' >> make_icon.swift
          echo 'img.lockFocus()' >> make_icon.swift
          echo 'let ctx = NSGraphicsContext.current!.cgContext' >> make_icon.swift
          echo 'let colors = [NSColor.systemPurple.cgColor, NSColor.black.cgColor] as CFArray' >> make_icon.swift
          echo 'let grad = CGGradient(colorsSpace: nil, colors: colors, locations: [0.0, 1.0])!' >> make_icon.swift
          echo 'ctx.drawLinearGradient(grad, start: CGPoint(x: 0, y: 1024), end: CGPoint(x: 1024, y: 0), options: [])' >> make_icon.swift
          echo 'let attr: [NSAttributedString.Key: Any] = [.font: NSFont.boldSystemFont(ofSize: 500), .foregroundColor: NSColor.white]' >> make_icon.swift
          echo 'let str = NSAttributedString(string: "AS", attributes: attr)' >> make_icon.swift
          echo 'let r = str.boundingRect(with: size, options: .usesLineFragmentOrigin)' >> make_icon.swift
          echo 'str.draw(at: NSPoint(x: (size.width - r.width)/2, y: (size.height - r.height)/2 - 80))' >> make_icon.swift
          echo 'img.unlockFocus()' >> make_icon.swift
          echo 'let data = img.tiffRepresentation!' >> make_icon.swift
          echo 'let rep = NSBitmapImageRep(data: data)!' >> make_icon.swift
          echo 'let png = rep.representation(using: .png, properties: [:])!' >> make_icon.swift
          echo 'let u = URL(fileURLWithPath: "TrollMusicApp/TrollMusicApp/Assets.xcassets/AppIcon.appiconset/icon-1024.png")' >> make_icon.swift
          echo 'try! png.write(to: u)' >> make_icon.swift
          swift make_icon.swift
          echo '{ "images": [ { "filename": "icon-1024.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" } ], "info": { "author": "xcode", "version": 1 } }' > TrollMusicApp/TrollMusicApp/Assets.xcassets/AppIcon.appiconset/Contents.json
          echo '{ "info": { "version": 1, "author": "xcode" } }' > TrollMusicApp/TrollMusicApp/Assets.xcassets/Contents.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: xcodegen generate --spec project.yml

      - name: Build and Archive
        run: |
          xcodebuild archive             -project TrollMusicApp.xcodeproj             -scheme TrollMusicApp             -configuration Release             -sdk iphoneos             -destination "generic/platform=iOS"             -archivePath "$PWD/build/TrollMusicApp.xcarchive"             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             DEVELOPMENT_TEAM=""             PROVISIONING_PROFILE=""             DEVELOPMENT_ASSET_PATHS=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/TrollMusicApp.xcarchive/Products/Applications/TrollMusicApp.app" Payload/
          /usr/bin/zip -r TrollMusicApp.ipa Payload
          test -f TrollMusicApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollMusicApp-IPA
          path: TrollMusicApp.ipa
          if-no-files-found: error
          retention-days: 14
