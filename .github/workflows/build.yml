          import SwiftUI
          import UIKit
          import WebKit

          struct BrowserTab: Identifiable { let id = UUID(); var webView: WKWebView; var urlString: String; var title: String }

          class WebViewModel: ObservableObject {
              @Published var tabs: [BrowserTab] = []
              @Published var currentTabIndex: Int = 0
              @Published var showTabs: Bool = false
              @Published var canGoBack: Bool = false
              @Published var canGoForward: Bool = false
              @Published var showDownloadAlert: Bool = false
              @Published var showNamePrompt: Bool = false
              @Published var showBlobError: Bool = false
              @Published var downloadFileName: String = ""
              @Published var customSongName: String = ""
              var capturedUrl: URL? = nil

              init() { addNewTab() }
              var currentWebView: WKWebView { tabs[currentTabIndex].webView }

              func addNewTab() {
                  let prefs = WKWebpagePreferences()
                  prefs.allowsContentJavaScript = true
                  let config = WKWebViewConfiguration()
                  config.defaultWebpagePreferences = prefs
                  config.allowsInlineMediaPlayback = true
                  let newWebView = WKWebView(frame: .zero, configuration: config)
                  newWebView.configuration.preferences.javaScriptCanOpenWindowsAutomatically = false
                  tabs.append(BrowserTab(webView: newWebView, urlString: "https://google.com", title: "New Tab"))
                  currentTabIndex = tabs.count - 1
                  loadUrl("https://google.com")
              }
              func closeTab(at index: Int) { tabs.remove(at: index); if tabs.isEmpty { addNewTab() } else if currentTabIndex >= tabs.count { currentTabIndex = tabs.count - 1 } }
              func goBack() { currentWebView.goBack() }
              func goForward() { currentWebView.goForward() }
              func refresh() { currentWebView.reload() }

              func loadUrl(_ urlString: String) {
                  var finalStr = urlString.trimmingCharacters(in: .whitespacesAndNewlines)
                  if finalStr.isEmpty { return }
                  if !finalStr.contains(".") || finalStr.contains(" ") {
                      if let encoded = finalStr.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) {
                          finalStr = "https://www.google.com/search?q=\(encoded)"
                      }
                  } else {
                      if !finalStr.hasPrefix("http") { finalStr = "https://" + finalStr }
                  }
                  if let url = URL(string: finalStr) { currentWebView.load(URLRequest(url: url)) }
              }

              func grabAudio() {
                  let js = "(function() { var mediaElements = document.querySelectorAll('audio, video, source'); for (var i = 0; i < mediaElements.length; i++) { if (mediaElements[i].src && mediaElements[i].src.startsWith('http')) { return mediaElements[i].src; } } return null; })()"
                  currentWebView.evaluateJavaScript(js) { [weak self] result, _ in
                      guard let self = self else { return }
                      if let mediaUrlString = result as? String, let url = URL(string: mediaUrlString) {
                          self.capturedUrl = url; self.customSongName = "Web_Audio"; self.showNamePrompt = true
                      } else {
                          self.capturedUrl = self.currentWebView.url; self.customSongName = "Web_Page_Grab"; self.showNamePrompt = true
                      }
                  }
              }

              func confirmDownload(with name: String) {
                  guard let url = capturedUrl else { return }
                  let urlStr = url.absoluteString
                  var finalName = name.replacingOccurrences(of: "/", with: "-")
                  if !finalName.hasSuffix(".mp3") && !finalName.hasSuffix(".m4a") && !finalName.hasSuffix(".wav") {
                      finalName += ".mp3"
                  }

                  let hosters = ["youtube.com","youtu.be","soundcloud.com","tiktok.com","twitter.com","x.com","instagram.com","audiomack.com","spotifydown.com"]
                  if hosters.contains(where: { urlStr.contains($0) }) {
                      tryDownloadCobalt(urlStr: urlStr, name: finalName.replacingOccurrences(of: ".mp3", with: ""))
                      return
                  }

                  let destDir = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let destPath = destDir.appendingPathComponent(finalName)
                  URLSession.shared.downloadTask(with: url) { localUrl, _, _ in
                      guard let localUrl = localUrl else { return }
                      try? FileManager.default.moveItem(at: localUrl, to: destPath)
                      try? FileManager.default.setAttributes([.protectionKey: FileProtectionType.none], ofItemAtPath: destPath.path)
                      DispatchQueue.main.async { self.downloadFileName = finalName; self.showDownloadAlert = true }
                  }.resume()
              }

              private func cobaltServers() -> [String] {
                  ["https://api.cobalt.tools","https://cobalt.api.timeless.top","https://co.wuk.sh","https://co.eepy.today","https://dl.imput.net","https://cobalt.playpriv.net"]
              }

              func tryDownloadCobalt(urlStr: String, name: String, attempt: Int = 0) {
                  let servers = cobaltServers()
                  if attempt >= servers.count {
                      DispatchQueue.main.async { self.showBlobError = true }
                      return
                  }
                  let server = servers[attempt]
                  let finalName = name + ".mp3"
                  let destDir = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let destPath = destDir.appendingPathComponent(finalName)

                  if let apiUrl = URL(string: server + "/") {
                      var req = URLRequest(url: apiUrl); req.httpMethod = "POST"
                      req.timeoutInterval = 15
                      req.setValue("application/json", forHTTPHeaderField: "Accept")
                      req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                      req.setValue(server, forHTTPHeaderField: "Origin")
                      let params: [String: Any] = ["url": urlStr, "downloadMode": "audio", "audioFormat": "mp3"]
                      req.httpBody = try? JSONSerialization.data(withJSONObject: params)
                      URLSession.shared.dataTask(with: req) { [weak self] data, resp, _ in
                          guard let self = self, let data = data else { self?.tryDownloadCobalt(urlStr: urlStr, name: name, attempt: attempt+1); return }
                          if let dict = (try? JSONSerialization.jsonObject(with: data)) as? [String:Any],
                             let u = dict["url"] as? String, let audioUrl = URL(string: u) {
                              URLSession.shared.downloadTask(with: audioUrl) { localUrl, _, _ in
                                  guard let localUrl = localUrl else { return }
                                  try? FileManager.default.moveItem(at: localUrl, to: destPath)
                                  try? FileManager.default.setAttributes([.protectionKey: FileProtectionType.none], ofItemAtPath: destPath.path)
                                  DispatchQueue.main.async { self.downloadFileName = finalName; self.showDownloadAlert = true; MusicManager.shared.loadSongs() }
                              }.resume()
                          } else {
                              self.tryDownloadCobalt(urlStr: urlStr, name: name, attempt: attempt+1)
                          }
                      }.resume()
                  }
              }
          }

          struct WebViewUI: UIViewRepresentable {
              @ObservedObject var viewModel: WebViewModel
              @Binding var urlString: String
              func makeUIView(context: Context) -> WKWebView { return viewModel.currentWebView }
              func updateUIView(_ uiView: WKWebView, context: Context) { uiView.navigationDelegate = context.coordinator; uiView.uiDelegate = context.coordinator }
              func makeCoordinator() -> Coordinator { Coordinator(self) }

              class Coordinator: NSObject, WKNavigationDelegate, WKUIDelegate, WKDownloadDelegate {
                  var parent: WebViewUI
                  init(_ parent: WebViewUI) { self.parent = parent }
                  func webView(_ webView: WKWebView, createWebViewWith configuration: WKWebViewConfiguration, for navigationAction: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? { if navigationAction.targetFrame == nil { webView.load(navigationAction.request) }; return nil }
                  func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) { let hideAdsScript = "var badEls = document.querySelectorAll('.ad, .ads, .popup, iframe'); badEls.forEach(el => el.remove());"; webView.evaluateJavaScript(hideAdsScript, completionHandler: { _, _ in }) }
                  func webView(_ webView: WKWebView, didCommit navigation: WKNavigation!) { parent.viewModel.canGoBack = webView.canGoBack; parent.viewModel.canGoForward = webView.canGoForward; if let currentURL = webView.url?.absoluteString { if !parent.urlString.contains(" ") { parent.urlString = currentURL }; parent.viewModel.tabs[parent.viewModel.currentTabIndex].urlString = currentURL } }
                  func webView(_ webView: WKWebView, decidePolicyFor navigationAction: WKNavigationAction, decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) { if navigationAction.shouldPerformDownload { decisionHandler(.download); return }; decisionHandler(.allow) }
                  func webView(_ webView: WKWebView, decidePolicyFor navigationResponse: WKNavigationResponse, decisionHandler: @escaping (WKNavigationResponsePolicy) -> Void) {
                      if navigationResponse.canShowMIMEType == false { decisionHandler(.download); return }
                      if let mime = navigationResponse.response.mimeType?.lowercased(), mime.contains("audio") || mime.contains("mpeg") || mime.contains("mp4") || mime.contains("webm") || mime.contains("zip") || mime.contains("octet-stream") {
                          decisionHandler(.download); return
                      }
                      decisionHandler(.allow)
                  }
                  func webView(_ webView: WKWebView, navigationAction: WKNavigationAction, didBecome download: WKDownload) { download.delegate = self }
                  func webView(_ webView: WKWebView, navigationResponse: WKNavigationResponse, didBecome download: WKDownload) { download.delegate = self }
                  func download(_ download: WKDownload, decideDestinationUsing response: URLResponse, suggestedFilename: String, completionHandler: @escaping @MainActor @Sendable (URL?) -> Void) { let fm = FileManager.default; let destDir = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]; let cleanName = suggestedFilename.removingPercentEncoding?.replacingOccurrences(of: "+", with: " ") ?? suggestedFilename; let destPath = destDir.appendingPathComponent(cleanName); try? fm.removeItem(at: destPath); DispatchQueue.main.async { self.parent.viewModel.downloadFileName = cleanName }; completionHandler(destPath) }
                  func downloadDidFinish(_ download: WKDownload) { let destDir = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]; let destPath = destDir.appendingPathComponent(parent.viewModel.downloadFileName); try? FileManager.default.setAttributes([.protectionKey: FileProtectionType.none], ofItemAtPath: destPath.path); DispatchQueue.main.async { self.parent.viewModel.showDownloadAlert = true; MusicManager.shared.loadSongs() } }
              }
          }

