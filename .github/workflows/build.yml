name: Build TrollMusicApp

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Clean Environment
        run: |
          find . -name "Info.plist" -delete
          find . -name "*.swift" -delete
          rm -rf TrollMusicApp/*.swift
          rm -rf TrollMusicApp/TrollMusicApp/*.swift
          rm -rf TrollMusicApp/*.xcodeproj
          rm -rf TrollMusicApp.xcodeproj build Payload TrollMusicApp.ipa

      - name: Create Project Config (Signing Disabled)
        run: |
          cat << 'YAML' > project.yml
          name: TrollMusicApp
          options:
            bundleIdPrefix: com.ahmedsoliman
            deploymentTarget:
              iOS: "16.0"
          settings:
            CODE_SIGNING_ALLOWED: NO
            CODE_SIGNING_REQUIRED: NO
            CODE_SIGN_IDENTITY: ""
            DEVELOPMENT_TEAM: ""
            PROVISIONING_PROFILE: ""
          targets:
            TrollMusicApp:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: TrollMusicApp/TrollMusicApp
                  excludes:
                    - "Preview Content"
              info:
                path: TrollMusicApp/TrollMusicApp/Info.plist
                properties:
                  UILaunchScreen: {}
                  UIBackgroundModes: [audio]
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
              settings:
                GENERATE_INFOPLIST_FILE: NO
                ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                DEVELOPMENT_ASSET_PATHS: "DummyAssets"
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGN_IDENTITY: ""
                DEVELOPMENT_TEAM: ""
          YAML
          mkdir -p TrollMusicApp/TrollMusicApp/Preview\ Content
          mkdir -p DummyAssets
          mkdir -p TrollMusicApp/TrollMusicApp
          cat << 'PLIST' > TrollMusicApp/TrollMusicApp/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.ahmedsoliman.trollmusicapp</string>
              <key>CFBundleName</key>
              <string>AS Music</string>
              <key>CFBundleExecutable</key>
              <string>TrollMusicApp</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          PLIST
          sed -i '' 's/^[ \t]*//' TrollMusicApp/TrollMusicApp/Info.plist

      - name: Write Swift Files
        run: |
          cat << 'SWIFT' > TrollMusicApp/TrollMusicApp/TrollMusicAppApp.swift
          import SwiftUI
          import AVFoundation

          class AppDelegate: NSObject, UIApplicationDelegate {
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey : Any]? = nil) -> Bool {
                  do {
                      try AVAudioSession.sharedInstance().setCategory(.playback, mode: .default, options: [])
                      try AVAudioSession.sharedInstance().setActive(true)
                      UIApplication.shared.beginReceivingRemoteControlEvents()
                  } catch { print("Background Audio Setup Failed") }
                  return true
              }
          }

          @main
          struct TrollMusicAppApp: App {
              @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate: AppDelegate
              var body: some Scene {
                  WindowGroup {
                      MainTabView()
                          .environmentObject(MusicManager.shared)
                  }
              }
          }

          SWIFT
          cat << 'SWIFT' > TrollMusicApp/TrollMusicApp/MusicManager.swift
          import Foundation
          import AVFoundation
          import MediaPlayer
          import SwiftUI
          import UIKit

          struct Song: Identifiable, Codable, Equatable {
              var id: UUID
              var title: String
              var url: URL
          }
          struct Playlist: Identifiable, Codable {
              var id: UUID
              var name: String
              var songIDs: [UUID]
          }

          enum RepeatMode: Int { case off, all, one }

          class MusicManager: NSObject, ObservableObject, AVAudioPlayerDelegate {
              static let shared = MusicManager()

              @Published var songs: [Song] = []
              @Published var playlists: [Playlist] = []
              @Published var currentSong: Song?
              @Published var isPlaying: Bool = false
              @Published var isShuffle: Bool = false
              @Published var repeatMode: RepeatMode = .off
              @Published var playbackRate: Float = 1.0
              @Published var sleepTimerMinutes: Int = 0
              @Published var currentTime: TimeInterval = 0.0
              @Published var duration: TimeInterval = 1.0
              @Published var upNextQueue: [Song] = [] // play-next/play-later queue

              var audioPlayer: AVAudioPlayer?
              var avPlayer: AVPlayer?
              var avPlayerItem: AVPlayerItem?
              var useAVPlayer = false
              var sleepTimer: Timer?
              var progressTimer: Timer?
              var queueObserver: NSObjectProtocol?

              let fileManager = FileManager.default
              var documentsDirectory: URL {
                  fileManager.urls(for: .documentDirectory, in: .userDomainMask)[0]
              }

              override init() {
                  super.init()
                  loadSongs()
                  loadPlaylists()
                  setupRemoteCommandCenter()
              }

              func startProgressTimer() {
                  progressTimer?.invalidate()
                  progressTimer = Timer.scheduledTimer(withTimeInterval: 0.3, repeats: true) { [weak self] _ in
                      guard let self = self else { return }
                      DispatchQueue.main.async {
                          if self.useAVPlayer {
                              self.currentTime = self.avPlayer?.currentTime().seconds ?? 0.0
                              let d = self.avPlayer?.currentItem?.duration.seconds ?? 0.0
                              self.duration = (d.isNaN || d.isInfinite) ? 1.0 : d
                          } else {
                              self.currentTime = self.audioPlayer?.currentTime ?? 0.0
                              self.duration = self.audioPlayer?.duration ?? 1.0
                              self.audioPlayer?.enableRate = true
                              self.audioPlayer?.rate = self.playbackRate
                          }
                      }
                  }
              }

              func seek(to time: TimeInterval) {
                  if useAVPlayer {
                      avPlayer?.seek(to: CMTime(seconds: time, preferredTimescale: 1000))
                      avPlayer?.rate = playbackRate
                  } else {
                      audioPlayer?.currentTime = time
                      audioPlayer?.enableRate = true
                      audioPlayer?.rate = isPlaying ? playbackRate : 0
                  }
                  updateNowPlayingInfo()
              }

              func setPlaybackRate(_ r: Float) {
                  playbackRate = r
                  UserDefaults.standard.set(r, forKey: "asmusic_rate")
                  if useAVPlayer {
                      avPlayer?.rate = isPlaying ? r : 0
                      avPlayerItem?.audioTimePitchAlgorithm = .timeDomain
                  } else {
                      audioPlayer?.enableRate = true
                      audioPlayer?.rate = isPlaying ? r : 0
                  }
              }

              func formatTime(_ t: TimeInterval) -> String {
                  if t.isNaN || t.isInfinite { return "0:00" }
                  let m = Int(t) / 60, s = Int(t) % 60
                  return String(format: "%d:%02d", m, s)
              }

              func loadSongs() {
                  do {
                      let files = try fileManager.contentsOfDirectory(at: documentsDirectory, includingPropertiesForKeys: nil)
                      let audioExts = ["mp3","m4a","wav","webm","mp4","aac","ogg","opus"]
                      let audio = files.filter { audioExts.contains($0.pathExtension.lowercased()) }
                      for f in audio {
                          try? fileManager.setAttributes([.protectionKey: FileProtectionType.none], ofItemAtPath: f.path)
                      }
                      DispatchQueue.main.async {
                          self.songs = audio.map { Song(id: UUID(), title: $0.deletingPathExtension().lastPathComponent, url: $0) }
                              .sorted { $0.title.lowercased() < $1.title.lowercased() }
                      }
                  } catch {}
              }

              func deleteSong(_ s: Song) {
                  try? fileManager.removeItem(at: s.url)
                  upNextQueue.removeAll { $0.id == s.id }
                  loadSongs()
              }

              func renameSong(song: Song, newName: String) {
                  let ext = song.url.pathExtension
                  let newUrl = documentsDirectory.appendingPathComponent(newName + "." + ext)
                  do {
                      try fileManager.moveItem(at: song.url, to: newUrl)
                      loadSongs()
                      if currentSong?.id == song.id {
                          currentSong?.title = newName
                          currentSong?.url = newUrl
                          updateNowPlayingInfo()
                      }
                  } catch {}
              }

              func shareSong(_ song: Song) {
                  guard let scene = UIApplication.shared.connectedScenes.first as? UIWindowScene,
                        let root = scene.windows.first(where: \.isKeyWindow)?.rootViewController else { return }
                  let ac = UIActivityViewController(activityItems: [song.url], applicationActivities: nil)
                  if let pop = ac.popoverPresentationController {
                      pop.sourceView = root.view
                      pop.sourceRect = CGRect(x: root.view.bounds.midX, y: root.view.bounds.midY, width: 0, height: 0)
                      pop.permittedArrowDirections = []
                  }
                  root.present(ac, animated: true)
              }

              func createPlaylist(name: String) {
                  playlists.append(Playlist(id: UUID(), name: name, songIDs: []))
                  savePlaylists()
              }
              func addSongToPlaylist(song: Song, playlist: Playlist) {
                  if let idx = playlists.firstIndex(where: { $0.id == playlist.id }) {
                      if !playlists[idx].songIDs.contains(song.id) {
                          playlists[idx].songIDs.append(song.id); savePlaylists()
                      }
                  }
              }
              func toggleFavorite(song: Song) {
                  if playlists.isEmpty || playlists[0].name != "Liked Songs" {
                      playlists.insert(Playlist(id: UUID(), name: "Liked Songs", songIDs: []), at: 0)
                  }
                  if playlists[0].songIDs.contains(song.id) {
                      playlists[0].songIDs.removeAll { $0 == song.id }
                  } else {
                      playlists[0].songIDs.append(song.id)
                  }
                  savePlaylists(); objectWillChange.send()
              }
              func isFavorite(song: Song) -> Bool {
                  guard !playlists.isEmpty, playlists[0].name == "Liked Songs" else { return false }
                  return playlists[0].songIDs.contains(song.id)
              }
              func savePlaylists() {
                  if let d = try? JSONEncoder().encode(playlists) {
                      UserDefaults.standard.set(d, forKey: "savedPlaylists")
                  }
              }
              func loadPlaylists() {
                  if let d = UserDefaults.standard.data(forKey: "savedPlaylists"),
                     let decoded = try? JSONDecoder().decode([Playlist].self, from: d) { playlists = decoded }
                  if playlists.isEmpty || playlists[0].name != "Liked Songs" {
                      playlists.insert(Playlist(id: UUID(), name: "Liked Songs", songIDs: []), at: 0)
                      savePlaylists()
                  }
              }

              // ---- Up Next queue ---------------------------------------------------
              func playNext(_ song: Song) {
                  if let cur = currentSong, cur.id == song.id { return }
                  upNextQueue.insert(song, at: 0)
                  objectWillChange.send()
              }
              func playLater(_ song: Song) {
                  if let cur = currentSong, cur.id == song.id { return }
                  if !upNextQueue.contains(where: { $0.id == song.id }) {
                      upNextQueue.append(song)
                  }
                  objectWillChange.send()
              }
              func toggleRepeat() {
                  repeatMode = RepeatMode(rawValue: (repeatMode.rawValue + 1) % 3) ?? .off
                  UserDefaults.standard.set(repeatMode.rawValue, forKey: "asmusic_repeat")
                  objectWillChange.send()
              }

              func setSleepTimer(minutes: Int) {
                  sleepTimerMinutes = minutes; sleepTimer?.invalidate()
                  if minutes > 0 {
                      sleepTimer = Timer.scheduledTimer(withTimeInterval: TimeInterval(minutes*60), repeats: false) { [weak self] _ in
                          guard let self = self else { return }
                          DispatchQueue.main.async {
                              if self.useAVPlayer { self.avPlayer?.pause() } else { self.audioPlayer?.pause() }
                              self.isPlaying = false
                              self.sleepTimerMinutes = 0
                          }
                      }
                  }
              }

              func playSong(_ song: Song) {
                  do {
                      try AVAudioSession.sharedInstance().setCategory(.playback, mode: .default)
                      try AVAudioSession.sharedInstance().setActive(true)
                      UIApplication.shared.beginReceivingRemoteControlEvents()

                      audioPlayer?.stop(); avPlayer?.pause()
                      NotificationCenter.default.removeObserver(self, name: NSNotification.Name.AVPlayerItemDidPlayToEndTime, object: nil)
                      if let o = queueObserver { NotificationCenter.default.removeObserver(o); queueObserver = nil }

                      // Try AVAudioPlayer first (mp3/m4a/wav/aac), fall back to AVPlayer
                      var started = false
                      do {
                          let ap = try AVAudioPlayer(contentsOf: song.url)
                          ap.delegate = self
                          ap.enableRate = true
                          ap.prepareToPlay()
                          ap.rate = playbackRate
                          ap.play()
                          audioPlayer = ap
                          useAVPlayer = false
                          started = true
                      } catch {
                          let item = AVPlayerItem(url: song.url)
                          item.audioTimePitchAlgorithm = .timeDomain
                          let p = AVPlayer(playerItem: item)
                          p.rate = playbackRate
                          p.play()
                          avPlayer = p
                          avPlayerItem = item
                          useAVPlayer = true
                          NotificationCenter.default.addObserver(self, selector: #selector(songFinished), name: NSNotification.Name.AVPlayerItemDidPlayToEndTime, object: item)
                          started = true
                      }
                      if started {
                          currentSong = song; isPlaying = true
                          updateNowPlayingInfo(); startProgressTimer()
                          let gen = UIImpactFeedbackGenerator(style: .medium)
                          gen.impactOccurred()
                      }
                  } catch {}
              }

              @objc func songFinished() {
                  DispatchQueue.main.async {
                      // repeat one: replay current
                      if self.repeatMode == .one, let cur = self.currentSong {
                          self.seek(to: 0)
                          if self.useAVPlayer { self.avPlayer?.play() } else { self.audioPlayer?.play() }
                          self.isPlaying = true
                          return
                      }
                      self.playNext(autoAdvance: true)
                  }
              }
              func audioPlayerDidFinishPlaying(_ player: AVAudioPlayer, successfully flag: Bool) {
                  DispatchQueue.main.async {
                      if self.repeatMode == .one, let cur = self.currentSong {
                          self.seek(to: 0)
                          self.audioPlayer?.play()
                          self.isPlaying = true
                          return
                      }
                      self.playNext(autoAdvance: true)
                  }
              }

              func togglePlayPause() {
                  if useAVPlayer {
                      if isPlaying { avPlayer?.pause() } else { avPlayer?.play(); avPlayer?.rate = playbackRate }
                  } else {
                      if isPlaying { audioPlayer?.pause() } else { _ = audioPlayer?.play(); audioPlayer?.rate = playbackRate }
                  }
                  isPlaying.toggle(); updateNowPlayingInfo()
              }

              func playNext() { playNext(autoAdvance: false) }
              func playNext(autoAdvance: Bool) {
                  guard !songs.isEmpty || !upNextQueue.isEmpty else {
                      if repeatMode == .all, let first = songs.first { playSong(first) }
                      else { isPlaying = false; currentSong = nil }
                      return
                  }
                  // Pull from upNext queue first
                  if !upNextQueue.isEmpty {
                      let next = upNextQueue.removeFirst()
                      playSong(next); return
                  }
                  if isShuffle {
                      if let s = songs.filter({ $0.id != currentSong?.id }).randomElement() ?? songs.randomElement() {
                          playSong(s)
                      }
                      return
                  }
                  guard let c = currentSong, let i = songs.firstIndex(of: c) else {
                      if let first = songs.first { playSong(first) }
                      return
                  }
                  if i + 1 < songs.count {
                      playSong(songs[i+1])
                  } else if repeatMode == .all {
                      if let first = songs.first { playSong(first) }
                  } else if autoAdvance {
                      isPlaying = false
                  }
              }

              func playPrevious() {
                  if currentTime > 3 { seek(to: 0); return }
                  guard !songs.isEmpty else { return }
                  if isShuffle { if let s = songs.randomElement() { playSong(s) }; return }
                  if let c = currentSong, let i = songs.firstIndex(of: c), i > 0 {
                      playSong(songs[i-1])
                  } else if repeatMode == .all, let last = songs.last {
                      playSong(last)
                  }
              }

              func setupRemoteCommandCenter() {
                  let c = MPRemoteCommandCenter.shared()
                  c.playCommand.addTarget { [weak self] _ in
                      guard let s = self else { return .commandFailed }
                      if s.isPlaying { return .commandFailed }
                      s.togglePlayPause(); return .success
                  }
                  c.pauseCommand.addTarget { [weak self] _ in
                      guard let s = self else { return .commandFailed }
                      if !s.isPlaying { return .commandFailed }
                      s.togglePlayPause(); return .success
                  }
                  c.nextTrackCommand.addTarget { [weak self] _ in self?.playNext(); return .success }
                  c.previousTrackCommand.addTarget { [weak self] _ in self?.playPrevious(); return .success }
                  c.changePlaybackPositionCommand.addTarget { [weak self] ev in
                      guard let s = self, let e = ev as? MPChangePlaybackPositionCommandEvent else { return .commandFailed }
                      s.seek(to: e.positionTime); return .success
                  }
              }

              func updateNowPlayingInfo() {
                  guard let c = currentSong else { return }
                  var info: [String: Any] = [
                      MPMediaItemPropertyTitle: c.title,
                      MPMediaItemPropertyArtist: "AS Music",
                      MPNowPlayingInfoPropertyPlaybackRate: isPlaying ? playbackRate : 0.0,
                      MPNowPlayingInfoPropertyDefaultPlaybackRate: 1.0
                  ]
                  if useAVPlayer {
                      let d = avPlayer?.currentItem?.duration.seconds ?? 0
                      if !d.isNaN {
                          info[MPMediaItemPropertyPlaybackDuration] = d
                          info[MPNowPlayingInfoPropertyElapsedPlaybackTime] = avPlayer?.currentTime().seconds
                      }
                  } else {
                      if let d = audioPlayer?.duration {
                          info[MPMediaItemPropertyPlaybackDuration] = d
                          info[MPNowPlayingInfoPropertyElapsedPlaybackTime] = audioPlayer?.currentTime
                      }
                  }
                  MPNowPlayingInfoCenter.default().nowPlayingInfo = info
              }
          }

          SWIFT
          cat << 'SWIFT' > TrollMusicApp/TrollMusicApp/Views.swift
          import SwiftUI
          import UIKit

          func hideKeyboard() {
              UIApplication.shared.sendAction(#selector(UIResponder.resignFirstResponder), to: nil, from: nil, for: nil)
          }

          func generateColor(for title: String) -> Color {
              return Color(hue: Double(abs(title.hashValue) % 100) / 100.0,
                           saturation: 0.8, brightness: 0.7)
          }

          struct VisualizerView: View {
              @State private var isAnimating = false
              var body: some View {
                  HStack(spacing: 4) {
                      ForEach(0..<4, id: \.self) { i in
                          Capsule().fill(Color.white)
                              .frame(width: 4, height: isAnimating ? CGFloat.random(in: 10...25) : 5)
                              .animation(Animation.linear(duration: 0.3).repeatForever().delay(0.1 * Double(i)), value: isAnimating)
                      }
                  }
                  .onAppear { isAnimating = true }
              }
          }

          enum TabID: Hashable { case library, playlists, magic, browser }

          struct MainTabView: View {
              @EnvironmentObject var musicManager: MusicManager
              @ObservedObject private var dc = DownloadCenter.shared
              @State private var showFullPlayer = false
              @State private var showDownloads = false
              @State private var selected: TabID = .library

              var body: some View {
                  ZStack(alignment: .bottom) {
                      // Content (padded at bottom to make room for the custom bottom bar)
                      Group {
                          switch selected {
                          case .library:   LibraryView()
                          case .playlists: PlaylistsView()
                          case .magic:     SmartDownloaderView()
                          case .browser:   BrowserMainView()
                          }
                      }
                      .frame(maxWidth: .infinity, maxHeight: .infinity)
                      .padding(.bottom, bottomBarHeight)

                      // Custom bottom bar: banner + mini-player + tab buttons
                      VStack(spacing: 0) {
                          if dc.showBanner, let first = dc.tasks.first {
                              DownloadBannerView(task: first, total: dc.tasks.count)
                                  .onTapGesture { showDownloads = true }
                          }
                          if musicManager.currentSong != nil {
                              MiniPlayerView(showFullPlayer: $showFullPlayer)
                          }
                          Divider()
                          // Custom tab bar buttons (iOS-style)
                          HStack(spacing: 0) {
                              TabButton(label: "Library", icon: "music.note.list", id: .library, selection: $selected)
                              TabButton(label: "Playlists", icon: "music.mic", id: .playlists, selection: $selected)
                              TabButton(label: "Magic DL", icon: "sparkles", id: .magic, selection: $selected)
                              TabButton(label: "Web Hub", icon: "safari", id: .browser, selection: $selected)
                          }
                          .padding(.top, 6)
                          .padding(.bottom, 4)
                          .background(.bar)
                      }
                      .background(.bar)
                  }
                  .edgesIgnoringSafeArea(.bottom)
                  .sheet(isPresented: $showFullPlayer) { FullPlayerView() }
                  .sheet(isPresented: $showDownloads) { DownloadsQueueView() }
                  .onReceive(dc.$tasks) { _ in
                      dc.showBanner = !dc.tasks.isEmpty
                      NotificationCenter.default.post(name: .downloadCenterChanged, object: nil)
                  }
              }

              private var bottomBarHeight: CGFloat {
                  var h: CGFloat = 54  // custom tab buttons
                  if dc.showBanner, dc.tasks.first != nil { h += 60 }
                  if musicManager.currentSong != nil { h += 62 }
                  return h
              }
          }

          struct TabButton: View {
              let label: String
              let icon: String
              let id: TabID
              @Binding var selection: TabID
              var body: some View {
                  Button {
                      selection = id
                  } label: {
                      VStack(spacing: 3) {
                          Image(systemName: icon)
                              .font(.system(size: 22))
                          Text(label).font(.caption2)
                      }
                      .foregroundColor(selection == id ? .purple : .secondary)
                      .frame(maxWidth: .infinity)
                  }
                  .buttonStyle(.plain)
              }
          }

          // ---------------------------------------------------------------------------
          // MARK: - Download Banner & Queue
          // ---------------------------------------------------------------------------
          struct DownloadBannerView: View {
              @ObservedObject var task: DownloadTask
              let total: Int
              var body: some View {
                  HStack(spacing: 10) {
                      Image(systemName: "arrow.down.circle.fill")
                          .foregroundColor(.white).font(.title3)
                      VStack(alignment: .leading, spacing: 4) {
                          Text(task.fileName.isEmpty ? task.proposedName : task.fileName)
                              .font(.footnote).bold().lineLimit(1).foregroundColor(.white)
                          Group {
                              switch task.status {
                              case .queued:
                                  HStack { ProgressView().progressViewStyle(.linear).tint(.white); Text("Queued").font(.caption2).foregroundColor(.white.opacity(0.85)) }
                              case .contacting:
                                  HStack { ProgressView().progressViewStyle(.linear).tint(.white); Text("Connecting…").font(.caption2).foregroundColor(.white.opacity(0.85)) }
                              case .converting(let p):
                                  HStack { ProgressView(value: max(0.1, p)).progressViewStyle(.linear).tint(.white); Text("Converting…").font(.caption2).foregroundColor(.white.opacity(0.85)) }
                              case .downloading(let p):
                                  HStack { ProgressView(value: p).progressViewStyle(.linear).tint(.white); Text(String(format:"%.0f%%", p*100)).font(.caption2).foregroundColor(.white.opacity(0.85)) }
                              case .done:
                                  Label("Saved to Library", systemImage: "checkmark.circle.fill")
                                      .font(.caption).foregroundColor(.white)
                              case .failed(let msg):
                                  Text(msg).font(.caption2).foregroundColor(.yellow).lineLimit(1)
                              }
                          }
                      }
                      Spacer(minLength: 4)
                      if total > 1 {
                          Text("\(total)")
                              .font(.caption.bold()).foregroundColor(.white)
                              .padding(6).background(Color.white.opacity(0.25)).clipShape(Circle())
                      }
                  }
                  .padding(.horizontal, 12).padding(.vertical, 8)
                  .background(Color.purple)
                  .contentShape(Rectangle())
              }
          }

          struct DownloadsQueueView: View {
              @ObservedObject private var dc = DownloadCenter.shared
              @Environment(\.presentationMode) var presentationMode
              var body: some View {
                  NavigationView {
                      List {
                          if dc.tasks.isEmpty {
                              Text("No downloads").foregroundColor(.secondary)
                          } else {
                              ForEach(dc.tasks) { task in
                                  HStack {
                                      VStack(alignment: .leading, spacing: 4) {
                                          Text(task.fileName.isEmpty ? task.proposedName : task.fileName)
                                              .font(.subheadline).bold().lineLimit(1)
                                          statusLabel(for: task.status).font(.caption).foregroundColor(.secondary)
                                      }
                                      Spacer()
                                      switch task.status {
                                      case .downloading(let p), .converting(let p), .contacting(let p):
                                          ProgressView(value: p).frame(width: 60)
                                      case .queued:
                                          ProgressView().frame(width: 60)
                                      case .done:
                                          Image(systemName: "checkmark.circle.fill").foregroundColor(.green)
                                      case .failed:
                                          HStack(spacing: 8) {
                                              Button("Retry") { dc.retry(task) }
                                                  .font(.caption).padding(6).background(Color.purple).foregroundColor(.white).cornerRadius(6)
                                              Button(role: .destructive) { dc.remove(task) } label: {
                                                  Image(systemName: "xmark.circle").foregroundColor(.red)
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      .navigationTitle("Downloads")
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) {
                              Button("Clear Finished") { dc.clearCompleted() }
                          }
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("Done") { presentationMode.wrappedValue.dismiss() }
                          }
                      }
                  }
              }
              @ViewBuilder
              private func statusLabel(for s: DownloadTaskStatus) -> some View {
                  switch s {
                  case .queued: Text("Queued")
                  case .contacting: Text("Connecting to server…")
                  case .converting(let p): Text(String(format: "Converting… %.0f%%", p*100))
                  case .downloading(let p): Text(String(format: "Downloading… %.0f%%", p*100))
                  case .done: Text("Saved").foregroundColor(.green)
                  case .failed(let m): Text(m).foregroundColor(.red).lineLimit(1)
                  }
              }
          }

