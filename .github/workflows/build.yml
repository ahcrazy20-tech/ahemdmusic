                                          Button { showingRenameFor = song; newNameInput = song.title } label: { Label("Rename", systemImage: "pencil") }
                                          Divider()
                                          Button(role: .destructive) { musicManager.deleteSong(song) } label: { Label("Delete", systemImage: "trash") }
                                      }
