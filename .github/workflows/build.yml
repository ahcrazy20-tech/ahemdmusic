name: Build TrollMusicApp

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Project Config
        run: |
          echo 'name: TrollMusicApp' > project.yml
          echo 'options:' >> project.yml
          echo '  bundleIdPrefix: com.ahmedsoliman' >> project.yml
          echo 'targets:' >> project.yml
          echo '  TrollMusicApp:' >> project.yml
          echo '    type: application' >> project.yml
          echo '    platform: iOS' >> project.yml
          echo '    deploymentTarget: "16.0"' >> project.yml
          echo '    sources:' >> project.yml
          echo '      - path: TrollMusicApp/TrollMusicApp' >> project.yml
          echo '    info:' >> project.yml
          echo '      path: TrollMusicApp/TrollMusicApp/Info.plist' >> project.yml
          echo '      properties:' >> project.yml
          echo '        UILaunchScreen: {}' >> project.yml
          echo '        UIBackgroundModes: [audio]' >> project.yml
          echo '        NSAppTransportSecurity:' >> project.yml
          echo '          NSAllowsArbitraryLoads: true' >> project.yml
          echo '    settings:' >> project.yml
          echo '      GENERATE_INFOPLIST_FILE: "NO"' >> project.yml
          echo '      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon' >> project.yml

          mkdir -p TrollMusicApp/TrollMusicApp
          cat << 'PLIST' > TrollMusicApp/TrollMusicApp/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.ahmedsoliman.trollmusicapp</string>
              <key>CFBundleName</key>
              <string>AS Music</string>
              <key>CFBundleExecutable</key>
              <string>TrollMusicApp</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>UIBackgroundModes</key><array><string>audio</string></array>
              <key>NSAppTransportSecurity</key><dict><key>NSAllowsArbitraryLoads</key><true/></dict>
              <key>UILaunchScreen</key><dict/>
          </dict>
          </plist>
          PLIST

      - name: Write Swift Files
        run: |
          cat << 'SWIFT' > TrollMusicApp/TrollMusicApp/TrollMusicAppApp.swift
          import SwiftUI
          import AVFoundation

          @main
          struct TrollMusicAppApp: App {
              init() {
                  try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .default)
                  try? AVAudioSession.sharedInstance().setActive(true)
              }
              var body: some Scene {
                  WindowGroup { MainTabView().environmentObject(MusicManager.shared) }
              }
          }
          SWIFT

          cat << 'SWIFT' > TrollMusicApp/TrollMusicApp/MusicManager.swift
          import Foundation
          import AVFoundation
          import MediaPlayer
          import SwiftUI

          struct Song: Identifiable, Codable, Equatable { var id: UUID; var title: String; var url: URL }
          struct Playlist: Identifiable, Codable { var id: UUID; var name: String; var songIDs: [UUID] }

          class MusicManager: NSObject, ObservableObject, AVAudioPlayerDelegate {
              static let shared = MusicManager()
              @Published var songs: [Song] = []
              @Published var playlists: [Playlist] = []
              @Published var currentSong: Song?
              @Published var isPlaying: Bool = false
              @Published var currentTime: TimeInterval = 0.0
              @Published var duration: TimeInterval = 1.0
              @Published var isShuffle: Bool = false
              @Published var sleepTimerMinutes: Int = 0
              
              var audioPlayer: AVAudioPlayer?
              var avPlayer: AVPlayer?
              var useAVPlayer = false
              var progressTimer: Timer?
              
              override init() {
                  super.init()
                  loadSongs(); loadPlaylists()
                  MPRemoteCommandCenter.shared().playCommand.addTarget { _ in self.togglePlayPause(); return .success }
                  MPRemoteCommandCenter.shared().pauseCommand.addTarget { _ in self.togglePlayPause(); return .success }
                  MPRemoteCommandCenter.shared().nextTrackCommand.addTarget { _ in self.playNext(); return .success }
                  MPRemoteCommandCenter.shared().previousTrackCommand.addTarget { _ in self.playPrevious(); return .success }
              }
              
              func loadSongs() {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let files = (try? FileManager.default.contentsOfDirectory(at: docs, includingPropertiesForKeys: nil)) ?? []
                  let audio = files.filter { ["mp3", "m4a", "wav"].contains($0.pathExtension.lowercased()) }
                  DispatchQueue.main.async { self.songs = audio.map { Song(id: UUID(), title: $0.deletingPathExtension().lastPathComponent, url: $0) }.sorted { $0.title < $1.title } }
              }

              func loadPlaylists() {
                  if let data = UserDefaults.standard.data(forKey: "savedPlaylists"), let decoded = try? JSONDecoder().decode([Playlist].self, from: data) { playlists = decoded }
                  if playlists.isEmpty { playlists = [Playlist(id: UUID(), name: "Liked Songs", songIDs: [])]; savePlaylists() }
              }
              func savePlaylists() { if let encoded = try? JSONEncoder().encode(playlists) { UserDefaults.standard.set(encoded, forKey: "savedPlaylists") } }

              func playSong(_ song: Song) {
                  audioPlayer?.stop(); avPlayer?.pause()
                  do {
                      audioPlayer = try AVAudioPlayer(contentsOf: song.url)
                      audioPlayer?.delegate = self
                      audioPlayer?.play()
                      useAVPlayer = false
                  } catch {
                      avPlayer = AVPlayer(url: song.url); avPlayer?.play()
                      useAVPlayer = true
                  }
                  currentSong = song; isPlaying = true; startProgressTimer(); updateNowPlaying()
              }
              
              func togglePlayPause() {
                  if isPlaying { useAVPlayer ? avPlayer?.pause() : audioPlayer?.pause() } else { useAVPlayer ? avPlayer?.play() : audioPlayer?.play() }
                  isPlaying.toggle(); updateNowPlaying()
              }

              func playNext() {
                  guard !songs.isEmpty, let current = currentSong, let idx = songs.firstIndex(of: current) else { return }
                  playSong(songs[(idx + 1) % songs.count])
              }
              func playPrevious() {
                  guard !songs.isEmpty, let current = currentSong, let idx = songs.firstIndex(of: current) else { return }
                  playSong(songs[(idx - 1 + songs.count) % songs.count])
              }

              func startProgressTimer() {
                  progressTimer?.invalidate()
                  progressTimer = Timer.scheduledTimer(withTimeInterval: 0.5, repeats: true) { _ in
                      DispatchQueue.main.async {
                          self.currentTime = self.useAVPlayer ? (self.avPlayer?.currentTime().seconds ?? 0) : (self.audioPlayer?.currentTime ?? 0)
                          self.duration = self.useAVPlayer ? (self.avPlayer?.currentItem?.duration.seconds ?? 1) : (self.audioPlayer?.duration ?? 1)
                      }
                  }
              }

              func seek(to: TimeInterval) { if useAVPlayer { avPlayer?.seek(to: CMTime(seconds: to, preferredTimescale: 1)) } else { audioPlayer?.currentTime = to } }
              func formatTime(_ t: TimeInterval) -> String { 
                  if t.isNaN || t.isInfinite { return "0:00" }
                  let m = Int(t)/60; let s = Int(t)%60; return String(format: "%d:%02d", m, s) 
              }

              func updateNowPlaying() {
                  var info = [String: Any]()
                  info[MPMediaItemPropertyTitle] = currentSong?.title ?? "Unknown"
                  info[MPNowPlayingInfoPropertyPlaybackRate] = isPlaying ? 1.0 : 0.0
                  MPNowPlayingInfoCenter.default().nowPlayingInfo = info
              }
              
              func setSleepTimer(minutes: Int) {
                  sleepTimerMinutes = minutes
                  if minutes > 0 {
                      Timer.scheduledTimer(withTimeInterval: Double(minutes * 60), repeats: false) { _ in
                          DispatchQueue.main.async { self.isPlaying = true; self.togglePlayPause(); self.sleepTimerMinutes = 0 }
                      }
                  }
              }
              
              func toggleFavorite(song: Song) {
                  if playlists[0].songIDs.contains(song.id) { playlists[0].songIDs.removeAll { $0 == song.id } } else { playlists[0].songIDs.append(song.id) }
                  savePlaylists(); objectWillChange.send()
              }
              func isFavorite(song: Song) -> Bool { playlists[0].songIDs.contains(song.id) }
              func audioPlayerDidFinishPlaying(_ p: AVAudioPlayer, successfully: Bool) { playNext() }
          }
          SWIFT

          cat << 'SWIFT' > TrollMusicApp/TrollMusicApp/Views.swift
          import SwiftUI

          struct MainTabView: View {
              @EnvironmentObject var musicManager: MusicManager
              @State private var showFull = false
              var body: some View {
                  ZStack(alignment: .bottom) {
                      TabView {
                          LibraryView().tabItem { Label("Library", systemImage: "music.note.list") }
                          PlaylistsView().tabItem { Label("Playlists", systemImage: "music.mic") }
                          SmartDownloaderView().tabItem { Label("Magic DL", systemImage: "sparkles") }
                          BrowserMainView().tabItem { Label("Web Hub", systemImage: "safari") }
                      }.accentColor(.purple)
                      
                      if musicManager.currentSong != nil {
                          VStack(spacing: 0) {
                              HStack {
                                  RoundedRectangle(cornerRadius: 5).fill(Color.purple).frame(width: 40, height: 40).overlay(Image(systemName: "music.note").foregroundColor(.white))
                                  VStack(alignment: .leading) { Text(musicManager.currentSong?.title ?? "").font(.subheadline).bold().lineLimit(1); Text("AS Music").font(.caption).foregroundColor(.gray) }
                                  Spacer()
                                  Button(action: { musicManager.togglePlayPause() }) { Image(systemName: musicManager.isPlaying ? "pause.fill" : "play.fill").font(.title2) }
                              }.padding(10).background(.ultraThinMaterial).onTapGesture { showFull = true }
                              Color.clear.frame(height: 49) // Height of TabBar
                          }
                      }
                  }.sheet(isPresented: $showFull) { FullPlayerView() }
              }
          }

          struct FullPlayerView: View {
              @EnvironmentObject var mm: MusicManager
              @Environment(\.dismiss) var dismiss
              @State private var showTimer = false
              var body: some View {
                  ZStack {
                      LinearGradient(colors: [.purple.opacity(0.5), .black], startPoint: .top, endPoint: .bottom).ignoresSafeArea()
                      VStack(spacing: 30) {
                          HStack { Button(action: { dismiss() }) { Image(systemName: "chevron.down") }; Spacer(); Text("NOW PLAYING").font(.caption).bold(); Spacer(); Button(action: { showTimer = true }) { Image(systemName: "moon.fill").foregroundColor(mm.sleepTimerMinutes > 0 ? .purple : .white) } }.padding().foregroundColor(.white)
                          RoundedRectangle(cornerRadius: 20).fill(Color.purple.opacity(0.3)).frame(width: 300, height: 300).overlay(Image(systemName: "music.note").resizable().frame(width: 100, height: 100).foregroundColor(.white))
                          VStack { Text(mm.currentSong?.title ?? "").font(.title2).bold(); Text("AS Music").foregroundColor(.gray) }.foregroundColor(.white)
                          VStack {
                              Slider(value: Binding(get: { mm.currentTime }, set: { mm.seek(to: $0) }), in: 0...mm.duration).accentColor(.white)
                              HStack { Text(mm.formatTime(mm.currentTime)); Spacer(); Text(mm.formatTime(mm.duration)) }.font(.caption).foregroundColor(.gray)
                          }.padding(.horizontal, 30)
                          HStack(spacing: 40) {
                              Button(action: { mm.playPrevious() }) { Image(systemName: "backward.fill").font(.title) }
                              Button(action: { mm.togglePlayPause() }) { Image(systemName: mm.isPlaying ? "pause.circle.fill" : "play.circle.fill").font(.system(size: 70)) }
                              Button(action: { mm.playNext() }) { Image(systemName: "forward.fill").font(.title) }
                          }.foregroundColor(.white)
                          Spacer()
                      }
                  }.actionSheet(isPresented: $showTimer) { ActionSheet(title: Text("Sleep Timer"), buttons: [.default(Text("15 Min")) { mm.setSleepTimer(minutes: 15) }, .default(Text("30 Min")) { mm.setSleepTimer(minutes: 30) }, .destructive(Text("Off")) { mm.setSleepTimer(minutes: 0) }, .cancel()]) }
              }
          }

          struct LibraryView: View {
              @EnvironmentObject var mm: MusicManager
              var body: some View {
                  NavigationView {
                      List(mm.songs) { song in
                          Button(action: { mm.playSong(song) }) {
                              HStack { Image(systemName: "music.note").foregroundColor(.purple); Text(song.title) }
                          }
                      }.navigationTitle("Library")
                  }
              }
          }
          
          struct PlaylistsView: View {
              @EnvironmentObject var mm: MusicManager
              var body: some View {
                  NavigationView {
                      List(mm.playlists) { p in
                          NavigationLink(p.name) {
                              List(mm.songs.filter { p.songIDs.contains($0.id) }) { s in Text(s.title) }.navigationTitle(p.name)
                          }
                      }.navigationTitle("Playlists")
                  }
              }
          }
          
          struct BrowserMainView: View { var body: some View { Text("Browser Placeholder") } }
          SWIFT

          cat << 'SWIFT' > TrollMusicApp/TrollMusicApp/SmartDownloader.swift
          import SwiftUI
          import AVFoundation

          struct SCResponse: Codable { let collection: [SCTrack] }
          struct SCTrack: Codable, Identifiable {
              let id: Int
              let title: String?
              let user: SCUser?
              let duration: Int?
              let permalink_url: String?
              var durationFormatted: String {
                  guard let d = duration else { return "0:00" }
                  let s = d / 1000
                  return String(format: "%d:%02d", s / 60, s % 60)
              }
          }
          struct SCUser: Codable { let username: String? }
          struct CobaltResponse: Codable { var status: String?; var url: String?; var text: String? }

          class SmartDownloaderManager: NSObject, ObservableObject, URLSessionDownloadDelegate {
              @Published var isDownloading = false; @Published var isSearching = false; @Published var statusMessage = ""
              @Published var downloadProgress: Double = 0.0; @Published var searchResults: [SCTrack] = []; @Published var showSearchResults = false
              @Published var showSuccess = false; @Published var showError = false; @Published var errorDetails = ""
              
              private var downloadSession: URLSession!
              private var currentServerIdx = 0
              private var watchdogTimer: Timer?
              private let scClientId = "X2iyLRaFdot6PHiU6l7tTR8wRSTY0sFp"
              private let servers = ["https://co.wuk.sh", "https://cobalt.api.timeless.top", "https://co.eepy.today", "https://cobalt.q0.is", "https://api.vidiq.org", "https://api.cobalt.tools"]
              
              private var currentUrl = ""; private var currentName = ""

              override init() {
                  super.init()
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest = 10
                  downloadSession = URLSession(configuration: config, delegate: self, delegateQueue: nil)
              }

              func performMagicSearch(query: String) {
                  isSearching = true; searchResults = []
                  let url = URL(string: "https://api-v2.soundcloud.com/search/tracks?q=\(query.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? "")&client_id=\(scClientId)&limit=20")!
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      DispatchQueue.main.async { self.isSearching = false }
                      if let data = data, let res = try? JSONDecoder().decode(SCResponse.self, from: data) {
                          DispatchQueue.main.async { self.searchResults = res.collection; self.showSearchResults = true }
                      }
                  }.resume()
              }

              func startDownload(url: String, name: String) {
                  currentUrl = url; currentName = name; currentServerIdx = 0; isDownloading = true
                  tryNextServer()
              }

              private func tryNextServer() {
                  watchdogTimer?.invalidate()
                  guard currentServerIdx < servers.count else {
                      DispatchQueue.main.async { self.isDownloading = false; self.errorDetails = "All servers failed."; self.showError = true }
                      return
                  }
                  
                  let server = servers[currentServerIdx]
                  DispatchQueue.main.async { self.statusMessage = "Bypassing Security (Server \(self.currentServerIdx + 1))..." }
                  
                  // START WATCHDOG: If no response in 10 seconds, force move to next server
                  watchdogTimer = Timer.scheduledTimer(withTimeInterval: 10, repeats: false) { _ in
                      print("Watchdog triggered for server \(self.currentServerIdx + 1)")
                      self.currentServerIdx += 1
                      self.tryNextServer()
                  }

                  var req = URLRequest(url: URL(string: server + "/api/json")!)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.setValue("application/json", forHTTPHeaderField: "Accept")
                  let body: [String: Any] = ["url": currentUrl, "isAudioOnly": true, "aFormat": "mp3"]
                  req.httpBody = try? JSONSerialization.data(withJSONObject: body)

                  URLSession.shared.dataTask(with: req) { data, _, _ in
                      if let data = data, let res = try? JSONDecoder().decode(CobaltResponse.self, from: data), let streamUrl = res.url {
                          self.watchdogTimer?.invalidate()
                          self.downloadFile(url: streamUrl)
                      } else {
                          // Handled by watchdog or immediate failure
                      }
                  }.resume()
              }

              private func downloadFile(url: String) {
                  DispatchQueue.main.async { self.statusMessage = "Downloading MP3..." }
                  downloadSession.downloadTask(with: URL(string: url)!).resume()
              }

              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask, didWriteData: Int64, totalBytesWritten: Int64, totalBytesExpectedToWrite: Int64) {
                  DispatchQueue.main.async { self.downloadProgress = Double(totalBytesWritten) / Double(totalBytesExpectedToWrite) }
              }

              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask, didFinishDownloadingTo location: URL) {
                  let dest = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0].appendingPathComponent("\(currentName.isEmpty ? "Song" : currentName).mp3")
                  try? FileManager.default.removeItem(at: dest)
                  try? FileManager.default.moveItem(at: location, to: dest)
                  DispatchQueue.main.async { self.isDownloading = false; self.showSuccess = true; MusicManager.shared.loadSongs() }
              }
          }

          struct SmartDownloaderView: View {
              @StateObject var dl = SmartDownloaderManager()
              @State private var search = ""; @State private var link = ""; @State private var name = ""
              var body: some View {
                  NavigationView {
                      ZStack {
                          Color.black.ignoresSafeArea()
                          VStack(spacing: 20) {
                              Image(systemName: "sparkles").resizable().frame(width: 60, height: 60).foregroundColor(.purple)
                              Text("Smart Search & Playlists").font(.title2).bold().foregroundColor(.white)
                              VStack {
                                  HStack {
                                      TextField("Search by Name...", text: $search).padding().background(Color.white.opacity(0.1)).cornerRadius(10)
                                      Button(action: { dl.performMagicSearch(query: search) }) { Image(systemName: "magnifyingglass").padding().background(Color.purple).cornerRadius(10) }
                                  }
                              }.padding(.horizontal)
                              
                              Text("OR").foregroundColor(.gray)
                              
                              VStack(spacing: 10) {
                                  TextField("Paste Link...", text: $link).padding().background(Color.white.opacity(0.1)).cornerRadius(10)
                                  TextField("Save As...", text: $name).padding().background(Color.white.opacity(0.1)).cornerRadius(10)
                                  Button(action: { dl.startDownload(url: link, name: name) }) { 
                                      Text(dl.isDownloading ? dl.statusMessage : "Extract MP3").bold().frame(maxWidth: .infinity).padding().background(Color.blue).cornerRadius(10)
                                  }.disabled(dl.isDownloading)
                              }.padding(.horizontal).foregroundColor(.white)
                              
                              if dl.isDownloading { ProgressView(value: dl.downloadProgress).accentColor(.purple).padding() }
                              Spacer()
                          }
                          
                          if dl.showSearchResults {
                              Color.black.ignoresSafeArea().overlay(
                                  VStack {
                                      HStack { Text("Results").font(.title).bold(); Spacer(); Button("Close") { dl.showSearchResults = false } }.padding().foregroundColor(.white)
                                      ScrollView {
                                          ForEach(dl.searchResults) { track in
                                              HStack {
                                                  VStack(alignment: .leading) { 
                                                      Text(track.title ?? "").bold().lineLimit(1)
                                                      Text("\(track.user?.username ?? "") • \(track.durationFormatted)").font(.caption).foregroundColor(.gray) 
                                                  }
                                                  Spacer()
                                                  Button(action: { dl.showSearchResults = false; dl.startDownload(url: track.permalink_url ?? "", name: track.title ?? "") }) {
                                                      Image(systemName: "arrow.down.circle.fill").font(.title).foregroundColor(.purple)
                                                  }
                                              }.padding().background(Color.white.opacity(0.1)).cornerRadius(10)
                                          }.padding(.horizontal)
                                      }
                                  }
                              )
                          }
                      }.navigationBarHidden(true)
                      .alert("Success", isPresented: $dl.showSuccess) { Button("OK") {} }
                      .alert("Error", isPresented: $dl.showError) { Button("OK") {} } message: { Text(dl.errorDetails) }
                  }
              }
          }
          SWIFT

      - name: Generate Icon
        run: |
          mkdir -p TrollMusicApp/TrollMusicApp/Assets.xcassets/AppIcon.appiconset
          echo 'import AppKit' > make_icon.swift
          echo 'let img = NSImage(size: CGSize(width: 1024, height: 1024))' >> make_icon.swift
          echo 'img.lockFocus()' >> make_icon.swift
          echo 'NSColor.black.set(); NSBezierPath(rect: NSRect(x: 0, y: 0, width: 1024, height: 1024)).fill()' >> make_icon.swift
          echo 'let str = NSAttributedString(string: "AS", attributes: [.font: NSFont.boldSystemFont(ofSize: 500), .foregroundColor: NSColor.systemPurple])' >> make_icon.swift
          echo 'str.draw(at: NSPoint(x: 200, y: 250))' >> make_icon.swift
          echo 'img.unlockFocus()' >> make_icon.swift
          echo 'try! img.tiffRepresentation!.write(to: URL(fileURLWithPath: "TrollMusicApp/TrollMusicApp/Assets.xcassets/AppIcon.appiconset/icon.png"))' >> make_icon.swift
          swift make_icon.swift
          echo '{ "images": [ { "filename": "icon.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" } ], "info": { "author": "xcode", "version": 1 } }' > TrollMusicApp/TrollMusicApp/Assets.xcassets/AppIcon.appiconset/Contents.json

      - name: Build IPA
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          xcodebuild archive -project TrollMusicApp.xcodeproj -scheme TrollMusicApp -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -archivePath "$PWD/build/TrollMusicApp.xcarchive" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -R "build/TrollMusicApp.xcarchive/Products/Applications/TrollMusicApp.app" Payload/
          zip -r TrollMusicApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TrollMusicApp-IPA
          path: TrollMusicApp.ipa
