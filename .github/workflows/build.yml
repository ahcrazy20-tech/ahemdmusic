name: Build TrollMusicApp

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Project Config
        run: |
          echo 'name: TrollMusicApp' > project.yml
          echo 'options:' >> project.yml
          echo '  bundleIdPrefix: com.ahmedsoliman' >> project.yml
          echo 'targets:' >> project.yml
          echo '  TrollMusicApp:' >> project.yml
          echo '    type: application' >> project.yml
          echo '    platform: iOS' >> project.yml
          echo '    deploymentTarget: "16.0"' >> project.yml
          echo '    sources:' >> project.yml
          echo '      - path: TrollMusicApp/TrollMusicApp' >> project.yml
          echo '    info:' >> project.yml
          echo '      path: TrollMusicApp/TrollMusicApp/Info.plist' >> project.yml
          echo '      properties:' >> project.yml
          echo '        UILaunchScreen: {}' >> project.yml
          echo '        UIBackgroundModes: [audio]' >> project.yml
          echo '        NSAppTransportSecurity:' >> project.yml
          echo '          NSAllowsArbitraryLoads: true' >> project.yml
          echo '    settings:' >> project.yml
          echo '      GENERATE_INFOPLIST_FILE: "NO"' >> project.yml
          echo '      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon' >> project.yml

          mkdir -p TrollMusicApp/TrollMusicApp
          cat << 'PLIST' > TrollMusicApp/TrollMusicApp/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.ahmedsoliman.trollmusicapp</string>
              <key>CFBundleName</key>
              <string>AS Music</string>
              <key>CFBundleExecutable</key>
              <string>TrollMusicApp</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>UIBackgroundModes</key><array><string>audio</string></array>
              <key>NSAppTransportSecurity</key><dict><key>NSAllowsArbitraryLoads</key><true/></dict>
              <key>UILaunchScreen</key><dict/>
          </dict>
          </plist>
          PLIST

      - name: Write App Main & Music Manager
        run: |
          cat << 'SWIFT' > TrollMusicApp/TrollMusicApp/TrollMusicAppApp.swift
          import SwiftUI
          import AVFoundation

          @main
          struct TrollMusicAppApp: App {
              init() {
                  try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .default)
                  try? AVAudioSession.sharedInstance().setActive(true)
                  UIApplication.shared.beginReceivingRemoteControlEvents()
              }
              var body: some Scene {
                  WindowGroup { MainTabView().environmentObject(MusicManager.shared) }
              }
          }
          SWIFT

          cat << 'SWIFT' > TrollMusicApp/TrollMusicApp/MusicManager.swift
          import Foundation
          import AVFoundation
          import MediaPlayer
          import SwiftUI

          struct Song: Identifiable, Codable, Equatable { var id: UUID; var title: String; var url: URL }
          struct Playlist: Identifiable, Codable { var id: UUID; var name: String; var songIDs: [UUID] }

          class MusicManager: NSObject, ObservableObject, AVAudioPlayerDelegate {
              static let shared = MusicManager()
              @Published var songs: [Song] = []
              @Published var playlists: [Playlist] = []
              @Published var currentSong: Song?
              @Published var isPlaying: Bool = false
              @Published var currentTime: TimeInterval = 0.0
              @Published var duration: TimeInterval = 1.0
              @Published var sleepTimerMinutes: Int = 0
              
              var audioPlayer: AVAudioPlayer?
              var avPlayer: AVPlayer?
              var useAVPlayer = false
              var progressTimer: Timer?
              
              override init() {
                  super.init()
                  loadSongs(); loadPlaylists()
                  let cc = MPRemoteCommandCenter.shared()
                  cc.playCommand.addTarget { _ in self.togglePlayPause(); return .success }
                  cc.pauseCommand.addTarget { _ in self.togglePlayPause(); return .success }
                  cc.nextTrackCommand.addTarget { _ in self.playNext(); return .success }
                  cc.previousTrackCommand.addTarget { _ in self.playPrevious(); return .success }
              }
              
              func loadSongs() {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let files = (try? FileManager.default.contentsOfDirectory(at: docs, includingPropertiesForKeys: nil)) ?? []
                  let audio = files.filter { ["mp3", "m4a", "wav", "webm", "mp4"].contains($0.pathExtension.lowercased()) }
                  DispatchQueue.main.async { self.songs = audio.map { Song(id: UUID(), title: $0.deletingPathExtension().lastPathComponent, url: $0) }.sorted { $0.title < $1.title } }
              }

              func loadPlaylists() {
                  if let data = UserDefaults.standard.data(forKey: "savedPlaylists"), let decoded = try? JSONDecoder().decode([Playlist].self, from: data) { playlists = decoded }
                  if playlists.isEmpty { playlists = [Playlist(id: UUID(), name: "Liked Songs", songIDs: [])]; savePlaylists() }
              }
              func savePlaylists() { if let encoded = try? JSONEncoder().encode(playlists) { UserDefaults.standard.set(encoded, forKey: "savedPlaylists") } }

              func playSong(_ song: Song) {
                  audioPlayer?.stop(); avPlayer?.pause()
                  do {
                      audioPlayer = try AVAudioPlayer(contentsOf: song.url); audioPlayer?.delegate = self; audioPlayer?.play(); useAVPlayer = false
                  } catch {
                      avPlayer = AVPlayer(url: song.url); avPlayer?.play(); useAVPlayer = true
                  }
                  currentSong = song; isPlaying = true; startProgressTimer(); updateNowPlaying()
              }
              
              func togglePlayPause() {
                  if isPlaying {
                      if useAVPlayer { avPlayer?.pause() } else { audioPlayer?.pause() }
                  } else {
                      if useAVPlayer { avPlayer?.play() } else { audioPlayer?.play() }
                  }
                  isPlaying.toggle(); updateNowPlaying()
              }

              func playNext() {
                  guard !songs.isEmpty, let current = currentSong, let idx = songs.firstIndex(of: current) else { return }
                  playSong(songs[(idx + 1) % songs.count])
              }
              func playPrevious() {
                  guard !songs.isEmpty, let current = currentSong, let idx = songs.firstIndex(of: current) else { return }
                  playSong(songs[(idx - 1 + songs.count) % songs.count])
              }

              func startProgressTimer() {
                  progressTimer?.invalidate()
                  progressTimer = Timer.scheduledTimer(withTimeInterval: 0.5, repeats: true) { _ in
                      DispatchQueue.main.async {
                          self.currentTime = self.useAVPlayer ? (self.avPlayer?.currentTime().seconds ?? 0) : (self.audioPlayer?.currentTime ?? 0)
                          let d = self.useAVPlayer ? (self.avPlayer?.currentItem?.duration.seconds ?? 1) : (self.audioPlayer?.duration ?? 1)
                          self.duration = (d.isNaN || d.isInfinite) ? 1 : d
                      }
                  }
              }

              func seek(to: TimeInterval) { if useAVPlayer { avPlayer?.seek(to: CMTime(seconds: to, preferredTimescale: 1000)) } else { audioPlayer?.currentTime = to } }
              func formatTime(_ t: TimeInterval) -> String { 
                  if t.isNaN || t.isInfinite { return "0:00" }
                  let m = Int(t)/60; let s = Int(t)%60; return String(format: "%d:%02d", m, s) 
              }

              func updateNowPlaying() {
                  var info = [String: Any]()
                  info[MPMediaItemPropertyTitle] = currentSong?.title ?? ""
                  info[MPNowPlayingInfoPropertyPlaybackRate] = isPlaying ? 1.0 : 0.0
                  MPNowPlayingInfoCenter.default().nowPlayingInfo = info
              }
              
              func setSleepTimer(minutes: Int) {
                  sleepTimerMinutes = minutes
                  if minutes > 0 { Timer.scheduledTimer(withTimeInterval: Double(minutes * 60), repeats: false) { _ in DispatchQueue.main.async { if self.isPlaying { self.togglePlayPause() }; self.sleepTimerMinutes = 0 } } }
              }
              func audioPlayerDidFinishPlaying(_ p: AVAudioPlayer, successfully: Bool) { playNext() }
          }
          SWIFT

      - name: Write Web Hub & Smart Downloader
        run: |
          cat << 'SWIFT' > TrollMusicApp/TrollMusicApp/SmartDownloader.swift
          import SwiftUI
          import WebKit

          struct SCResponse: Codable { let collection: [SCTrack] }
          struct SCTrack: Codable, Identifiable {
              let id: Int; let title: String?; let user: SCUser?; let duration: Int?; let permalink_url: String?
              var durationFormatted: String {
                  guard let d = duration else { return "0:00" }
                  let s = d / 1000; return String(format: "%d:%02d", s / 60, s % 60)
              }
          }
          struct SCUser: Codable { let username: String? }
          struct CobaltResponse: Codable { var status: String?; var url: String?; var text: String? }

          class SmartDownloaderManager: NSObject, ObservableObject, URLSessionDownloadDelegate {
              static let shared = SmartDownloaderManager()
              @Published var isDownloading = false; @Published var isSearching = false; @Published var statusMessage = ""
              @Published var downloadProgress: Double = 0.0; @Published var searchResults: [SCTrack] = []; @Published var showSearchResults = false
              @Published var showSuccess = false; @Published var showError = false; @Published var errorDetails = ""
              
              private var downloadSession: URLSession!; private var currentServerIdx = 0; private var watchdog: Timer?
              private let servers = ["https://co.wuk.sh", "https://cobalt.api.timeless.top", "https://co.eepy.today", "https://cobalt.q0.is", "https://api.vidiq.org", "https://api.cobalt.tools"]
              private var cUrl = ""; private var cName = ""; private let scId = "X2iyLRaFdot6PHiU6l7tTR8wRSTY0sFp"

              override init() {
                  super.init()
                  downloadSession = URLSession(configuration: .default, delegate: self, delegateQueue: nil)
              }

              func performMagicSearch(query: String) {
                  isSearching = true; searchResults = []
                  let url = URL(string: "https://api-v2.soundcloud.com/search/tracks?q=\(query.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? "")&client_id=\(scId)&limit=25")!
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      DispatchQueue.main.async { self.isSearching = false }
                      if let data = data, let res = try? JSONDecoder().decode(SCResponse.self, from: data) {
                          DispatchQueue.main.async { self.searchResults = res.collection; self.showSearchResults = true }
                      }
                  }.resume()
              }

              func startDownload(url: String, name: String) {
                  cUrl = url; cName = name; currentServerIdx = 0; isDownloading = true; tryNextServer()
              }

              private func tryNextServer() {
                  watchdog?.invalidate()
                  if currentServerIdx >= servers.count {
                      DispatchQueue.main.async { self.isDownloading = false; self.errorDetails = "All download attempts failed."; self.showError = true }
                      return
                  }
                  
                  DispatchQueue.main.async { self.statusMessage = "Bypassing (Server \(self.currentServerIdx + 1))..." }
                  watchdog = Timer.scheduledTimer(withTimeInterval: 10, repeats: false) { _ in
                      self.currentServerIdx += 1; self.tryNextServer()
                  }

                  var req = URLRequest(url: URL(string: servers[currentServerIdx] + "/api/json")!)
                  req.httpMethod = "POST"; req.setValue("application/json", forHTTPHeaderField: "Content-Type"); req.setValue("application/json", forHTTPHeaderField: "Accept")
                  req.httpBody = try? JSONSerialization.data(withJSONObject: ["url": cUrl, "isAudioOnly": true, "aFormat": "mp3"])

                  URLSession.shared.dataTask(with: req) { data, _, _ in
                      if let data = data, let res = try? JSONDecoder().decode(CobaltResponse.self, from: data), let stream = res.url {
                          self.watchdog?.invalidate(); self.downloadFile(url: stream)
                      }
                  }.resume()
              }

              private func downloadFile(url: String) {
                  DispatchQueue.main.async { self.statusMessage = "Downloading MP3..." }
                  downloadSession.downloadTask(with: URL(string: url)!).resume()
              }

              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask, didWriteData: Int64, totalBytesWritten: Int64, totalBytesExpectedToWrite: Int64) {
                  DispatchQueue.main.async { self.downloadProgress = Double(totalBytesWritten) / Double(totalBytesExpectedToWrite) }
              }

              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask, didFinishDownloadingTo location: URL) {
                  let dest = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0].appendingPathComponent("\(cName).mp3")
                  try? FileManager.default.removeItem(at: dest); try? FileManager.default.moveItem(at: location, to: dest)
                  DispatchQueue.main.async { self.isDownloading = false; self.showSuccess = true; MusicManager.shared.loadSongs() }
              }
          }
          SWIFT

          cat << 'SWIFT' > TrollMusicApp/TrollMusicApp/WebHub.swift
          import SwiftUI
          import WebKit

          struct BrowserTab: Identifiable { let id = UUID(); var webView: WKWebView; var urlString: String }

          class WebViewModel: ObservableObject {
              @Published var tabs: [BrowserTab] = []; @Published var currentTabIndex = 0; @Published var showTabs = false; @Published var urlInput = "https://google.com"
              init() { addNewTab() }
              func addNewTab() {
                  let wv = WKWebView(); wv.allowsBackForwardNavigationGestures = true
                  tabs.append(BrowserTab(webView: wv, urlString: "https://google.com")); currentTabIndex = tabs.count - 1; loadUrl("https://google.com")
              }
              func loadUrl(_ s: String) {
                  var f = s.trimmingCharacters(in: .whitespaces)
                  if !f.hasPrefix("http") { f = "https://www.google.com/search?q=" + f.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed)! }
                  if let u = URL(string: f) { tabs[currentTabIndex].webView.load(URLRequest(url: u)) }
              }
              func grab() {
                  let js = "var m = document.querySelector('audio, video'); m ? m.src : null;"
                  tabs[currentTabIndex].webView.evaluateJavaScript(js) { res, _ in
                      if let u = res as? String { SmartDownloaderManager.shared.startDownload(url: u, name: "Web_Grab") }
                  }
              }
          }

          struct BrowserMainView: View {
              @StateObject var vm = WebViewModel()
              var body: some View {
                  VStack(spacing: 0) {
                      HStack {
                          TextField("Search or URL", text: $vm.urlInput).textFieldStyle(.roundedBorder)
                          Button("Go") { vm.loadUrl(vm.urlInput) }
                          Button(action: { vm.showTabs = true }) { Image(systemName: "square.on.square") }
                      }.padding(8)
                      ZStack {
                          ForEach(vm.tabs.indices, id: \.self) { i in
                              WebViewContainer(wv: vm.tabs[i].webView).opacity(i == vm.currentTabIndex ? 1 : 0)
                          }
                      }
                      HStack {
                          Button(action: { vm.tabs[vm.currentTabIndex].webView.goBack() }) { Image(systemName: "chevron.left") }
                          Spacer(); Button(action: { vm.grab() }) { Image(systemName: "arrow.down.circle.fill").font(.title).foregroundColor(.purple) }
                          Spacer(); Button(action: { vm.tabs[vm.currentTabIndex].webView.reload() }) { Image(systemName: "arrow.clockwise") }
                      }.padding().background(Color(uiColor: .secondarySystemBackground))
                  }
                  .sheet(isPresented: $vm.showTabs) {
                      VStack {
                          HStack { Text("Tabs").font(.title).bold(); Spacer(); Button("New") { vm.addNewTab() } }.padding()
                          List(vm.tabs.indices, id: \.self) { i in
                              Text("Tab \(i+1)").onTapGesture { vm.currentTabIndex = i; vm.showTabs = false }
                          }
                      }
                  }
              }
          }

          struct WebViewContainer: UIViewRepresentable {
              let wv: WKWebView
              func makeUIView(context: Context) -> WKWebView { wv }
              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }
          SWIFT

      - name: Write Main UI Logic
        run: |
          cat << 'SWIFT' > TrollMusicApp/TrollMusicApp/Views.swift
          import SwiftUI

          struct MainTabView: View {
              @EnvironmentObject var mm: MusicManager
              @State private var showFull = false
              var body: some View {
                  ZStack(alignment: .bottom) {
                      TabView {
                          LibraryView().tabItem { Label("Library", systemImage: "music.note.list") }
                          PlaylistsView().tabItem { Label("Playlists", systemImage: "music.mic") }
                          SmartDownloaderView().tabItem { Label("Magic DL", systemImage: "sparkles") }
                          BrowserMainView().tabItem { Label("Web Hub", systemImage: "safari") }
                      }.accentColor(.purple)
                      
                      if mm.currentSong != nil {
                          VStack(spacing: 0) {
                              HStack {
                                  RoundedRectangle(cornerRadius: 5).fill(Color.purple).frame(width: 40, height: 40).overlay(Image(systemName: "music.note").foregroundColor(.white))
                                  VStack(alignment: .leading) { Text(mm.currentSong?.title ?? "").font(.subheadline).bold().lineLimit(1); Text("AS Music").font(.caption).foregroundColor(.gray) }
                                  Spacer(); Button(action: { mm.togglePlayPause() }) { Image(systemName: mm.isPlaying ? "pause.fill" : "play.fill").font(.title2) }
                              }.padding(10).background(.ultraThinMaterial).onTapGesture { showFull = true }
                              Color.clear.frame(height: 50)
                          }
                      }
                  }.sheet(isPresented: $showFull) { FullPlayerView() }
              }
          }

          struct SmartDownloaderView: View {
              @StateObject var dl = SmartDownloaderManager.shared
              @State private var search = ""; @State private var link = ""; @State private var name = ""
              var body: some View {
                  NavigationView {
                      ZStack {
                          Color.black.ignoresSafeArea(); ScrollView {
                              VStack(spacing: 20) {
                                  Image(systemName: "sparkles").resizable().frame(width: 60, height: 60).foregroundColor(.purple).padding(.top)
                                  VStack(spacing: 15) {
                                      HStack { TextField("Search music...", text: $search).padding().background(Color.white.opacity(0.1)).cornerRadius(12); Button(action: { dl.performMagicSearch(query: search) }) { Image(systemName: "magnifyingglass").padding().background(Color.purple).cornerRadius(12) } }
                                      TextField("Paste Link...", text: $link).padding().background(Color.white.opacity(0.1)).cornerRadius(12)
                                      TextField("Name...", text: $name).padding().background(Color.white.opacity(0.1)).cornerRadius(12)
                                      Button(action: { dl.startDownload(url: link, name: name) }) { 
                                          Text(dl.isDownloading ? dl.statusMessage : "Download").bold().frame(maxWidth: .infinity).padding().background(Color.blue).cornerRadius(12)
                                      }.disabled(dl.isDownloading)
                                      if dl.isDownloading { ProgressView(value: dl.downloadProgress).accentColor(.purple) }
                              }.padding().foregroundColor(.white)
                              Spacer()
                          }
                          }
                          if dl.showSearchResults {
                              Color.black.overlay(VStack {
                                  HStack { Text("Results").font(.title).bold(); Spacer(); Button("Close") { dl.showSearchResults = false } }.padding().foregroundColor(.white)
                                  ScrollView {
                                      ForEach(dl.searchResults) { track in
                                          HStack {
                                              VStack(alignment: .leading) { Text(track.title ?? "").bold().lineLimit(1); Text("\(track.user?.username ?? "") • \(track.durationFormatted)").font(.caption).foregroundColor(.gray) }
                                              Spacer(); Button(action: { dl.showSearchResults = false; dl.startDownload(url: track.permalink_url ?? "", name: track.title ?? "") }) { Image(systemName: "arrow.down.circle.fill").font(.title).foregroundColor(.purple) }
                                          }.padding().background(Color.white.opacity(0.1)).cornerRadius(10)
                                      }.padding(.horizontal)
                                  }
                              })
                          }
                      }.navigationBarHidden(true)
                  }
              }
          }

          struct LibraryView: View {
              @EnvironmentObject var mm: MusicManager
              var body: some View {
                  NavigationView {
                      List {
                          ForEach(mm.songs) { song in
                              Button(action: { mm.playSong(song) }) { HStack { Image(systemName: "music.note").foregroundColor(.purple); Text(song.title) } }
                          }.onDelete { idx in idx.forEach { try? FileManager.default.removeItem(at: mm.songs[$0].url) }; mm.loadSongs() }
                      }.navigationTitle("Library")
                  }
              }
          }

          struct PlaylistsView: View {
              @EnvironmentObject var mm: MusicManager
              var body: some View {
                  NavigationView {
                      List(mm.playlists) { p in
                          NavigationLink(p.name) { List(mm.songs.filter { p.songIDs.contains($0.id) }) { s in Text(s.title) }.navigationTitle(p.name) }
                      }.navigationTitle("Playlists")
                  }
              }
          }

          struct FullPlayerView: View {
              @EnvironmentObject var mm: MusicManager
              @Environment(\.dismiss) var dismiss
              var body: some View {
                  ZStack {
                      LinearGradient(colors: [.purple.opacity(0.6), .black], startPoint: .top, endPoint: .bottom).ignoresSafeArea()
                      VStack(spacing: 30) {
                          HStack { Button(action: { dismiss() }) { Image(systemName: "chevron.down") }; Spacer(); Text("NOW PLAYING").font(.caption).bold(); Spacer(); Image(systemName: "moon.fill") }.padding().foregroundColor(.white)
                          RoundedRectangle(cornerRadius: 20).fill(Color.white.opacity(0.1)).frame(width: 300, height: 300).overlay(Image(systemName: "music.note").resizable().frame(width: 100, height: 100).foregroundColor(.white))
                          VStack { Text(mm.currentSong?.title ?? "Unknown").font(.title2).bold(); Text("AS Music Player").foregroundColor(.gray) }.foregroundColor(.white)
                          VStack {
                              Slider(value: Binding(get: { mm.currentTime }, set: { mm.seek(to: $0) }), in: 0...mm.duration).accentColor(.white)
                              HStack { Text(mm.formatTime(mm.currentTime)); Spacer(); Text(mm.formatTime(mm.duration)) }.font(.caption).foregroundColor(.gray)
                          }.padding(.horizontal, 30)
                          HStack(spacing: 50) {
                              Button(action: { mm.playPrevious() }) { Image(systemName: "backward.fill").font(.title) }
                              Button(action: { mm.togglePlayPause() }) { Image(systemName: mm.isPlaying ? "pause.circle.fill" : "play.circle.fill").font(.system(size: 70)) }
                              Button(action: { mm.playNext() }) { Image(systemName: "forward.fill").font(.title) }
                          }.foregroundColor(.white)
                          Spacer()
                      }
                  }
              }
          }
          SWIFT

      - name: Generate Icon
        run: |
          mkdir -p TrollMusicApp/TrollMusicApp/Assets.xcassets/AppIcon.appiconset
          echo 'import AppKit' > make_icon.swift
          echo 'let img = NSImage(size: CGSize(width: 1024, height: 1024))' >> make_icon.swift
          echo 'img.lockFocus()' >> make_icon.swift
          echo 'NSColor.black.set(); NSBezierPath(rect: NSRect(x: 0, y: 0, width: 1024, height: 1024)).fill()' >> make_icon.swift
          echo 'let str = NSAttributedString(string: "AS", attributes: [.font: NSFont.boldSystemFont(ofSize: 500), .foregroundColor: NSColor.systemPurple])' >> make_icon.swift
          echo 'str.draw(at: NSPoint(x: 200, y: 250))' >> make_icon.swift
          echo 'img.unlockFocus()' >> make_icon.swift
          echo 'try! img.tiffRepresentation!.write(to: URL(fileURLWithPath: "TrollMusicApp/TrollMusicApp/Assets.xcassets/AppIcon.appiconset/icon.png"))' >> make_icon.swift
          swift make_icon.swift
          echo '{ "images": [ { "filename": "icon.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" } ], "info": { "author": "xcode", "version": 1 } }' > TrollMusicApp/TrollMusicApp/Assets.xcassets/AppIcon.appiconset/Contents.json

      - name: Build IPA
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          xcodebuild archive -project TrollMusicApp.xcodeproj -scheme TrollMusicApp -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -archivePath "$PWD/build/TrollMusicApp.xcarchive" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -R "build/TrollMusicApp.xcarchive/Products/Applications/TrollMusicApp.app" Payload/
          zip -r TrollMusicApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollMusicApp-IPA
          path: TrollMusicApp.ipa
