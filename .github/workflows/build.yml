          import Foundation
          import UIKit
          import SwiftUI
          import AVFoundation
          import WebKit
          import os.log
          import Combine

          // ---------------------------------------------------------------------------
          // MARK: - Logging
          // ---------------------------------------------------------------------------
          fileprivate let log = Logger(subsystem: "com.ahmedsoliman.trollmusicapp", category: "MagicDL")

          // ---------------------------------------------------------------------------
          // MARK: - Normalised search result model
          // ---------------------------------------------------------------------------
          enum SearchResultSource: String, Codable {
              case mp3juice_yt, mp3juice_sc, youtube, itunes, deezer, soundcloud
          }

          struct SearchResult: Identifiable, Equatable {
              let id = UUID()
              let source: SearchResultSource
              let title: String
              let artist: String
              let duration: TimeInterval?
              let artworkURL: URL?
              let previewURL: URL?
              /// MP3Juice video/track id (11-char YT id, or SoundCloud numeric id string)
              let platform: String    // "yt" or "sc"
              let extId: String
              static func == (lhs: SearchResult, rhs: SearchResult) -> Bool { lhs.id == rhs.id }

              var durationFormatted: String {
                  guard let d = duration else { return "" }
                  let s = Int(d)
                  return "• " + String(format: "%d:%02d", s / 60, s % 60)
              }
          }

          // ---------------------------------------------------------------------------
          // MARK: - Shared Download Center
          // ---------------------------------------------------------------------------
          enum DownloadTaskStatus: Equatable {
              case queued
              case contacting(Double)
              case converting(Double)
              case downloading(Double)
              case done
              case failed(String)
          }

          class DownloadTask: ObservableObject, Identifiable {
              let id = UUID()
              let vid: String     // platform id (YT 11-char or SC numeric)
              let platform: String
              let proposedName: String
              @Published var status: DownloadTaskStatus = .queued
              @Published var fileName: String = ""
              init(vid: String, platform: String, proposedName: String) {
                  self.vid = vid; self.platform = platform; self.proposedName = proposedName
              }
          }

          class DownloadCenter: NSObject, ObservableObject, URLSessionDownloadDelegate {
              static let shared = DownloadCenter()

              @Published var tasks: [DownloadTask] = []
              @Published var showBanner: Bool = false

              private var session: URLSession!
              private var activeTask: DownloadTask?
              private var activeURLTask: URLSessionDownloadTask?
              private var mp3juiceKey: String?
              private var mp3juiceKeyDate: Date?
              private var pollTimer: Timer?
              private var convertRetries = 0

              override private init() {
                  super.init()
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest = 25
                  config.timeoutIntervalForResource = 180
                  session = URLSession(configuration: config, delegate: self, delegateQueue: nil)
              }

              // ---- Public API -------------------------------------------------------
              func enqueue(vid: String, platform: String, suggestedName: String, then: (() -> Void)? = nil) {
                  var name = suggestedName
                      .replacingOccurrences(of: "/", with: "-")
                      .trimmingCharacters(in: .whitespacesAndNewlines)
                  if name.isEmpty { name = "Track" }
                  let task = DownloadTask(vid: vid, platform: platform, proposedName: name)
                  DispatchQueue.main.async {
                      self.objectWillChange.send()
                      self.tasks.insert(task, at: 0)
                      self.showBanner = true
                      if self.activeTask == nil { self.startNext() }
                      then?()
                  }
              }
              func enqueueDirect(url: URL, suggestedName: String) {
                  // For Web Hub "Grab Audio" / MIME: we still use the direct strategy, so create
                  // a pseudo-task and fall back to a direct downloader path.
                  var name = suggestedName
                      .replacingOccurrences(of: "/", with: "-")
                      .trimmingCharacters(in: .whitespacesAndNewlines)
                  if name.isEmpty { name = url.lastPathComponent }
                  let task = DownloadTask(vid: url.absoluteString, platform: "direct", proposedName: name)
                  DispatchQueue.main.async {
                      self.objectWillChange.send()
                      self.tasks.insert(task, at: 0)
                      self.showBanner = true
                      if self.activeTask == nil { self.startNext() }
                  }
              }

              func retry(_ task: DownloadTask) {
                  DispatchQueue.main.async {
                      self.objectWillChange.send()
                      task.status = .queued
                      if self.activeTask == nil { self.startNext() }
                  }
              }

              func clearCompleted() {
                  DispatchQueue.main.async {
                      self.objectWillChange.send()
                      self.tasks.removeAll {
                          if case .done = $0.status { return true }
                          if case .failed = $0.status { return true }
                          return false
                      }
                      if self.tasks.isEmpty { self.showBanner = false }
                  }
              }
              func remove(_ task: DownloadTask) {
                  DispatchQueue.main.async {
                      self.objectWillChange.send()
                      self.tasks.removeAll { $0.id == task.id }
                      if self.tasks.isEmpty { self.showBanner = false }
                  }
              }

              func dismiss() { DispatchQueue.main.async { self.showBanner = false } }

              // ---- Queue driver ----------------------------------------------------
              private func startNext() {
                  guard let next = tasks.first(where: {
                      if case .queued = $0.status { return true }; return false
                  }) else { activeTask = nil; pollTimer?.invalidate(); pollTimer = nil; return }
                  activeTask = next
                  if next.platform == "direct" {
                      downloadDirect(task: next, url: URL(string: next.vid)!)
                  } else {
                      beginMp3Juice(task: next)
                  }
              }

              private func finish(task: DownloadTask) {
                  DispatchQueue.main.async {
                      task.status = .done
                      MusicManager.shared.loadSongs()
                      self.activeTask = nil
                      self.startNext()
                  }
              }
              private func fail(task: DownloadTask, message: String) {
                  DispatchQueue.main.async {
                      task.status = .failed(message)
                      log.error("Download failed: \(message, privacy: .public)")
                      self.activeTask = nil
                      self.pollTimer?.invalidate(); self.pollTimer = nil
                      self.startNext()
                  }
              }

              // ---- Direct download (Web Hub) ---------------------------------------
              private func downloadDirect(task: DownloadTask, url: URL) {
                  DispatchQueue.main.async { self.objectWillChange.send(); task.fileName = task.proposedName; task.status = .downloading(0) }
                  var req = URLRequest(url: url, timeoutInterval: 60)
                  req.setValue("Mozilla/5.0", forHTTPHeaderField: "User-Agent")
                  let t = session.downloadTask(with: req)
                  activeURLTask = t; t.resume()
              }

              // ---- MP3Juice.sc pipeline --------------------------------------------
              private func beginMp3Juice(task: DownloadTask) {
                  convertRetries = 0
                  mp3JuiceAuth { [weak self] key in
                      guard let self = self else { return }
                      guard let key = key else {
                          self.fail(task: task, message: "MP3Juice unavailable"); return
                      }
                      self.mp3JuiceInitThenConvert(task: task, key: key)
                  }
              }

              private func mp3JuiceAuth(completion: @escaping (String?) -> Void) {
                  // Cached key
                  if let k = mp3juiceKey, let d = mp3juiceKeyDate, Date().timeIntervalSince(d) < 600 {
                      completion(k); return
                  }
                  let ts = Int(Date().timeIntervalSince1970 * 1000)
                  guard let url = URL(string: "https://theta.thetacloud.org/api/v1/auth?_=\(ts)") else {
                      completion(nil); return
                  }
                  var req = URLRequest(url: url, timeoutInterval: 15)
                  req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)", forHTTPHeaderField: "User-Agent")
                  req.setValue("https://mp3juice.sc/", forHTTPHeaderField: "Referer")
                  req.setValue("https://mp3juice.sc", forHTTPHeaderField: "Origin")
                  URLSession.shared.dataTask(with: req) { [weak self] data, _, err in
                      guard let self = self, let data = data, err == nil,
                            let j = try? JSONSerialization.jsonObject(with: data) as? [String:Any],
                            let key = j["key"] as? String else { completion(nil); return }
                      self.mp3juiceKey = key; self.mp3juiceKeyDate = Date()
                      completion(key)
                  }.resume()
              }

              private func mp3JuiceInitThenConvert(task: DownloadTask, key: String) {
                  let ts = Int(Date().timeIntervalSince1970 * 1000)
                  guard let url = URL(string: "https://theta.thetacloud.org/api/v1/init?_=\(ts)") else {
                      fail(task: task, message: "Bad init URL"); return }
                  var req = URLRequest(url: url, timeoutInterval: 15)
                  req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)", forHTTPHeaderField: "User-Agent")
                  req.setValue("https://mp3juice.sc/", forHTTPHeaderField: "Referer")
                  req.setValue("https://mp3juice.sc", forHTTPHeaderField: "Origin")
                  req.setValue("Bearer \(key)", forHTTPHeaderField: "Authorization")
                  DispatchQueue.main.async { self.objectWillChange.send(); task.status = .contacting(0.3); task.fileName = task.proposedName }
                  URLSession.shared.dataTask(with: req) { [weak self] data, _, err in
                      guard let self = self, let data = data, err == nil,
                            let j = try? JSONSerialization.jsonObject(with: data) as? [String:Any],
                            var convertURL = j["convertURL"] as? String else {
                          self?.fail(task: task, message: "MP3Juice init failed"); return
                      }
                      convertURL = convertURL + "&v=\(task.vid)&f=mp3&_=\(ts)"
                      self.mp3JuiceConvert(task: task, key: key, url: convertURL, hops: 0)
                  }.resume()
              }

              private func mp3JuiceConvert(task: DownloadTask, key: String, url: String, hops: Int) {
                  guard hops < 15 else { fail(task: task, message: "Too many convert redirects"); return }
                  guard let u = URL(string: url) else { fail(task: task, message: "Bad convert URL"); return }
                  var req = URLRequest(url: u, timeoutInterval: 30)
                  req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)", forHTTPHeaderField: "User-Agent")
                  req.setValue("https://mp3juice.sc/", forHTTPHeaderField: "Referer")
                  req.setValue("https://mp3juice.sc", forHTTPHeaderField: "Origin")
                  req.setValue("Bearer \(key)", forHTTPHeaderField: "Authorization")
                  DispatchQueue.main.async { self.objectWillChange.send(); task.status = .converting(Double(hops+1)/10.0) }
                  URLSession.shared.dataTask(with: req) { [weak self] data, _, err in
                      guard let self = self, let data = data, err == nil,
                            let j = try? JSONSerialization.jsonObject(with: data) as? [String:Any] else {
                          // Retry once on network failure
                          if self?.convertRetries ?? 0 < 2 {
                              self?.convertRetries += 1
                              DispatchQueue.global().asyncAfter(deadline: .now() + 1.5) {
                                  self?.mp3JuiceInitThenConvert(task: task, key: key)
                              }
                          } else {
                              self?.fail(task: task, message: "Convert network error")
                          }
                          return
                      }
                      if let e = j["error"] as? Int, e != 0 {
                          self.fail(task: task, message: "Convert error \(e)"); return
                      }
                      if let dl = j["downloadURL"] as? String, !dl.isEmpty {
                          self.startMediaDownload(task: task, url: dl)
                          return
                      }
                      if let redir = j["redirect"] as? Int, redir == 1,
                         let next = j["redirectURL"] as? String {
                          self.mp3JuiceConvert(task: task, key: key, url: next, hops: hops+1)
                          return
                      }
                      if let prog = j["progressURL"] as? String, !prog.isEmpty {
                          self.pollProgress(task: task, key: key, url: prog)
                          return
                      }
                      self.fail(task: task, message: "Unexpected convert response")
                  }.resume()
              }

              private func pollProgress(task: DownloadTask, key: String, url: String) {
                  pollTimer?.invalidate()
                  var ticks = 0
                  pollTimer = Timer.scheduledTimer(withTimeInterval: 1.2, repeats: true) { [weak self] t in
                      guard let self = self else { t.invalidate(); return }
                      ticks += 1
                      guard ticks < 90 else { t.invalidate(); self.fail(task: task, message: "Convert timed out"); return }
                      guard let u = URL(string: url) else { t.invalidate(); self.fail(task: task, message: "Bad progress URL"); return }
                      var req = URLRequest(url: u, timeoutInterval: 10)
                      req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)", forHTTPHeaderField: "User-Agent")
                      req.setValue("https://mp3juice.sc/", forHTTPHeaderField: "Referer")
                      req.setValue("https://mp3juice.sc", forHTTPHeaderField: "Origin")
                      req.setValue("Bearer \(key)", forHTTPHeaderField: "Authorization")
                      URLSession.shared.dataTask(with: req) { data, _, _ in
                          guard let data = data,
                                let j = try? JSONSerialization.jsonObject(with: data) as? [String:Any] else { return }
                          if let dl = j["downloadURL"] as? String, !dl.isEmpty {
                              DispatchQueue.main.async { t.invalidate(); self.pollTimer = nil }
                              self.startMediaDownload(task: task, url: dl)
                              return
                          }
                          if let e = j["error"] as? Int, e != 0 {
                              DispatchQueue.main.async { t.invalidate(); self.pollTimer = nil }
                              self.fail(task: task, message: "Convert error \(e)")
                              return
                          }
                          if let p = j["progress"] as? Double {
                              DispatchQueue.main.async { self.objectWillChange.send(); task.status = .converting(p) }
                          }
                      }.resume()
                  }
                  // Make sure the timer runs on a runloop
                  RunLoop.main.add(pollTimer!, forMode: .common)
              }

              private func startMediaDownload(task: DownloadTask, url: String) {
                  guard let u = URL(string: url) else { fail(task: task, message: "Bad download URL"); return }
                  DispatchQueue.main.async { self.objectWillChange.send(); task.status = .downloading(0) }
                  var req = URLRequest(url: u, timeoutInterval: 120)
                  req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)", forHTTPHeaderField: "User-Agent")
                  req.setValue("https://mp3juice.sc/", forHTTPHeaderField: "Referer")
                  let t = session.downloadTask(with: req)
                  activeURLTask = t; t.resume()
              }

              // ---- URLSessionDownloadDelegate --------------------------------------
              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                              didWriteData bytesWritten: Int64, totalBytesWritten: Int64,
                              totalBytesExpectedToWrite: Int64) {
                  guard totalBytesExpectedToWrite > 0, let task = activeTask else { return }
                  let p = Double(totalBytesWritten) / Double(totalBytesExpectedToWrite)
                  DispatchQueue.main.async { self.objectWillChange.send(); task.status = .downloading(p) }
              }

              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                              didFinishDownloadingTo location: URL) {
                  guard let task = activeTask else { return }
                  let fm = FileManager.default
                  // Validate size
                  guard let attrs = try? fm.attributesOfItem(atPath: location.path),
                        let size = attrs[.size] as? Int64, size > 1_000 else {
                      retryDownload(task, reason: "Downloaded file was too small (corrupt).")
                      return
                  }
                  // Validate magic bytes — real audio starts with ID3 / 0xFF (MPEG frame) / OggS / ftyp (m4a) / RIFF (wav)
                  let magicValid: Bool = {
                      guard let fh = FileHandle(forReadingAtPath: location.path) else { return false }
                      defer { fh.closeFile() }
                      let head = fh.readData(ofLength: 12)
                      guard head.count >= 4 else { return false }
                      return head.starts(with: [0x49,0x44,0x33])         // ID3
                          || head[0] == 0xFF && (head[1] & 0xE0) == 0xE0 // MPEG sync 0xFFEx
                          || head.starts(with: [0x4F,0x67,0x67,0x53])    // OggS
                          || (head.count >= 8 && head[4..<8] == Data([0x66,0x74,0x79,0x70])) // ftyp (m4a/mp4)
                          || head.starts(with: [0x52,0x49,0x46,0x46])    // RIFF (wav)
                  }()
                  if !magicValid {
                      retryDownload(task, reason: "File was not a valid audio track. Retrying…")
                      return
                  }
                  var finalName = task.fileName.isEmpty ? task.proposedName : task.fileName
                  let audioExts = ["mp3","m4a","wav","webm","mp4","aac","ogg","opus"]
                  let fl = finalName.lowercased()
                  if !audioExts.contains(where: { fl.hasSuffix("." + $0) }) {
                      if let mimeType = (downloadTask.response as? HTTPURLResponse)?.mimeType {
                          if mimeType.contains("mpeg") || mimeType.contains("mp3") { finalName += ".mp3" }
                          else if mimeType.contains("mp4") || mimeType.contains("m4a") || mimeType.contains("aac") { finalName += ".m4a" }
                          else { finalName += ".mp3" }
                      } else { finalName += ".mp3" }
                  }
                  // Sanitize filename (emojis/control chars can cause file-system issues)
                  finalName = sanitizeFilename(finalName)
                  let destDir = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let destPath = destDir.appendingPathComponent(finalName)
                  // Ensure unique path (don't overwrite existing songs)
                  var finalPath = destPath
                  if fm.fileExists(atPath: destPath.path) {
                      let stem = (finalName as NSString).deletingPathExtension
                      let ext = (finalName as NSString).pathExtension
                      var i = 2
                      while fm.fileExists(atPath: finalPath.path) {
                          let candidate = ext.isEmpty ? "\(stem) \(i)" : "\(stem) \(i).\(ext)"
                          finalPath = destDir.appendingPathComponent(candidate)
                          i += 1
                      }
                  }
                  try? fm.removeItem(at: finalPath)
                  do {
                      try fm.moveItem(at: location, to: finalPath)
                      try fm.setAttributes([.protectionKey: FileProtectionType.none], ofItemAtPath: finalPath.path)
                  } catch {
                      fail(task: task, message: "Could not save file: \(error.localizedDescription)")
                      return
                  }
                  DispatchQueue.main.async {
                      task.fileName = finalPath.lastPathComponent
                      // Success haptic
                      let gen = UINotificationFeedbackGenerator()
                      gen.notificationOccurred(.success)
                  }
                  finish(task: task)
              }

              private func sanitizeFilename(_ s: String) -> String {
                  let invalid = CharacterSet(charactersIn: "/\\:*?\"<>|")
                  var out = s.components(separatedBy: invalid).joined(separator: "-")
                  out = out.trimmingCharacters(in: .whitespacesAndNewlines)
                  if out.isEmpty { out = "Track" }
                  return out
              }

              private func retryDownload(_ task: DownloadTask, reason: String) {
                  // Automatic retry up to 2 times per task with a fresh MP3Juice session.
                  let retryCount = tasks.filter { $0.id == task.id }.count // dummy; use objc associated via status change
                  // We re-enter queued state after bumping a counter stored in UserDefaults-free way by using task.fileName marker
                  let marker = "🔄retry:"
                  let existing = task.fileName.components(separatedBy: marker).last.flatMap(Int.init) ?? 0
                  if existing >= 2 {
                      fail(task: task, message: reason)
                      return
                  }
                  DispatchQueue.main.async {
                      self.objectWillChange.send()
                      task.status = .queued
                      task.fileName = task.proposedName + marker + "\(existing+1)"
                      if self.activeTask?.id == task.id {
                          self.activeTask = nil
                          self.pollTimer?.invalidate(); self.pollTimer = nil
                      }
                      self.startNext()
                  }
              }

              func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                  guard let err = error, let active = activeTask else { return }
                  if case .done = active.status { return }
                  if case .failed = active.status { return }
                  fail(task: active, message: err.localizedDescription)
              }
          }

          // ---------------------------------------------------------------------------
          // MARK: - Search models & SmartDownloaderManager
          // (We decode manually with JSONSerialization to be tolerant of type surprises)
          // ---------------------------------------------------------------------------

          class SmartDownloaderManager: NSObject, ObservableObject {
              @Published var isSearching = false
              @Published var statusMessage = ""
              @Published var showSuccess = false
              @Published var showError = false
              @Published var errorDetails = ""
              @Published var searchResults: [SearchResult] = []
              @Published var showSearchResults = false
              @Published var previewTrackId: UUID? = nil
              @Published var isPreviewPlaying = false

              @Published var pendingNameVid: String? = nil
              @Published var pendingNamePlatform: String = "yt"
              @Published var pendingNameDirectURL: URL? = nil
              @Published var pendingNameSuggestion: String = ""
              @Published var showNamePrompt: Bool = false
              @Published var nameInput: String = ""

              var previewPlayer: AVPlayer?

              // ---- Preview ---------------------------------------------------------
              func togglePreview(for result: SearchResult) {
                  if previewTrackId == result.id { stopPreview(); return }
                  guard let url = result.previewURL else {
                      statusMessage = "No preview for this source"; return
                  }
                  previewPlayer?.pause()
                  previewPlayer = AVPlayer(url: url)
                  previewPlayer?.play()
                  DispatchQueue.main.async { self.previewTrackId = result.id; self.isPreviewPlaying = true }
              }
              func stopPreview() {
                  previewPlayer?.pause(); previewPlayer = nil
                  DispatchQueue.main.async { self.previewTrackId = nil; self.isPreviewPlaying = false }
              }

              // ---- Name prompt entry points ---------------------------------------
              func requestDownload(result: SearchResult) {
                  let name = "\(result.artist) - \(result.title)"
                      .replacingOccurrences(of: "/", with: "-")
                  pendingNameVid = result.extId
                  pendingNamePlatform = result.platform
                  pendingNameDirectURL = result.previewURL
                  pendingNameSuggestion = name
                  nameInput = name
                  showNamePrompt = true
              }
              func confirmNamedDownload() {
                  showNamePrompt = false
                  if let u = pendingNameDirectURL {
                      DownloadCenter.shared.enqueueDirect(url: u, suggestedName: nameInput)
                  } else if let vid = pendingNameVid {
                      DownloadCenter.shared.enqueue(vid: vid, platform: pendingNamePlatform, suggestedName: nameInput)
                  }
                  pendingNameVid = nil; pendingNameDirectURL = nil
              }
              func cancelNamePrompt() {
                  showNamePrompt = false; pendingNameVid = nil; pendingNameDirectURL = nil
              }
              func requestLinkDownload(link: String, name: String) {
                  let s = link.trimmingCharacters(in: .whitespacesAndNewlines)
                  var vid: String?; var platform = "yt"
                  if s.lowercased().contains("soundcloud.com") {
                      // We don't have a numeric id for pasted SC links; fall through to error
                      errorDetails = "For SoundCloud links, please search by artist/track name in Magic DL."
                      showError = true; return
                  }
                  if let r = s.range(of: #"(?:youtu\.be/|youtube\.com/(?:embed/|live/|shorts/)|[?&]v=)([a-zA-Z0-9-_]{11})"#,
                                     options: .regularExpression) {
                      let match = String(s[r])
                      if let v = match.range(of: #"[a-zA-Z0-9-_]{11}"#, options: .regularExpression) {
                          vid = String(match[v])
                      }
                  }
                  guard let id = vid else {
                      errorDetails = "Could not parse that link. Try searching by name instead."
                      showError = true; return
                  }
                  let suggested = name.isEmpty ? s : name
                  pendingNameVid = id
                  pendingNamePlatform = platform
                  pendingNameDirectURL = nil
                  pendingNameSuggestion = suggested
                  nameInput = suggested
                  showNamePrompt = true
              }

              // ---- Search via MP3Juice --------------------------------------------
              func performMagicSearch(query: String) {
                  let clean = query.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !clean.isEmpty else { return }
                  stopPreview()
                  DispatchQueue.main.async {
                      self.isSearching = true
                      self.statusMessage = "Searching MP3Juice…"
                      self.searchResults = []
                      self.showSearchResults = false
                  }
                  guard let encQ = clean.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                        let b64 = encQ.data(using: .utf8)?.base64EncodedString(),
                        let b64enc = b64.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) else {
                      DispatchQueue.main.async { self.isSearching = false; self.errorDetails = "Bad query"; self.showError = true }
                      return
                  }
                  let ua = "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
                  // Fetch both YouTube (y=y) and SoundCloud (y=s) in parallel
                  let group = DispatchGroup()
                  let collectQ = DispatchQueue(label: "com.asmusic.collect")
                  var collected = [SearchResult]()
                  var lastErr: String?

                  func fetchOne(scope: String) {
                      group.enter()
                      let plat = (scope == "s") ? "sc" : "yt"
                      let us = "https://mp3juice.sc/api/v1/search?y=\(scope)&q=\(b64enc)&_=\(Int(Date().timeIntervalSince1970*1000))"
                      guard let url = URL(string: us) else { group.leave(); return }
                      var req = URLRequest(url: url, timeoutInterval: 20)
                      req.setValue(ua, forHTTPHeaderField: "User-Agent")
                      req.setValue("https://mp3juice.sc/", forHTTPHeaderField: "Referer")
                      URLSession.shared.dataTask(with: req) { data, _, err in
                          defer { group.leave() }
                          if let err = err { lastErr = err.localizedDescription; return }
                          guard let data = data,
                                let j = (try? JSONSerialization.jsonObject(with: data)) as? [String:Any] else { return }
                          let source: SearchResultSource = (scope == "s") ? .mp3juice_sc : .mp3juice_yt
                          let key = (scope == "s") ? "sc" : "yt"
                          for item in (j[key] as? [[String:Any]] ?? []) {
                              let idRaw = item["id"]
                              let idStr: String
                              if let s = idRaw as? String { idStr = s }
                              else if let n = idRaw as? NSNumber { idStr = n.stringValue }
                              else { continue }
                              guard let title = item["title"] as? String else { continue }
                              let durStr = item["duration"] as? String
                              let dur = durStr.flatMap { Self.parseDuration($0) }
                              var artist = (scope == "s") ? "SoundCloud" : "YouTube"
                              var ttl = title
                              if let r = title.range(of: " - ") {
                                  artist = String(title[..<r.lowerBound]).trimmingCharacters(in: .whitespaces)
                                  ttl = String(title[r.upperBound...]).trimmingCharacters(in: .whitespaces)
                              }
                              // Direct download URL for SoundCloud (b64 id + b64 title)
                              var directURL: URL? = nil
                              if scope == "s",
                                 let ib = item["id_base64"] as? String,
                                 let tb = item["title_base64"] as? String,
                                 let ibenc = ib.addingPercentEncoding(withAllowedCharacters: .urlPathAllowed),
                                 let tbenc = tb.addingPercentEncoding(withAllowedCharacters: .urlPathAllowed),
                                 let u = URL(string: "https://thetacloud.org/s/\(ibenc)/\(tbenc)/") {
                                  directURL = u
                              }
                              collectQ.sync {
                                  collected.append(SearchResult(source: source, title: ttl, artist: artist,
                                                                duration: dur, artworkURL: nil,
                                                                previewURL: directURL,
                                                                platform: plat, extId: idStr))
                              }
                          }
                      }.resume()
                  }

                  fetchOne(scope: "y")
                  fetchOne(scope: "s")

                  group.notify(queue: .main) { [weak self] in
                      guard let self = self else { return }
                      self.isSearching = false
                      if collected.isEmpty {
                          self.errorDetails = lastErr ?? "No results found."
                          self.showError = true
                      } else {
                          // dedupe by artist+title
                          var seen = Set<String>()
                          self.searchResults = collected.filter {
                              seen.insert("\($0.artist.lowercased())|\($0.title.lowercased())").inserted
                          }
                          self.showSearchResults = true
                      }
                  }
              }

              static func parseDuration(_ s: String) -> TimeInterval? {
                  let parts = s.split(separator: ":").compactMap { Double($0) }
                  if parts.count == 2 { return parts[0]*60 + parts[1] }
                  if parts.count == 3 { return parts[0]*3600 + parts[1]*60 + parts[2] }
                  return nil
              }
          }

          extension Notification.Name {
              static let downloadCenterChanged = Notification.Name("downloadCenterChanged")
          }

          SWIFT
      - name: Generate Icon
        run: |
          mkdir -p TrollMusicApp/TrollMusicApp/Assets.xcassets/AppIcon.appiconset
          echo 'import AppKit' > make_icon.swift
          echo 'let size = CGSize(width: 1024, height: 1024)' >> make_icon.swift
          echo 'let img = NSImage(size: size)' >> make_icon.swift
          echo 'img.lockFocus()' >> make_icon.swift
          echo 'let ctx = NSGraphicsContext.current!.cgContext' >> make_icon.swift
          echo 'let colors = [NSColor.systemPurple.cgColor, NSColor.black.cgColor] as CFArray' >> make_icon.swift
          echo 'let grad = CGGradient(colorsSpace: nil, colors: colors, locations: [0.0, 1.0])!' >> make_icon.swift
          echo 'ctx.drawLinearGradient(grad, start: CGPoint(x: 0, y: 1024), end: CGPoint(x: 1024, y: 0), options: [])' >> make_icon.swift
          echo 'let attr: [NSAttributedString.Key: Any] = [.font: NSFont.boldSystemFont(ofSize: 500), .foregroundColor: NSColor.white]' >> make_icon.swift
          echo 'let str = NSAttributedString(string: "AS", attributes: attr)' >> make_icon.swift
          echo 'let r = str.boundingRect(with: size, options: .usesLineFragmentOrigin)' >> make_icon.swift
          echo 'str.draw(at: NSPoint(x: (size.width - r.width)/2, y: (size.height - r.height)/2 - 80))' >> make_icon.swift
          echo 'img.unlockFocus()' >> make_icon.swift
          echo 'let data = img.tiffRepresentation!' >> make_icon.swift
          echo 'let rep = NSBitmapImageRep(data: data)!' >> make_icon.swift
          echo 'let png = rep.representation(using: .png, properties: [:])!' >> make_icon.swift
          echo 'let u = URL(fileURLWithPath: "TrollMusicApp/TrollMusicApp/Assets.xcassets/AppIcon.appiconset/icon-1024.png")' >> make_icon.swift
          echo 'try! png.write(to: u)' >> make_icon.swift
          swift make_icon.swift
          echo '{ "images": [ { "filename": "icon-1024.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" } ], "info": { "author": "xcode", "version": 1 } }' > TrollMusicApp/TrollMusicApp/Assets.xcassets/AppIcon.appiconset/Contents.json
          echo '{ "info": { "version": 1, "author": "xcode" } }' > TrollMusicApp/TrollMusicApp/Assets.xcassets/Contents.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: xcodegen generate --spec project.yml

      - name: Build and Archive
        run: |
          xcodebuild archive             -project TrollMusicApp.xcodeproj             -scheme TrollMusicApp             -configuration Release             -sdk iphoneos             -destination "generic/platform=iOS"             -archivePath "$PWD/build/TrollMusicApp.xcarchive"             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             DEVELOPMENT_TEAM=""             PROVISIONING_PROFILE=""             DEVELOPMENT_ASSET_PATHS=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/TrollMusicApp.xcarchive/Products/Applications/TrollMusicApp.app" Payload/
          /usr/bin/zip -r TrollMusicApp.ipa Payload
          test -f TrollMusicApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollMusicApp-IPA
          path: TrollMusicApp.ipa
          if-no-files-found: error
          retention-days: 14
