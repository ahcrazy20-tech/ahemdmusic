          //
          //  SmartDownloader.swift  —  REPLACEMENT FILE
          //  TrollMusicApp
          //
          //  Replaces the Magic-DL implementation from the original GitHub Actions workflow.
          //  Fixes:
          //    • Dead SoundCloud search (dynamic client_id bootstrap, no hard-coded key)
          //    • No fallback sources (adds iTunes, Deezer, YouTube Innertube)
          //    • Missing preview player (AVPlayer-based 30-second previews)
          //    • Fragile Cobalt client (v7 + v10, error handling, alive-server list)
          //    • YouTube playlist HTML scraping → Innertube browse API
          //    • Silent error swallowing → os_log + surfaced messages
          //    • Dead hidden-web-engine selectors → updated for current cobalt.tools
          //

          import Foundation
          import UIKit
          import SwiftUI
          import AVFoundation
          import WebKit
          import os.log

          // ---------------------------------------------------------------------------
          // MARK: - Logging
          // ---------------------------------------------------------------------------
          fileprivate let log = Logger(subsystem: "com.ahmedsoliman.trollmusicapp", category: "MagicDL")

          // ---------------------------------------------------------------------------
          // MARK: - Normalised search-result model
          // ---------------------------------------------------------------------------
          enum SearchResultSource: String, Codable {
              case soundcloud, itunes, deezer, youtube
          }

          struct SearchResult: Identifiable, Equatable {
              let id = UUID()
              let source: SearchResultSource
              let title: String
              let artist: String
              let duration: TimeInterval?         // seconds, nil if unknown
              let artworkURL: URL?
              let previewURL: URL?                // short preview for in-app listening
              let downloadURL: URL                // URL we feed to the downloader
              /// For YouTube results we feed the watch URL into Cobalt; for SC the permalink;
              /// for iTunes/Deezer we construct a YouTube search fallback because those
              /// services don't expose full-stream URLs without auth.
              var durationFormatted: String {
                  guard let d = duration else { return "" }
                  let s = Int(d)
                  return "• " + String(format: "%d:%02d", s / 60, s % 60)
              }
              static func == (lhs: SearchResult, rhs: SearchResult) -> Bool { lhs.id == rhs.id }
          }

          // ---------------------------------------------------------------------------
          // MARK: - SoundCloud models (kept for /tracks endpoint and client bootstrap)
          // ---------------------------------------------------------------------------
          struct SCResponse: Codable { let collection: [SCTrack] }
          struct SCTrack: Codable {
              let id: Int
              let title: String?
              let user: SCUser?
              let duration: Int?       // milliseconds
              let permalink_url: String?
              let artwork_url: String?
              let stream_url: String?  // needs ?client_id= suffix
          }
          struct SCUser: Codable { let username: String? }

          // ---------------------------------------------------------------------------
          // MARK: - iTunes model
          // ---------------------------------------------------------------------------
          struct ITunesResponse: Codable { let results: [ITunesTrack] }
          struct ITunesTrack: Codable {
              let trackName: String?
              let artistName: String?
              let trackTimeMillis: Int?
              let artworkUrl100: String?
              let previewUrl: String?
          }

          // ---------------------------------------------------------------------------
          // MARK: - Deezer model
          // ---------------------------------------------------------------------------
          struct DeezerResponse: Codable { let data: [DeezerTrack] }
          struct DeezerTrack: Codable {
              let title: String?
              let artist: DeezerArtist?
              let duration: Int?       // seconds
              let album: DeezerAlbum?
              let preview: String?
              let link: String?
          }
          struct DeezerArtist: Codable { let name: String? }
          struct DeezerAlbum: Codable { let cover_medium: String? }

          // ---------------------------------------------------------------------------
          // MARK: - YouTube Innertube models (lightweight)
          // ---------------------------------------------------------------------------
          struct YTSearchResponse: Codable {
              let contents: YTContents?
          }
          struct YTContents: Codable {
              let twoColumnSearchResultsRenderer: YTTwoCol?
              struct YTTwoCol: Codable {
                  let primaryContents: YTPrimary?
                  struct YTPrimary: Codable {
                      let sectionListRenderer: YTSectionList?
                      struct YTSectionList: Codable {
                          let contents: [YTSection]?
                      }
                  }
              }
          }
          struct YTSection: Codable {
              let itemSectionRenderer: YTItemSection?
              struct YTItemSection: Codable {
                  let contents: [YTItem]?
              }
          }
          struct YTItem: Codable {
              let videoRenderer: YTVideoRenderer?
          }
          struct YTVideoRenderer: Codable {
              let videoId: String?
              let title: YTTitle?
              let lengthText: YTText?
              let thumbnail: YTThumbnails?
              struct YTTitle: Codable { let runs: [YTRun]? }
              struct YTRun: Codable { let text: String? }
              struct YTText: Codable { let simpleText: String? }
              struct YTThumbnails: Codable { let thumbnails: [YTThumb]? }
              struct YTThumb: Codable { let url: String? }
          }

          struct YTPlaylistResponse: Codable {
              // Innertube browse response for a VL playlist – we only need the videoIds
              // so decode loosely via a helper rather than a deep nested struct.
          }

          // ---------------------------------------------------------------------------
          // MARK: - Cobalt models
          // ---------------------------------------------------------------------------
          struct CobaltResponse: Codable {
              var status: String?     // "redirect", "tunnel", "stream", "error", "picker", "success"
              var url: String?
              var text: String?       // error message
              var picker: [CobaltPickerItem]?
          }
          struct CobaltPickerItem: Codable { let type: String?; let url: String? }

          // ---------------------------------------------------------------------------
          // MARK: - Hidden web engine (updated selectors)
          // ---------------------------------------------------------------------------
          struct WebExtractor { let url: String; let js: String }

          class HiddenWebEngine: NSObject, WKNavigationDelegate, WKDownloadDelegate {
              var webView: WKWebView!
              var targetUrl: String = ""
              var targetName: String = ""
              var onSuccess: (() -> Void)?
              var onFailure: ((String) -> Void)?
              var attempt = 0
              var isDownloadStarted = false
              var extractors: [WebExtractor] = []

              override init() {
                  super.init()
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  let prefs = WKWebpagePreferences()
                  prefs.allowsContentJavaScript = true
                  config.defaultWebpagePreferences = prefs
                  self.webView = WKWebView(frame: .zero, configuration: config)
                  self.webView.navigationDelegate = self
              }

              func startExtraction(url: String, name: String,
                                   onSuccess: @escaping () -> Void,
                                   onFailure: @escaping (String) -> Void) {
                  self.targetUrl = url
                  self.targetName = name
                  self.onSuccess = onSuccess
                  self.onFailure = onFailure
                  self.attempt = 0
                  self.isDownloadStarted = false

                  self.extractors = [
                      WebExtractor(url: "https://cobalt.tools", js: """
                      (function(){
                        function fire(el, ev){ var e=new Event(ev,{bubbles:true}); el.dispatchEvent(e); }
                        setTimeout(function(){
                          var input = document.querySelector('input[placeholder*="url" i], input#url-input, input[type="url"]');
                          if(!input) return;
                          input.focus();
                          var nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
                          nativeInputValueSetter.call(input, '$$URL$$');
                          fire(input,'input'); fire(input,'change');
                          setTimeout(function(){
                            var btn = document.querySelector('button#download-button, form button[type="submit"], button[aria-label*="download" i]');
                            if(btn) btn.click();
                          }, 1200);
                        }, 2000);
                      })();
                      """),
                      WebExtractor(url: "https://y2mate.nu/", js: """
                      setTimeout(function(){
                        var input = document.getElementById('video') || document.querySelector('input[name="url"]');
                        if(input){ input.value = '$$URL$$'; input.dispatchEvent(new Event('input',{bubbles:true}));
                          setTimeout(function(){ var b=document.querySelector('button[type="submit"],button#btn-submit'); if(b)b.click(); }, 800);
                        }
                      }, 1500);
                      """)
                  ]
                  self.executeNextAttempt()
              }

              func executeNextAttempt() {
                  if attempt >= extractors.count {
                      self.onFailure?("All web extractors failed.")
                      return
                  }
                  self.isDownloadStarted = false
                  if let u = URL(string: extractors[attempt].url) {
                      log.info("Hidden engine attempt \(self.attempt+1) on \(self.extractors[self.attempt].url)")
                      self.webView.load(URLRequest(url: u))
                  }
              }

              func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                  let js = extractors[attempt].js.replacingOccurrences(of: "$$URL$$", with: self.targetUrl)
                  webView.evaluateJavaScript(js) { _, err in
                      if let err = err { log.warning("JS eval error: \(err.localizedDescription)") }
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 20) { [weak self] in
                      guard let self = self else { return }
                      if !self.isDownloadStarted {
                          self.attempt += 1
                          self.executeNextAttempt()
                      }
                  }
              }

              func webView(_ webView: WKWebView,
                           decidePolicyFor navigationResponse: WKNavigationResponse,
                           decisionHandler: @escaping (WKNavigationResponsePolicy) -> Void) {
                  if navigationResponse.canShowMIMEType == false { decisionHandler(.download); return }
                  if let mime = navigationResponse.response.mimeType?.lowercased(),
                     mime.contains("audio") || mime.contains("mpeg") || mime.contains("octet-stream")
                      || mime.contains("mp4") || mime.contains("webm") {
                      decisionHandler(.download); return
                  }
                  decisionHandler(.allow)
              }
              func webView(_ webView: WKWebView,
                           decidePolicyFor navigationAction: WKNavigationAction,
                           decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                  if navigationAction.shouldPerformDownload { decisionHandler(.download); return }
                  decisionHandler(.allow)
              }
              func webView(_ webView: WKWebView, navigationResponse: WKNavigationResponse, didBecome download: WKDownload) { download.delegate = self }
              func webView(_ webView: WKWebView, navigationAction: WKNavigationAction, didBecome download: WKDownload) { download.delegate = self }

              func download(_ download: WKDownload, decideDestinationUsing response: URLResponse,
                            suggestedFilename: String,
                            completionHandler: @escaping @MainActor @Sendable (URL?) -> Void) {
                  self.isDownloadStarted = true
                  let fm = FileManager.default
                  let destDir = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let clean = self.targetName.isEmpty ? suggestedFilename
                             : self.targetName.replacingOccurrences(of: "/", with: "-") + ".mp3"
                  let destPath = destDir.appendingPathComponent(clean)
                  try? fm.removeItem(at: destPath)
                  completionHandler(destPath)
              }
              func downloadDidFinish(_ download: WKDownload) { self.onSuccess?() }
              func download(_ download: WKDownload, didFailWithError error: Error, resumeData: Data?) {
                  log.error("Hidden engine download failed: \(error.localizedDescription)")
                  self.attempt += 1
                  self.executeNextAttempt()
              }
          }

          // ---------------------------------------------------------------------------
          // MARK: - Smart Downloader Manager
          // ---------------------------------------------------------------------------
          class SmartDownloaderManager: NSObject, ObservableObject, URLSessionDelegate, URLSessionDownloadDelegate {

              // -- published UI state -------------------------------------------------
              @Published var isDownloading = false
              @Published var isSearching = false
              @Published var statusMessage = ""
              @Published var downloadProgress: Double = 0.0
              @Published var showSuccess = false
              @Published var showError = false
              @Published var errorDetails = ""
              @Published var searchResults: [SearchResult] = []
              @Published var showSearchResults = false
              @Published var previewTrackId: UUID? = nil
              @Published var isPreviewPlaying = false

              // -- preview player -----------------------------------------------------
              var previewPlayer: AVPlayer?

              // -- download plumbing --------------------------------------------------
              var finalDownloadName = ""
              var downloadSession: URLSession!
              var hiddenEngine = HiddenWebEngine()

              // -- playlist queue -----------------------------------------------------
              var playlistQueue: [String] = []
              var playlistTotal = 0
              var playlistName = ""

              // -- dynamic SoundCloud client_id ---------------------------------------
              private var cachedSoundCloudClientId: String? {
                  get {
                      if let cached = UserDefaults.standard.string(forKey: "sc_client_id"),
                         let date = UserDefaults.standard.object(forKey: "sc_client_id_ts") as? Date,
                         Date().timeIntervalSince(date) < 86400 * 3 {       // 3 day TTL
                          return cached
                      }
                      return nil
                  }
                  set {
                      UserDefaults.standard.set(newValue, forKey: "sc_client_id")
                      UserDefaults.standard.set(Date(), forKey: "sc_client_id_ts")
                  }
              }

              override init() {
                  super.init()
                  let config = URLSessionConfiguration.default
                  config.httpMaximumConnectionsPerHost = 4
                  downloadSession = URLSession(configuration: config, delegate: self, delegateQueue: nil)
              }

              // -----------------------------------------------------------------------
              // MARK: - Preview
              // -----------------------------------------------------------------------
              func togglePreview(for result: SearchResult) {
                  if previewTrackId == result.id {
                      stopPreview()
                      return
                  }
                  guard let url = result.previewURL else {
                      // For results with no preview (e.g. YouTube), try to build one via
                      // a short iTunes lookup – here we just fail gracefully.
                      statusMessage = "No preview available for this source"
                      return
                  }
                  previewPlayer?.pause()
                  previewPlayer = AVPlayer(url: url)
                  previewPlayer?.play()
                  DispatchQueue.main.async {
                      self.previewTrackId = result.id
                      self.isPreviewPlaying = true
                  }
              }
              func stopPreview() {
                  previewPlayer?.pause()
                  previewPlayer = nil
                  DispatchQueue.main.async {
                      self.previewTrackId = nil
                      self.isPreviewPlaying = false
                  }
              }

              // -----------------------------------------------------------------------
              // MARK: - Aggregated Deep Search
              // -----------------------------------------------------------------------
              func performMagicSearch(query: String) {
                  let clean = query.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !clean.isEmpty else { return }
                  stopPreview()

                  DispatchQueue.main.async {
                      self.isSearching = true
                      self.statusMessage = "Searching across sources…"
                      self.searchResults = []
                      self.showSearchResults = false
                  }

                  let group = DispatchGroup()
                  var collected = [SearchResult]()
                  var errors = [String]()
                  let lock = NSLock()

                  // --- SoundCloud (with dynamic client_id) ---
                  group.enter()
                  soundCloudSearch(query: clean) { results, err in
                      lock.lock()
                      if let err = err { errors.append("SoundCloud: \(err)") }
                      collected.append(contentsOf: results)
                      lock.unlock()
                      group.leave()
                  }

                  // --- iTunes ---
                  group.enter()
                  itunesSearch(query: clean) { results, err in
                      lock.lock()
                      if let err = err { errors.append("iTunes: \(err)") }
                      collected.append(contentsOf: results)
                      lock.unlock()
                      group.leave()
                  }

                  // --- Deezer ---
                  group.enter()
                  deezerSearch(query: clean) { results, err in
                      lock.lock()
                      if let err = err { errors.append("Deezer: \(err)") }
                      collected.append(contentsOf: results)
                      lock.unlock()
                      group.leave()
                  }

                  // --- YouTube ---
                  group.enter()
                  youtubeSearch(query: clean) { results, err in
                      lock.lock()
                      if let err = err { errors.append("YouTube: \(err)") }
                      collected.append(contentsOf: results)
                      lock.unlock()
                      group.leave()
                  }

                  group.notify(queue: .main) { [weak self] in
                      guard let self = self else { return }
                      self.isSearching = false
                      // de-dupe by title+artist (fuzzy)
                      var seen = Set<String>()
                      let deduped = collected.filter { seen.insert("\($0.title.lowercased())|\($0.artist.lowercased())").inserted }
                      // sort: prefer results with previews first, then by title match quality
                      self.searchResults = deduped.sorted { a, b in
                          if (a.previewURL != nil) != (b.previewURL != nil) { return a.previewURL != nil }
                          return a.title.lowercased().hasPrefix(clean.lowercased())
                              && !b.title.lowercased().hasPrefix(clean.lowercased())
                      }
                      if self.searchResults.isEmpty {
                          self.errorDetails = errors.isEmpty ? "No results found." : errors.joined(separator: "\n")
                          self.showError = true
                      } else {
                          self.showSearchResults = true
                      }
                  }
              }

              // -----------------------------------------------------------------------
              // MARK: - Source adapters
              // -----------------------------------------------------------------------
              private func soundCloudSearch(query: String, completion: @escaping ([SearchResult], String?) -> Void) {
                  fetchSoundCloudClientId { clientId in
                      guard let cid = clientId,
                            let encoded = query.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                            let url = URL(string: "https://api-v2.soundcloud.com/search/tracks?q=\(encoded)&client_id=\(cid)&limit=25&link_partitioning=1") else {
                          completion([], "Could not obtain SoundCloud client id")
                          return
                      }
                      URLSession.shared.dataTask(with: url) { data, resp, err in
                          if let err = err { completion([], err.localizedDescription); return }
                          guard let data = data else { completion([], "Empty response"); return }
                          if let http = resp as? HTTPURLResponse, http.statusCode >= 400 {
                              completion([], "SoundCloud HTTP \(http.statusCode)")
                              return
                          }
                          do {
                              let sc = try JSONDecoder().decode(SCResponse.self, from: data)
                              let results = sc.collection.compactMap { t -> SearchResult? in
                                  guard let title = t.title,
                                        let permalink = t.permalink_url,
                                        let permUrl = URL(string: permalink) else { return nil }
                                  let artist = t.user?.username ?? "Unknown"
                                  var preview: URL?
                                  if let stream = t.stream_url {
                                      preview = URL(string: stream + "?client_id=\(cid)")
                                  }
                                  let art = t.artwork_url.flatMap(URL.init(string:))
                                  let dur = t.duration.map { Double($0)/1000.0 }
                                  return SearchResult(source: .soundcloud, title: title, artist: artist,
                                                      duration: dur, artworkURL: art,
                                                      previewURL: preview, downloadURL: permUrl)
                              }
                              completion(results, nil)
                          } catch {
                              completion([], "SoundCloud parse error: \(error.localizedDescription)")
                          }
                      }.resume()
                  }
              }

              /// Bootstrap a working SoundCloud client_id by scraping the public homepage.
              private func fetchSoundCloudClientId(completion: @escaping (String?) -> Void) {
                  if let cached = cachedSoundCloudClientId { completion(cached); return }
                  guard let home = URL(string: "https://soundcloud.com/") else { completion(nil); return }
                  URLSession.shared.dataTask(with: home) { [weak self] data, _, err in
                      guard let self = self, let data = data,
                            let html = String(data: data, encoding: .utf8), err == nil else {
                          completion(nil); return
                      }
                      // Find a script URL like https://a-v2.sndcdn.com/assets/app-<hash>.js
                      let scriptPattern = #"https://a-v2\.sndcdn\.com/assets/[A-Za-z0-9_-]+\.js"#
                      guard let scriptRange = html.range(of: scriptPattern, options: .regularExpression),
                            let scriptUrl = URL(string: String(html[scriptRange])) else {
                          completion(nil); return
                      }
                      URLSession.shared.dataTask(with: scriptUrl) { [weak self] jsData, _, _ in
                          guard let self = self, let jsData = jsData,
                                let js = String(data: jsData, encoding: .utf8) else { completion(nil); return }
                          // client_id:"xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" (32 alnum)
                          let cidPattern = #"client_id[:=]\s*["']([a-zA-Z0-9]{32})["']"#
                          guard let r = js.range(of: cidPattern, options: .regularExpression),
                                let matchRange = js[r].range(of: #"[a-zA-Z0-9]{32}"#, options: .regularExpression) else {
                              completion(nil); return
                          }
                          let cid = String(js[matchRange])
                          self.cachedSoundCloudClientId = cid
                          log.info("Bootstrapped SoundCloud client_id: \(cid)")
                          completion(cid)
                      }.resume()
                  }.resume()
              }

              private func itunesSearch(query: String, completion: @escaping ([SearchResult], String?) -> Void) {
                  guard let encoded = query.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                        let url = URL(string: "https://itunes.apple.com/search?term=\(encoded)&media=music&limit=20") else {
                      completion([], "Bad query"); return
                  }
                  URLSession.shared.dataTask(with: url) { data, resp, err in
                      if let err = err { completion([], err.localizedDescription); return }
                      guard let data = data else { completion([], "Empty response"); return }
                      do {
                          let it = try JSONDecoder().decode(ITunesResponse.self, from: data)
                          let results = it.results.compactMap { t -> SearchResult? in
                              guard let title = t.trackName, let artist = t.artistName else { return nil }
                              // iTunes has no free full-stream API, so we fall back to a
                              // YouTube search URL we can feed Cobalt.
                              let ytQuery = "\(artist) - \(title) audio"
                              guard let enc = ytQuery.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                                    let dl = URL(string: "https://www.youtube.com/results?search_query=\(enc)") else { return nil }
                              let art = t.artworkUrl100
                                  .flatMap { URL(string: $0.replacingOccurrences(of: "100x100bb", with: "600x600bb")) }
                              let dur = t.trackTimeMillis.map { Double($0)/1000.0 }
                              let prev = t.previewUrl.flatMap(URL.init(string:))
                              return SearchResult(source: .itunes, title: title, artist: artist,
                                                  duration: dur, artworkURL: art,
                                                  previewURL: prev, downloadURL: dl)
                          }
                          completion(results, nil)
                      } catch {
                          completion([], "iTunes parse: \(error.localizedDescription)")
                      }
                  }.resume()
              }

              private func deezerSearch(query: String, completion: @escaping ([SearchResult], String?) -> Void) {
                  guard let encoded = query.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                        let url = URL(string: "https://api.deezer.com/search?q=\(encoded)&limit=20") else {
                      completion([], "Bad query"); return
                  }
                  URLSession.shared.dataTask(with: url) { data, _, err in
                      if let err = err { completion([], err.localizedDescription); return }
                      guard let data = data else { completion([], "Empty"); return }
                      do {
                          let dz = try JSONDecoder().decode(DeezerResponse.self, from: data)
                          let results = dz.data.compactMap { t -> SearchResult? in
                              guard let title = t.title, let artist = t.artist?.name else { return nil }
                              let ytQuery = "\(artist) - \(title) audio"
                              guard let enc = ytQuery.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                                    let dl = URL(string: "https://www.youtube.com/results?search_query=\(enc)") else { return nil }
                              let art = t.album?.cover_medium.flatMap(URL.init(string:))
                              let dur = t.duration.map(Double.init)
                              let prev = t.preview.flatMap(URL.init(string:))
                              return SearchResult(source: .deezer, title: title, artist: artist,
                                                  duration: dur, artworkURL: art,
                                                  previewURL: prev, downloadURL: dl)
                          }
                          completion(results, nil)
                      } catch {
                          completion([], "Deezer parse: \(error.localizedDescription)")
                      }
                  }.resume()
              }

              private func youtubeSearch(query: String, completion: @escaping ([SearchResult], String?) -> Void) {
                  // Innertube web search — no API key needed
                  guard let url = URL(string: "https://www.youtube.com/youtubei/v1/search?prettyPrint=false") else {
                      completion([], "Bad URL"); return
                  }
                  var req = URLRequest(url: url)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  let body: [String:Any] = [
                      "context": ["client": ["clientName":"WEB","clientVersion":"2.20240101.00.00",
                                             "hl":"en","gl":"US"]],
                      "query": query
                  ]
                  req.httpBody = try? JSONSerialization.data(withJSONObject: body)
                  URLSession.shared.dataTask(with: req) { data, _, err in
                      if let err = err { completion([], err.localizedDescription); return }
                      guard let data = data else { completion([], "Empty"); return }
                      do {
                          // The Innertube response is deeply nested; instead of a giant
                          // Codable struct we walk it with JSONSerialization which is
                          // more forgiving across version bumps.
                          guard let json = try JSONSerialization.jsonObject(with: data) as? [String:Any],
                                let contents = json["contents"] as? [String:Any],
                                let twoCol = contents["twoColumnSearchResultsRenderer"] as? [String:Any],
                                let primary = twoCol["primaryContents"] as? [String:Any],
                                let sectionList = primary["sectionListRenderer"] as? [String:Any],
                                let sections = sectionList["contents"] as? [[String:Any]] else {
                              completion([], "YT shape changed"); return
                          }
                          var out = [SearchResult]()
                          for sec in sections {
                              guard let items = (sec["itemSectionRenderer"] as? [String:Any])?["contents"] as? [[String:Any]] else { continue }
                              for item in items {
                                  guard let vr = item["videoRenderer"] as? [String:Any],
                                        let vid = vr["videoId"] as? String,
                                        let titleArr = (vr["title"] as? [String:Any])?["runs"] as? [[String:Any]],
                                        let ttl = titleArr.first?["text"] as? String else { continue }
                                  let artist = (vr["ownerText"] as? [String:Any]).flatMap {
                                      (($0["runs"] as? [[String:Any]])?.first)?["text"] as? String
                                  } ?? "YouTube"
                                  let durSec: Double? = {
                                      guard let lt = vr["lengthText"] as? [String:Any],
                                            let txt = lt["simpleText"] as? String else { return nil }
                                      let parts = txt.split(separator: ":").compactMap { Double($0) }
                                      if parts.count == 2 { return parts[0]*60 + parts[1] }
                                      if parts.count == 3 { return parts[0]*3600 + parts[1]*60 + parts[2] }
                                      return nil
                                  }()
                                  var art: URL?
                                  if let thumbs = ((vr["thumbnail"] as? [String:Any])?["thumbnails"] as? [[String:Any]])?.last,
                                     let u = thumbs["url"] as? String {
                                      art = URL(string: u)
                                  }
                                  out.append(SearchResult(source: .youtube, title: ttl, artist: artist,
                                                          duration: durSec, artworkURL: art,
                                                          previewURL: nil,
                                                          downloadURL: URL(string: "https://www.youtube.com/watch?v=\(vid)")!))
                                  if out.count >= 20 { break }
                              }
                              if out.count >= 20 { break }
                          }
                          completion(out, nil)
                      } catch {
                          completion([], "YT parse: \(error.localizedDescription)")
                      }
                  }.resume()
              }

              // -----------------------------------------------------------------------
              // MARK: - Download entry points
              // -----------------------------------------------------------------------
              func download(result: SearchResult) {
                  showSearchResults = false
                  let cleanName = "\(result.artist) - \(result.title)".replacingOccurrences(of: "/", with: "-")
                  statusMessage = "Queuing \(cleanName)…"
                  let urlStr = result.downloadURL.absoluteString
                  // YouTube "results?search_query=…" urls need resolving first: pick first
                  // video via a quick Innertube call.
                  if urlStr.contains("youtube.com/results"),
                     let q = URLComponents(string: urlStr)?.queryItems?.first(where: { $0.name == "search_query" })?.value {
                      resolveYouTubeSearchToFirstVideo(query: q) { [weak self] watchUrl in
                          guard let self = self, let w = watchUrl else {
                              DispatchQueue.main.async { self?.errorDetails = "Could not resolve YouTube search"; self?.showError = true }
                              return
                          }
                          self.downloadLinkOrPlaylist(urlStr: w, name: cleanName)
                      }
                      return
                  }
                  downloadLinkOrPlaylist(urlStr: urlStr, name: cleanName)
              }

              private func resolveYouTubeSearchToFirstVideo(query: String, completion: @escaping (String?) -> Void) {
                  youtubeSearch(query: query) { results, _ in
                      completion(results.first?.downloadURL.absoluteString)
                  }
              }

              func downloadLinkOrPlaylist(urlStr: String, name: String) {
                  guard !urlStr.isEmpty else { return }
                  stopPreview()
                  if urlStr.contains("youtube.com/playlist") || urlStr.contains("list=") {
                      fetchYouTubePlaylist(urlStr: urlStr, pName: name.isEmpty ? "YT_Playlist" : name)
                  } else {
                      tryDownloadCobalt(urlStr: urlStr, name: name)
                  }
              }

              // -----------------------------------------------------------------------
              // MARK: - YouTube playlist via Innertube (no HTML scraping)
              // -----------------------------------------------------------------------
              private func fetchYouTubePlaylist(urlStr: String, pName: String) {
                  DispatchQueue.main.async {
                      self.isDownloading = true
                      self.statusMessage = "Extracting playlist…"
                  }
                  // Extract playlist id from ?list=PLxxx or /playlist?list=PLxxx
                  guard let comps = URLComponents(string: urlStr),
                        let listId = comps.queryItems?.first(where: { $0.name == "list" })?.value else {
                      DispatchQueue.main.async { self.isDownloading = false; self.showError = true; self.errorDetails = "Bad playlist URL"; }
                      return
                  }
                  let browseId = "VL" + listId
                  guard let url = URL(string: "https://www.youtube.com/youtubei/v1/browse?prettyPrint=false") else { return }
                  var req = URLRequest(url: url)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  let body: [String:Any] = [
                      "context": ["client": ["clientName":"WEB","clientVersion":"2.20240101.00.00"]],
                      "browseId": browseId
                  ]
                  req.httpBody = try? JSONSerialization.data(withJSONObject: body)
                  URLSession.shared.dataTask(with: req) { [weak self] data, _, err in
                      guard let self = self, let data = data else {
                          DispatchQueue.main.async { self?.isDownloading = false; self?.showError = true; self?.errorDetails = err?.localizedDescription ?? "Playlist fetch failed"; }
                          return
                      }
                      var ids = [String]()
                      // Walk JSON looking for "videoId" strings
                      func walk(_ obj: Any) {
                          if let d = obj as? [String:Any] {
                              if let vid = d["videoId"] as? String, vid.count == 11,
                                 (d["title"] is [String:Any] || d["videoRenderer"] != nil || d["playlistVideoRenderer"] != nil),
                                 !ids.contains(vid) {
                                  ids.append(vid)
                              }
                              for v in d.values { walk(v) }
                          } else if let a = obj as? [Any] {
                              for v in a { walk(v) }
                          }
                      }
                      (try? JSONSerialization.jsonObject(with: data)).map(walk)
                      DispatchQueue.main.async {
                          if ids.isEmpty {
                              self.isDownloading = false
                              self.showError = true
                              self.errorDetails = "Playlist empty or private."
                          } else {
                              self.playlistQueue = ids
                              self.playlistTotal = ids.count
                              self.playlistName = pName
                              self.processNextPlaylistSong()
                          }
                      }
                  }.resume()
              }

              private func processNextPlaylistSong() {
                  guard !playlistQueue.isEmpty else {
                      DispatchQueue.main.async {
                          self.isDownloading = false
                          self.showSuccess = true
                          MusicManager.shared.loadSongs()
                      }
                      return
                  }
                  let nextVid = playlistQueue.removeFirst()
                  let url = "https://www.youtube.com/watch?v=\(nextVid)"
                  let currentNum = playlistTotal - playlistQueue.count
                  let name = "\(playlistName) - Track \(currentNum)"
                  DispatchQueue.main.async { self.statusMessage = "Downloading \(currentNum)/\(self.playlistTotal)…" }
                  tryDownloadCobalt(urlStr: url, name: name, isPlaylist: true)
              }

              // -----------------------------------------------------------------------
              // MARK: - Robust Cobalt client (v7 + v10)
              // -----------------------------------------------------------------------
              private func cobaltServers() -> [String] {
                  [
                      "https://api.cobalt.tools",
                      "https://cobalt.api.timeless.top",
                      "https://co.wuk.sh",
                      "https://co.eepy.today",
                      "https://dl.imput.net",
                      "https://cobalt.playpriv.net"
                  ]
              }

              func tryDownloadCobalt(urlStr: String, name: String, isPlaylist: Bool = false, attempt: Int = 0) {
                  if !isPlaylist && attempt == 0 {
                      DispatchQueue.main.async {
                          self.isDownloading = true
                          self.downloadProgress = 0.0
                          self.statusMessage = "Contacting download service…"
                      }
                  }
                  let servers = cobaltServers()
                  guard attempt < servers.count else {
                      // Fallback to hidden web engine
                      DispatchQueue.main.async { self.statusMessage = "Trying web extractor…" }
                      self.hiddenEngine.startExtraction(url: urlStr, name: name,
                          onSuccess: {
                              DispatchQueue.main.async {
                                  if isPlaylist { self.processNextPlaylistSong() }
                                  else { self.isDownloading = false; self.showSuccess = true; MusicManager.shared.loadSongs() }
                              }
                          },
                          onFailure: { msg in
                              DispatchQueue.main.async {
                                  if isPlaylist { self.processNextPlaylistSong() }
                                  else { self.errorDetails = msg; self.isDownloading = false; self.showError = true }
                              }
                          })
                      return
                  }
                  let server = servers[attempt]
                  DispatchQueue.main.async { self.statusMessage = "Bypassing (server \(attempt+1)/\(servers.count))…" }

                  // Try v10 endpoint first, fall back to v7
                  cobaltRequestV10(server: server, urlStr: urlStr) { [weak self] audioUrl in
                      guard let self = self else { return }
                      if let audioUrl = audioUrl {
                          self.finalDownloadName = (name.isEmpty ? "MagicDL_\(UUID().uuidString.prefix(4))" : name)
                              .replacingOccurrences(of: "/", with: "-")
                          self.downloadSession.downloadTask(with: audioUrl).resume()
                      } else {
                          self.cobaltRequestV7(server: server, urlStr: urlStr) { audioUrl2 in
                              if let audioUrl2 = audioUrl2 {
                                  self.finalDownloadName = (name.isEmpty ? "MagicDL_\(UUID().uuidString.prefix(4))" : name)
                                      .replacingOccurrences(of: "/", with: "-")
                                  self.downloadSession.downloadTask(with: audioUrl2).resume()
                              } else {
                                  self.tryDownloadCobalt(urlStr: urlStr, name: name, isPlaylist: isPlaylist, attempt: attempt + 1)
                              }
                          }
                      }
                  }
              }

              private func cobaltRequestV7(server: String, urlStr: String, completion: @escaping (URL?) -> Void) {
                  guard let apiUrl = URL(string: server + "/api/json") else { completion(nil); return }
                  var req = URLRequest(url: apiUrl)
                  req.httpMethod = "POST"
                  req.timeoutInterval = 20
                  req.setValue("application/json", forHTTPHeaderField: "Accept")
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.setValue(server, forHTTPHeaderField: "Origin")
                  req.setValue(server, forHTTPHeaderField: "Referer")
                  let params: [String:Any] = ["url": urlStr, "isAudioOnly": true,
                                              "aFormat": "mp3", "isNoTTWatermark": true]
                  req.httpBody = try? JSONSerialization.data(withJSONObject: params)
                  URLSession.shared.dataTask(with: req) { [weak self] data, resp, err in
                      guard let self = self, let data = data else { completion(nil); return }
                      if let err = err { log.warning("v7 \(server) error: \(err.localizedDescription)"); completion(nil); return }
                      if let http = resp as? HTTPURLResponse, http.statusCode >= 400 {
                          log.warning("v7 \(server) HTTP \(http.statusCode)"); completion(nil); return
                      }
                      do {
                          let res = try JSONDecoder().decode(CobaltResponse.self, from: data)
                          if res.status == "error" {
                              log.warning("v7 error: \(res.text ?? "?")"); completion(nil); return
                          }
                          if let u = res.url, let url = URL(string: u) { completion(url); return }
                          if let picker = res.picker?.first(where: { $0.type == "audio" }),
                             let u = picker.url, let url = URL(string: u) { completion(url); return }
                          completion(nil)
                      } catch {
                          log.warning("v7 parse: \(error.localizedDescription)")
                          completion(nil)
                      }
                  }.resume()
              }

              private func cobaltRequestV10(server: String, urlStr: String, completion: @escaping (URL?) -> Void) {
                  guard let apiUrl = URL(string: server + "/") else { completion(nil); return }
                  var req = URLRequest(url: apiUrl)
                  req.httpMethod = "POST"
                  req.timeoutInterval = 20
                  req.setValue("application/json", forHTTPHeaderField: "Accept")
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.setValue(server, forHTTPHeaderField: "Origin")
                  let params: [String:Any] = ["url": urlStr, "downloadMode": "audio", "audioFormat": "mp3"]
                  req.httpBody = try? JSONSerialization.data(withJSONObject: params)
                  URLSession.shared.dataTask(with: req) { [weak self] data, resp, err in
                      guard let self = self, let data = data else { completion(nil); return }
                      if let err = err { log.warning("v10 \(server) error: \(err.localizedDescription)"); completion(nil); return }
                      if let http = resp as? HTTPURLResponse, http.statusCode >= 400 {
                          log.warning("v10 \(server) HTTP \(http.statusCode)"); completion(nil); return
                      }
                      do {
                          let res = try JSONDecoder().decode(CobaltResponse.self, from: data)
                          if res.status == "error" {
                              log.warning("v10 error: \(res.text ?? "?")"); completion(nil); return
                          }
                          if let u = res.url, let url = URL(string: u) { completion(url); return }
                          if let picker = res.picker?.first(where: { $0.type == "audio" }),
                             let u = picker.url, let url = URL(string: u) { completion(url); return }
                          completion(nil)
                      } catch {
                          log.warning("v10 parse: \(error.localizedDescription)")
                          completion(nil)
                      }
                  }.resume()
              }

              // -----------------------------------------------------------------------
              // MARK: - URLSessionDownloadDelegate
              // -----------------------------------------------------------------------
              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                              didWriteData bytesWritten: Int64, totalBytesWritten: Int64,
                              totalBytesExpectedToWrite: Int64) {
                  guard totalBytesExpectedToWrite > 0 else { return }
                  let progress = Double(totalBytesWritten) / Double(totalBytesExpectedToWrite)
                  DispatchQueue.main.async {
                      self.downloadProgress = progress
                      if self.playlistTotal == 0 {
                          self.statusMessage = "Downloading… \(Int(progress*100))%"
                      }
                  }
              }

              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                              didFinishDownloadingTo location: URL) {
                  let fm = FileManager.default
                  guard let attrs = try? fm.attributesOfItem(atPath: location.path),
                        let size = attrs[.size] as? Int64, size > 50_000 else {
                      DispatchQueue.main.async {
                          self.errorDetails = "Downloaded file is too small/corrupt."
                          self.showError = true
                          self.isDownloading = false
                      }
                      return
                  }
                  let destDir = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let destPath = destDir.appendingPathComponent(finalDownloadName + ".mp3")
                  try? fm.removeItem(at: destPath)
                  do {
                      try fm.moveItem(at: location, to: destPath)
                      try fm.setAttributes([.protectionKey: FileProtectionType.none], ofItemAtPath: destPath.path)
                  } catch {
                      log.error("Move failed: \(error.localizedDescription)")
                  }
                  DispatchQueue.main.async {
                      if self.playlistTotal > 0 { self.processNextPlaylistSong() }
                      else { self.isDownloading = false; self.showSuccess = true; MusicManager.shared.loadSongs() }
                  }
              }
          }

          SWIFT
      - name: Generate Icon
        run: |
          mkdir -p TrollMusicApp/TrollMusicApp/Assets.xcassets/AppIcon.appiconset
          echo 'import AppKit' > make_icon.swift
          echo 'let size = CGSize(width: 1024, height: 1024)' >> make_icon.swift
          echo 'let img = NSImage(size: size)' >> make_icon.swift
          echo 'img.lockFocus()' >> make_icon.swift
          echo 'let ctx = NSGraphicsContext.current!.cgContext' >> make_icon.swift
          echo 'let colors = [NSColor.systemPurple.cgColor, NSColor.black.cgColor] as CFArray' >> make_icon.swift
          echo 'let grad = CGGradient(colorsSpace: nil, colors: colors, locations: [0.0, 1.0])!' >> make_icon.swift
          echo 'ctx.drawLinearGradient(grad, start: CGPoint(x: 0, y: 1024), end: CGPoint(x: 1024, y: 0), options: [])' >> make_icon.swift
          echo 'let attr: [NSAttributedString.Key: Any] = [.font: NSFont.boldSystemFont(ofSize: 500), .foregroundColor: NSColor.white]' >> make_icon.swift
          echo 'let str = NSAttributedString(string: "AS", attributes: attr)' >> make_icon.swift
          echo 'let r = str.boundingRect(with: size, options: .usesLineFragmentOrigin)' >> make_icon.swift
          echo 'str.draw(at: NSPoint(x: (size.width - r.width)/2, y: (size.height - r.height)/2 - 80))' >> make_icon.swift
          echo 'img.unlockFocus()' >> make_icon.swift
          echo 'let data = img.tiffRepresentation!' >> make_icon.swift
          echo 'let rep = NSBitmapImageRep(data: data)!' >> make_icon.swift
          echo 'let png = rep.representation(using: .png, properties: [:])!' >> make_icon.swift
          echo 'let u = URL(fileURLWithPath: "TrollMusicApp/TrollMusicApp/Assets.xcassets/AppIcon.appiconset/icon-1024.png")' >> make_icon.swift
          echo 'try! png.write(to: u)' >> make_icon.swift
          swift make_icon.swift
          echo '{ "images": [ { "filename": "icon-1024.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" } ], "info": { "author": "xcode", "version": 1 } }' > TrollMusicApp/TrollMusicApp/Assets.xcassets/AppIcon.appiconset/Contents.json
          echo '{ "info": { "version": 1, "author": "xcode" } }' > TrollMusicApp/TrollMusicApp/Assets.xcassets/Contents.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: xcodegen generate --spec project.yml

      - name: Build and Archive
        run: |
          xcodebuild archive             -project TrollMusicApp.xcodeproj             -scheme TrollMusicApp             -configuration Release             -sdk iphoneos             -destination "generic/platform=iOS"             -archivePath "$PWD/build/TrollMusicApp.xcarchive"             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             DEVELOPMENT_TEAM=""             PROVISIONING_PROFILE=""             DEVELOPMENT_ASSET_PATHS=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/TrollMusicApp.xcarchive/Products/Applications/TrollMusicApp.app" Payload/
          /usr/bin/zip -r TrollMusicApp.ipa Payload
          test -f TrollMusicApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollMusicApp-IPA
          path: TrollMusicApp.ipa
          if-no-files-found: error
          retention-days: 14
