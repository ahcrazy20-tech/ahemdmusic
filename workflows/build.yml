name: Build TrollMusicApp

# ---------------------------------------------------------------------------
# This is the workflow that belongs at .github/workflows/build.yml.
#
# The OLD one carried a copy of every Swift file inside itself: its first steps
# deleted the real sources (`find . -name "*.swift" -delete`) and wrote those
# frozen copies back. Editing the app in this repo therefore changed nothing in
# the IPA — the build kept compiling a snapshot from months ago. That is why
# whole features (AI playlists, duplicate finder, lyrics, …) "were added" and
# still never showed up in the installed app.
#
# This one is 30 lines and never needs to be regenerated: it runs
# `scripts/ci_build.sh`, which compiles whatever is in
# TrollMusicApp/TrollMusicApp/. Add a .swift file to the repo and it ships.
#
# INSTALL (once, by hand — the assistant's GitHub App cannot write here):
#   keep this file's contents at .github/workflows/build.yml
# ---------------------------------------------------------------------------

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write   # post compile errors back on the commit
  actions: write    # upload the IPA + build log

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build the app from the repo's own sources
        run: bash scripts/ci_build.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollMusicApp-IPA
          path: TrollMusicApp.ipa
          if-no-files-found: error
          retention-days: 30
